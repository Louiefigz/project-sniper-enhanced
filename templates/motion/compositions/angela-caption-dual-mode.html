<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"mode","type":"enum","label":"Skin (switches per background)","default":"footage","options":[{"value":"footage","label":"Footage — white whisper, chest band"},{"value":"canvas","label":"Canvas — white pill on lime takeovers"}]},
    {"id":"cue1","type":"string","label":"Cue 1 (1-4 words; *asterisk* one key word for inline bold)","default":""},
    {"id":"cue2","type":"string","label":"Cue 2 (empty = end of chain)","default":""},
    {"id":"cue3","type":"string","label":"Cue 3","default":""},
    {"id":"cue4","type":"string","label":"Cue 4","default":""},
    {"id":"cue5","type":"string","label":"Cue 5","default":""},
    {"id":"cue6","type":"string","label":"Cue 6","default":""},
    {"id":"at1","type":"number","label":"Cue 1 at (s; 0 = ON at the cut frame)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Cue 2 at (s)","default":0.8,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Cue 3 at (s)","default":1.6,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at4","type":"number","label":"Cue 4 at (s)","default":2.4,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at5","type":"number","label":"Cue 5 at (s)","default":3.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at6","type":"number","label":"Cue 6 at (s)","default":4.0,"min":0,"max":30,"step":0.05,"unit":"s"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: ANGELA-CAPTION-DUAL-MODE (angela pack #4)
    Reference: the whisper caption preset + canvas pill skin — 4/4 studied
    reels; every second of runtime renders through it. ZERO karaoke, ZERO
    color-in-captions anywhere in 164.7s of reference footage.
    Transparent 1080x1920 overlay -> render `--format mov` (ProRes 4444).

    TWO SKINS (the skin switches per background — white text vanishes on
    lime, so takeovers get the pill):
      - FOOTAGE: white semibold ~2.1%H, sentence case, soft shadow, NO
        box/stroke, chest band center x0.5 y0.62. 1-4 words per cue. Inline
        BOLD on one key word (*asterisks*) is the ONLY in-line emphasis.
      - CANVAS: white SQUARE-corner pill (r6), charcoal bold ~1.8%H text,
        center x0.5 at the takeover pill slot y0.78. 2-5 words. Cue 1 is
        already ON at the cut frame (at1 = 0).

    CONTRACT for the PRODUCER compositing stage:
      - HARD REPLACE-PER-CUE: cueN instantly replaces cueN-1 at atN (0.3-1.2s
        cadence). No fades, no karaoke, no color — emphasis beyond inline
        bold is promoted IN PLACE to the #2 staircase-lockup shout (its own
        entry), never carried by this whisper layer.
      - The last set cue HOLDS to D; the compositor owns both seams.
      - EMPTY-DEFAULTS LAW (G21): cue1..6 default EMPTY — unset renders
        NOTHING; the demo chain activates only when ALL are unset.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · angela-caption-dual-mode</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;           /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #acd-root { position: relative; width: 1080px; height: 1920px; }

      /* FOOTAGE skin: bare whisper words on the chest band (y0.62). */
      #acd-stage {
        position: absolute;
        left: 540px;
        top: 1190px;
        transform: translate(-50%, -50%);
        width: 940px;
        text-align: center;
      }
      .acd-cue {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 940px;
        font-size: 40px;                   /* ~2.1%H */
        font-weight: 600;
        line-height: 1.25;
        color: #F8F8F8;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.5);
        text-wrap: balance;
        will-change: opacity;
      }
      .acd-cue b { font-weight: 800; }     /* inline bold = the ONLY emphasis */

      /* CANVAS skin: white square-corner pill at the takeover slot (y0.78);
         charcoal bold text; shadow-free bare words never sit on lime. */
      #acd-root.canvas #acd-stage { top: 1497px; }
      #acd-root.canvas .acd-cue {
        width: auto;
        white-space: nowrap;
        background: #FCFAFB;
        border-radius: 6px;
        padding: 15px 28px;
        font-size: 35px;                   /* ~1.8%H */
        font-weight: 700;
        color: #3A3F3D;
        text-shadow: none;
        box-shadow: 0 6px 22px rgba(34, 44, 0, 0.16);
      }
    </style>
  </head>
  <body>
    <div
      id="acd-root"
      data-composition-id="angela-caption-dual-mode"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="4"
    >
      <div id="acd-stage" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("acd-root");
        const D = parseFloat(root.dataset.duration) || 4;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          mode: "footage",
          cue1: "", cue2: "", cue3: "", cue4: "", cue5: "", cue6: "",
          at1: 0, at2: 0.8, at3: 1.6, at4: 2.4, at5: 3.2, at6: 4.0,
        };
        // PREVIEW-ONLY demo cue chain (activates only when ALL cues are unset).
        const SAMPLE = { cue1: "here is the", cue2: "one *mistake*", cue3: "everyone makes" };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const cueKeys = ["cue1", "cue2", "cue3", "cue4", "cue5", "cue6"];
        const isPreview = cueKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        if (String(vars.mode) === "canvas") root.classList.add("canvas");

        // Build the cue spans (stacked in place — hard replace, no reflow).
        // *asterisk* runs render as inline bold (the only in-line emphasis).
        const stage = document.getElementById("acd-stage");
        const cues = [];
        cueKeys.forEach(function (k, i) {
          const text = (vars[k] == null ? "" : String(vars[k])).trim();
          if (!text) return;
          const el = document.createElement("div");
          el.className = "acd-cue";
          text.split(/(\*[^*]+\*)/).forEach(function (chunk) {
            if (!chunk) return;
            const isBold = chunk.charAt(0) === "*" && chunk.charAt(chunk.length - 1) === "*";
            const node = isBold ? document.createElement("b") : document.createTextNode(chunk);
            if (isBold) node.textContent = chunk.slice(1, -1);
            el.appendChild(node);
          });
          stage.appendChild(el);
          const raw = Number(vars["at" + (i + 1)]);
          const at = isFinite(raw) ? Math.max(0, Math.min(raw, Math.max(0, D - 0.05))) : 0;
          cues.push({ el: el, at: at });
        });
        cues.sort(function (a, b) { return a.at - b.at; });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // HARD REPLACE-PER-CUE: each cue pops ON at its frame and the previous
        // cue clears the SAME frame. No fades anywhere (whisper doctrine).
        cues.forEach(function (c, i) {
          if (c.at > 0) {
            tl.set(c.el, { autoAlpha: 0 }, 0);
            tl.set(c.el, { autoAlpha: 1 }, c.at);
          }
          const next = cues[i + 1];
          if (next && next.at > c.at) tl.set(c.el, { autoAlpha: 0 }, next.at);
          else if (next) tl.set(c.el, { autoAlpha: 0 }, 0.0001); // degenerate: same-time cues
        });

        // Keep the paused timeline non-empty even for a single always-on cue.
        tl.set({}, {}, Math.max(0, D - 0.01));

        // Last cue HOLDS to D — no self exit; the compositor owns both seams.
        tl.seek(0);
        window.__timelines["angela-caption-dual-mode"] = tl;
      })();
    </script>
  </body>
</html>
