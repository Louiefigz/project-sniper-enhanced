<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"bg","type":"color","label":"Fill color","default":"#FFFFFF"},
    {"id":"radiusPx","type":"number","label":"Corner radius (px)","default":28,"min":0,"max":400,"step":2,"unit":"px"},
    {"id":"opacity","type":"number","label":"Fill opacity (0-1)","default":1,"min":0,"max":1,"step":0.05},
    {"id":"widthPx","type":"number","label":"Width (px)","default":640,"min":20,"max":1920,"step":2,"unit":"px"},
    {"id":"heightPx","type":"number","label":"Height (px)","default":360,"min":20,"max":1080,"step":2,"unit":"px"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: CONTAINER-SHAPE-WIDE (Primitives, 16:9)
    The LANDSCAPE sibling of container-shape (9:16) — same bare, shadowless
    rounded-rectangle primitive on the 1920x1080 longform canvas, centered at
    the true frame center. Paired -wide variant per repo convention
    (icon-badge-wide / kinetic-quote-wide): canvas is fixed per comp via
    data-width/height, so aspect = a sibling file, not a variable.
    Transparent 1920x1080 overlay -> render with `--format mov` (ProRes 4444).

    CONTRACT: identical to container-shape.html — bg / radiusPx / opacity /
    widthPx / heightPx variables, subtle scale-in + fade-out ending at D,
    RENDER LENGTH = the root data-duration attribute (rewritten per window).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · container-shape-wide</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #cs-root { position: relative; width: 1920px; height: 1080px; }

      /* .stage OWNS the centering transform; GSAP animates only the box. */
      .stage {
        position: absolute;
        left: 960px;
        top: 540px;
        transform: translate(-50%, -50%);
      }
      #cs-box { will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div
      id="cs-root"
      data-composition-id="container-shape-wide"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="3"
    >
      <div class="stage">
        <div id="cs-box" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("cs-root");
        const D = parseFloat(root.dataset.duration) || 3;

        const defaults = {
          bg: "#FFFFFF", radiusPx: 28, opacity: 1, widthPx: 640, heightPx: 360,
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        const box = document.getElementById("cs-box");
        const w = Math.max(20, Number(vars.widthPx) || 640);
        const h = Math.max(20, Number(vars.heightPx) || 360);
        const radius = Math.max(0, Number(vars.radiusPx) || 0);
        const alpha = Math.min(1, Math.max(0, Number(vars.opacity)));
        const fill = isFinite(alpha) ? alpha : 1;
        box.style.width = w + "px";
        box.style.height = h + "px";
        box.style.borderRadius = radius + "px";
        box.style.background = String(vars.bg);

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Subtle house scale-in — from a visible 0.92 (never from nothing)
        // up to the operator's target fill opacity.
        tl.fromTo("#cs-box", { opacity: 0, scale: 0.92 },
          { opacity: fill, scale: 1, duration: 0.45, ease: "power3.out" }, 0);

        // House exit — fade ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.18);
        tl.to("#cs-box", { opacity: 0, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["container-shape-wide"] = tl;
      })();
    </script>
  </body>
</html>
