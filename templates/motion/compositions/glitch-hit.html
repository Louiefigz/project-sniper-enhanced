<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"durMs","type":"number","label":"Hit length (ms) — effect is gone after this","default":400,"min":200,"max":800,"step":25,"unit":"ms"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: GLITCH-HIT (16:9 full-frame emphasis hit)
    A 300-500ms emphasis hit for long-form: a one-beat B&W static slam OVER
    the footage — desaturating gray wash, heavy VERTICAL streak noise,
    horizontal displacement slices — then INSTANTLY gone (hard cut, no fade),
    so the beat punctuates a line without covering the next one.

    CONTRACT for the PRODUCER compositing stage:
      - anchor "free-band" (or any alpha anchor) -> render `--format mov`
        (ProRes 4444 ALPHA). The frame is SEMI-TRANSPARENT everywhere — the
        underlying footage shows through the wash and streaks, reading as
        desaturated + torn. Verify alpha RGBA-PNG-first (edge G18 — never
        ProRes over lavfi color).
      - durMs is the ONLY variable: the hit holds full intensity for
        min(durMs/1000, D) seconds, re-rolling its static pattern twice
        (thirds), then snaps to fully transparent. Size the plan window at
        ~durMs; a longer window just renders transparent after the hit.
      - DETERMINISM: zero Math.random. All streak/slice geometry comes from
        a fixed-seed LCG evaluated once at load — every render of this file
        produces byte-identical frames. Flicker states are discrete tl.set
        swaps at fixed times (seek-safe in both directions).
      - No content variables — the effect IS the content, so there is no
        demo-content/empty-defaults split and nothing to leak (G21 n/a).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · glitch-hit</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;           /* composites OVER footage */
        font-family: var(--font);
      }
      #gh-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      #gh-stage {
        position: absolute; inset: 0;
        overflow: hidden;
        will-change: transform, opacity;
      }
      /* Desaturating gray wash + edge vignette: a neutral-gray semi-alpha
         layer pulls the footage toward B&W; the vignette adds the hit's
         contrast slam. */
      #gh-wash {
        position: absolute; inset: 0;
        background:
          radial-gradient(1600px 1000px at 50% 50%,
            rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.42) 100%),
          rgba(127, 128, 130, 0.45);
        will-change: opacity;
      }
      .gh-frame { position: absolute; inset: 0; will-change: opacity; }
      .gh-streak {
        position: absolute;
        top: -24px; bottom: -24px;         /* bleed so stage x-jitter shows no seam */
      }
      .gh-slice {
        position: absolute;
        left: -120px; right: -120px;       /* bleed for the horizontal displacement */
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 1px solid rgba(0, 0, 0, 0.18);
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div
      id="gh-root"
      data-composition-id="glitch-hit"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="0.5"
    >
      <div id="gh-stage" class="clip" data-start="0" data-duration="60" data-track-index="1">
        <div id="gh-wash"></div>
        <div id="gh-f1" class="gh-frame"></div>
        <div id="gh-f2" class="gh-frame"></div>
        <div id="gh-f3" class="gh-frame"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("gh-root");
        const D = parseFloat(root.dataset.duration) || 0.5;

        const defaults = { durMs: 400 };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const durMs = Math.max(120, Math.min(isFinite(Number(vars.durMs)) ? Number(vars.durMs) : 400, 1500));
        // Reserve the final encoded frame as transparent. HyperFrames samples
        // at 30 fps, so a hit whose requested length exactly equals the
        // composition window must clear one frame before D instead of relying
        // on the overlay enable-window to hide a still-opaque terminal frame.
        const T = Math.min(durMs / 1000, Math.max(0, D - (1 / 30)));

        // Fixed-seed LCG (Numerical Recipes constants) — deterministic across
        // every render; NEVER Math.random (determinism law).
        let seed = 0x5eed1337 >>> 0;
        const rand = function () {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };

        // Build one static "frame" of the hit: heavy vertical streaks +
        // horizontal displacement slices. Three frames = the flicker states.
        const buildFrame = function (host) {
          // Vertical streak static: mixed dark/light hairlines and bands.
          for (let i = 0; i < 78; i += 1) {
            const s = document.createElement("div");
            s.className = "gh-streak";
            const wide = rand() < 0.16;
            const w = wide ? 8 + Math.round(rand() * 16) : 1 + Math.round(rand() * 4);
            const light = rand() < 0.42;
            const a = light ? 0.12 + rand() * 0.5 : 0.15 + rand() * 0.55;
            s.style.left = Math.round(rand() * 1936) - 8 + "px";
            s.style.width = w + "px";
            s.style.background = light
              ? "rgba(255,255,255," + a.toFixed(3) + ")"
              : "rgba(8,8,10," + a.toFixed(3) + ")";
            host.appendChild(s);
          }
          // A few full-height bright tears (the vertical "rip" lines).
          for (let i = 0; i < 3; i += 1) {
            const tear = document.createElement("div");
            tear.className = "gh-streak";
            tear.style.left = Math.round(120 + rand() * 1680) + "px";
            tear.style.width = 2 + Math.round(rand() * 2) + "px";
            tear.style.background = "rgba(255,255,255,0.85)";
            host.appendChild(tear);
          }
          // Horizontal displacement slices: an IRREGULAR seeded stripe field
          // (varied segment widths + alphas — analog static, not venetian
          // blinds) shifted sideways — a horizontal tear.
          for (let i = 0; i < 6; i += 1) {
            const sl = document.createElement("div");
            sl.className = "gh-slice";
            const h = 18 + Math.round(rand() * 62);
            sl.style.top = Math.round(rand() * (1080 - h)) + "px";
            sl.style.height = h + "px";
            const stops = [];
            let pos = 0;
            for (let k = 0; k < 14; k += 1) {
              const w = 2 + Math.round(rand() * 22);     // irregular segment width
              const light = rand() < 0.45;
              const a = (light ? 0.05 + rand() * 0.3 : 0.08 + rand() * 0.32).toFixed(3);
              const c = light ? "rgba(255,255,255," + a + ")" : "rgba(10,10,12," + a + ")";
              stops.push(c + " " + pos + "px " + (pos + w) + "px");
              pos += w;
            }
            sl.style.background =
              "repeating-linear-gradient(90deg," + stops.join(",") + ")";
            const dx = (rand() < 0.5 ? -1 : 1) * Math.round(30 + rand() * 70);
            sl.setAttribute("data-dx", String(dx));
            host.appendChild(sl);
          }
        };

        const frames = [
          document.getElementById("gh-f1"),
          document.getElementById("gh-f2"),
          document.getElementById("gh-f3"),
        ];
        frames.forEach(function (f) { buildFrame(f); });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Pin every initial state at t=0 (pure function of timeline time):
        // frame 1 of the render is already the full-intensity hit.
        tl.set("#gh-stage", { opacity: 1, x: 0 }, 0);
        tl.set(frames[0], { opacity: 1 }, 0);
        tl.set(frames[1], { opacity: 0 }, 0);
        tl.set(frames[2], { opacity: 0 }, 0);
        frames.forEach(function (f) {
          Array.prototype.forEach.call(f.querySelectorAll(".gh-slice"), function (sl) {
            tl.set(sl, { x: parseInt(sl.getAttribute("data-dx"), 10) }, 0);
          });
        });

        // Flicker: re-roll the static pattern at thirds of the hit, with a
        // small whole-stage horizontal jitter (displacement snap).
        const t1 = T / 3;
        const t2 = (2 * T) / 3;
        tl.set(frames[0], { opacity: 0 }, t1);
        tl.set(frames[1], { opacity: 1 }, t1);
        tl.set("#gh-stage", { x: -7 }, t1);
        tl.set("#gh-wash", { opacity: 0.86 }, t1);
        tl.set(frames[1], { opacity: 0 }, t2);
        tl.set(frames[2], { opacity: 1 }, t2);
        tl.set("#gh-stage", { x: 5 }, t2);
        tl.set("#gh-wash", { opacity: 1 }, t2);

        // Instantly gone — hard snap to transparent, no fade.
        tl.set("#gh-stage", { opacity: 0 }, T);

        tl.seek(0);
        window.__timelines["glitch-hit"] = tl;
      })();
    </script>
  </body>
</html>
