<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"header","type":"string","label":"Deck header (all-caps slot, y0.195)","default":""},
    {"id":"headerInk","type":"enum","label":"Header ink","default":"white","options":[{"value":"white","label":"White"},{"value":"charcoal","label":"Charcoal"}]},
    {"id":"slide1","type":"string","label":"Slide 1 rows (pipe-separated: Row one|Row two)","default":""},
    {"id":"slide2","type":"string","label":"Slide 2 rows (empty = single-slide deck)","default":""},
    {"id":"slide3","type":"string","label":"Slide 3 rows (empty = 2-slide deck)","default":""},
    {"id":"pill1","type":"string","label":"Caption pill during slide 1 (empty = none)","default":""},
    {"id":"pill2","type":"string","label":"Caption pill during slide 2","default":""},
    {"id":"pill3","type":"string","label":"Caption pill during slide 3","default":""},
    {"id":"pageAt2","type":"number","label":"Page to slide 2 at (s; 0 = off)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"pageAt3","type":"number","label":"Page to slide 3 at (s; 0 = off)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"gradientTop","type":"boolean","label":"Darker gradient top (settles to flat lime by y0.35)","default":false},
    {"id":"accent","type":"color","label":"Lime canvas color (one token per reel)","default":"#C9FB00"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: ANGELA-TAKEOVER-DECK (angela pack #1)
    Reference: the lime slide-deck container + paging — 3/4 studied reels,
    39-60% of runtime where present; THE signature structural move. Full-frame
    solid lime canvas, an all-caps header slot, card-white square-corner sheets
    in the content zone, a caption-pill slot at y0.78, and carousel paging.
    OPAQUE 1080x1920 -> anchor "own-screen", render `--format mp4`.

    HER STRUCTURE/MOTION, OUR TOKENS: geometry + frame timings are decomposed
    from the reference reels; the lime is a brandable token (accent var,
    per-reel sample #C8F800/#C9FB00/#CEFF0A — ONE token per reel), type is the
    house Inter stack from tokens.css.

    CONTRACT for the PRODUCER compositing stage:
      - The lime field, header and caption pill are ON at frame 0 — the hard
        camera cut IS the enter (0-frame arrive). The field is opaque from
        frame 0 on a full-bleed CHILD (never the root).
      - slide1 content enters as ONE WHOLE UNIT: 5f@24 fade (~0.21s) + ~2%W
        (22px) settle drift. NEVER row-staggered — a 6-row sheet is one unit.
      - Paging (pageAt2/pageAt3 > 0) is a carousel: current sheet exits LEFT
        while the next enters FROM THE RIGHT simultaneously, 11f@24 (~0.46s),
        settle at the end (power3.out). The caption pill hard-swaps its text
        ON the page (replace-per-cue, no fade).
      - The deck is CLEARED ON the hard cut back to footage — the comp holds
        to D and never fades itself out; the compositor owns both seams.
      - EMPTY-DEFAULTS LAW (G21): header/slides/pills default EMPTY — unset
        renders nothing. Demo content activates ONLY when ALL are unset.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · angela-takeover-deck</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --lime: #C9FB00; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--lime);           /* opaque — this comp owns the whole frame */
        font-family: var(--font);
      }
      #atd-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* Opaque lime field on a full-bleed CHILD (own-screen law). */
      #atd-bg { position: absolute; inset: 0; background: var(--lime); }
      #atd-bg.gradient {
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--lime) 74%, #223300) 0%,
          var(--lime) 35%
        );
      }

      /* Header slot: all-caps, center y≈0.195H (reference y0.18-0.21), 3.6%H. */
      #atd-header {
        position: absolute;
        left: 40px; right: 40px;
        top: 340px;                        /* 69px line -> optical center ~y374 */
        font-size: 69px;
        line-height: 1.0;
        font-weight: 800;
        letter-spacing: 0.015em;
        text-transform: uppercase;
        text-align: center;
        color: #F8F8F8;
        text-wrap: balance;
      }
      #atd-header.charcoal { color: #303030; }

      /* Content zone x0.08-0.92 (86..994px); sheets page inside it. */
      #atd-zone {
        position: absolute;
        left: 86px;
        top: 470px;
        width: 908px;
        height: 920px;
        overflow: hidden;
      }
      .atd-slide {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        will-change: transform, opacity;
      }
      /* Card-white SQUARE-corner sheet (reference #FBFBFB, corners ~square). */
      .atd-sheet {
        width: 100%;
        background: #FBFBFB;
        border-radius: 4px;
        box-shadow: 0 10px 34px rgba(34, 44, 0, 0.18);
        padding: 26px 44px;
      }
      .atd-row {
        font-size: 34px;
        font-weight: 600;
        line-height: 1.35;
        color: #3A3F3D;
        padding: 20px 4px;
        border-bottom: 2px solid rgba(48, 48, 48, 0.08);
        overflow-wrap: break-word;
      }
      .atd-row:last-child { border-bottom: none; }

      /* Caption-pill slot x0.5 y≈0.78H — white SQUARE-corner pill, charcoal
         bold ~1.8%H text. Already ON at the cut frame; hard replace per page. */
      #atd-pill {
        position: absolute;
        left: 540px;
        top: 1497px;
        transform: translate(-50%, -50%);
        background: #FCFAFB;
        border-radius: 6px;
        padding: 16px 30px;
        box-shadow: 0 6px 22px rgba(34, 44, 0, 0.16);
        white-space: nowrap;
      }
      .atd-pill-cue {
        font-size: 35px;
        font-weight: 700;
        color: #3A3F3D;
        letter-spacing: 0.005em;
      }
      .atd-pill-cue.alt {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="atd-root"
      data-composition-id="angela-takeover-deck"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="6"
    >
      <div id="atd-bg"></div>
      <div id="atd-header" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      <div id="atd-zone" class="clip" data-start="0" data-duration="60" data-track-index="2"></div>
      <div id="atd-pill" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("atd-root");
        const D = parseFloat(root.dataset.duration) || 6;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          header: "", slide1: "", slide2: "", slide3: "",
          pill1: "", pill2: "", pill3: "",
          pageAt2: 0, pageAt3: 0, gradientTop: false, accent: "#C9FB00",
        };
        // PREVIEW-ONLY demo deck (activates only when ALL content is unset).
        const SAMPLE = {
          header: "The 3-Part Hook",
          slide1: "Call out the exact viewer|Show the receipt on screen|Say the payoff in 5 words",
          slide2: "Post it before 9am|Reply to the first 10 comments",
          pill1: "steal this structure",
          pill2: "then do this",
          pageAt2: 2.4,
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["header", "slide1", "slide2", "slide3", "pill1", "pill2", "pill3"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--lime", String(vars.accent));

        // Decomposed frame timings (the spec's carousel grammar).
        const SLIDE_FADE = 5 / 24;         // whole-unit fade, 5f@24
        const DRIFT_PX = 22;               // ~2%W settle drift
        const PAGE_DUR = 11 / 24;          // exit-left + enter-right, 11f@24
        const ZONE_SHIFT = 948;            // zone width + margin (clears the zone)

        if (vars.gradientTop === true || vars.gradientTop === "true") {
          document.getElementById("atd-bg").classList.add("gradient");
        }

        const headerEl = document.getElementById("atd-header");
        const headerText = (vars.header == null ? "" : String(vars.header)).trim();
        if (headerText) {
          headerEl.textContent = headerText;
          if (String(vars.headerInk) === "charcoal") headerEl.classList.add("charcoal");
        } else {
          headerEl.remove();               // unset var renders NOTHING
        }

        // Build the sheets (each slide = ONE unit; rows are static layout).
        const zone = document.getElementById("atd-zone");
        function buildSlide(raw) {
          const rows = String(raw).split("|").map(function (r) { return r.trim(); }).filter(Boolean);
          if (!rows.length) return null;
          const slide = document.createElement("div");
          slide.className = "atd-slide";
          const sheet = document.createElement("div");
          sheet.className = "atd-sheet";
          rows.forEach(function (r) {
            const row = document.createElement("div");
            row.className = "atd-row";
            row.textContent = r;
            sheet.appendChild(row);
          });
          slide.appendChild(sheet);
          zone.appendChild(slide);
          return slide;
        }
        const s1 = buildSlide(vars.slide1 == null ? "" : vars.slide1);
        const s2 = buildSlide(vars.slide2 == null ? "" : vars.slide2);
        const s3 = buildSlide(vars.slide3 == null ? "" : vars.slide3);

        const clampAt = function (raw) {
          const v = isFinite(Number(raw)) ? Number(raw) : 0;
          if (v <= 0) return 0;            // 0 = paging off
          return Math.min(v, Math.max(0.1, D - PAGE_DUR - 0.05));
        };
        const pageAt2 = s2 ? clampAt(vars.pageAt2) : 0;
        const pageAt3 = (s3 && pageAt2) ? Math.max(clampAt(vars.pageAt3), 0) : 0;

        // Caption pill: cue spans stacked; hard replace ON each page.
        const pill = document.getElementById("atd-pill");
        const pillTexts = [vars.pill1, vars.pill2, vars.pill3].map(function (p) {
          return (p == null ? "" : String(p)).trim();
        });
        const pillCues = pillTexts.map(function (t, i) {
          if (!t) return null;
          const el = document.createElement("span");
          el.className = "atd-pill-cue" + (i > 0 ? " alt" : "");
          el.textContent = t;
          pill.appendChild(el);
          return el;
        });
        if (!pillCues.some(Boolean)) pill.remove();

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Field micro-settle — imperceptible; keeps the timeline non-empty and
        // frame 0 fully lit (the cut IS the enter; nothing else tweens in).
        tl.fromTo("#atd-bg", { opacity: 0.995 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

        // Slide 1: whole-unit fade 5f@24 + ~2%W settle drift (ONE unit, never
        // row-staggered).
        if (s1) {
          tl.fromTo(s1, { autoAlpha: 0, x: DRIFT_PX },
            { autoAlpha: 1, x: 0, duration: SLIDE_FADE, ease: "power2.out" }, 0);
        }

        // Carousel paging: exit-left + enter-from-right SIMULTANEOUSLY, settle
        // at the end (power3.out). Pill text hard-swaps on the page frame.
        function page(fromSlide, toSlide, at, cueIdx) {
          tl.set(toSlide, { autoAlpha: 1, x: ZONE_SHIFT }, 0);
          tl.to(fromSlide, { x: -ZONE_SHIFT, duration: PAGE_DUR, ease: "power3.out" }, at);
          tl.to(toSlide, { x: 0, duration: PAGE_DUR, ease: "power3.out" }, at);
          const prev = pillCues[cueIdx - 1];
          const next = pillCues[cueIdx];
          if (prev) tl.set(prev, { autoAlpha: 0 }, at);
          if (next) tl.set(next, { autoAlpha: 1 }, at);
        }
        if (pillCues[1]) tl.set(pillCues[1], { autoAlpha: 0 }, 0);
        if (pillCues[2]) tl.set(pillCues[2], { autoAlpha: 0 }, 0);
        if (s2 && pageAt2) page(s1, s2, pageAt2, 1);
        if (s3 && pageAt3 && pageAt3 > pageAt2) page(s2, s3, pageAt3, 2);

        // No self exit — deck is cleared ON the hard cut back to footage
        // (compositor owns both seams); NEVER a comp fade-out.
        tl.seek(0);
        window.__timelines["angela-takeover-deck"] = tl;
      })();
    </script>
  </body>
</html>
