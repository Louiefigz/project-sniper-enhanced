<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow microtext (mono caps + square accent marker; empty = omit)","default":""},
    {"id":"eyebrowAccent","type":"enum","label":"Eyebrow marker semantic accent","default":"process","options":[{"value":"process","label":"Process (blue)"},{"value":"result","label":"Result (amber)"}]},
    {"id":"headlineLines","type":"string","label":"Two-line headline, pipe-separated (line 2 in --accent-result)","default":""},
    {"id":"heroLabel","type":"string","label":"Hero bar label (mono caps)","default":""},
    {"id":"heroValue","type":"string","label":"Hero bar value label (lands WITH the bar tip)","default":""},
    {"id":"heroPct","type":"string","label":"Hero bar fill percent (0-100)","default":""},
    {"id":"compareLabel","type":"string","label":"Comparison bar label","default":""},
    {"id":"compareValue","type":"string","label":"Comparison bar value label","default":""},
    {"id":"comparePct","type":"string","label":"Comparison bar fill percent (0-100)","default":""},
    {"id":"deltaChip","type":"string","label":"Delta tag (pops only AFTER both bars; empty = omit)","default":""},
    {"id":"chips","type":"string","label":"Chip row, pipe-separated (sweep 85ms L->R; empty = omit)","default":""},

    {"id":"evidenceDate","type":"string","label":"Evidence ribbon date","default":""},
    {"id":"moduleLands","type":"string","label":"Narration-paced module lands (s, comp-relative, pipe/comma-separated) — one per PRESENT module [headline, bars, chips, evidence]; empty = 0.2 + k*0.9","default":""},
    {"id":"exit","type":"enum","label":"Exit","default":"hold","options":[{"value":"hold","label":"Hold to end (compositor owns the seam)"},{"value":"blur-recede","label":"Blur-recede 0.15s (graphics layer only — face PIP stays sharp)"}]}
  ]'
>
  <!--
    PROJECT SNIPER · LONG-FORM template: MODULE-TAKEOVER (16:9, 1920x1080)
    The dark chapter card: a graphite canvas carrying a content column on the
    LEFT (~58%W) and the presenter in a rounded picture-in-picture slot on the
    RIGHT. LONGFORM-ONLY (face-in-PIP takeovers are legal for longform and
    rejected for shorts — plan_lint_module ERRORs the kind on a shorts plan).

    SNIPER DESIGN (tokens.css module palette + type):
      - Canvas = --module-canvas (blue graphite) with a faint 48px dot field
        and a soft process-blue glow at the top-left, so the card reads as an
        instrument panel rather than a flat slide.
      - Eyebrow = --eyebrow-font (IBM Plex Mono) caps led by a square marker;
        headline = --font-display (Bricolage Grotesque 800); line 2 takes the
        result accent. Panels, chips and the delta tag use 4-6px corners and
        1px hairlines.
      - Semantic accents: --accent-result (amber) = the hero result,
        --accent-process (blue) = process/status, --accent-compare (graphite)
        = the comparison baseline. Each clears 3:1 on the canvas (tokens.css
        table; plan_lint_visual contrast rule).

    THE FACE HOLE: this comp renders the FRAME around a TRANSPARENT hole —
    the canvas is masked out of the PIP rect (SVG evenodd mask) and
    #nt-face-slot draws only the card ring (hairline border + shadow) around
    it. The comp is rendered WITH ALPHA (graphics_render forces ProRes .mov
    for this kind even at anchor "own-screen") and the renderer scales the
    live footage into the hole UNDER it at composite time
    (graphics/pip_hole.py + graphics_stage._overlay_clip "pipHole" branch).
    HOLE GEOMETRY IS A CONTRACT: left 1344px / top 60px / 534x960 (~28%W x
    89%H) / r 24px — it MUST equal graphics.pip_hole.HOLE_BY_KIND
    ["module-takeover"] exactly (test_module_longform pins both).

    CONTRACT for the PRODUCER compositing stage:
      - anchor "own-screen" (it IS a takeover: counts against the takeover
        budget, suppresses burned captions under its window) but the render
        stays an alpha overlay so the hole shows footage.
      - IN-CARD PAYOFFS (Sniper design parameters): the hero bar fills over
        HERO_FILL_S=0.4s power2.out and the thinner comparison bar over
        COMPARE_FILL_S=0.8s power1.out, so the result visibly wins the race;
        each value label lands WITH its bar tip; the delta tag pops only AFTER
        BOTH bars; chips sweep left to right one per CHIP_SWEEP_S=0.085s.
      - Builds are skeleton-first + eyebrow-first + in-place opacity ramps
        (shared /motion-tokens.js helpers).
      - moduleLands: narration-paced lands, one per PRESENT module in order
        [headline, bars, chips, evidence]. The brain picks WHICH words;
        graphics_copy.fill_module_lands converts to these comp-relative
        seconds; plan_lint_motion validates them. Empty = default cadence
        0.2 + k*0.9s (one module per spoken clause at a relaxed pace).
        A land-count mismatch FAILS LOUDLY (never guess a schedule).
      - UNSET content renders NOTHING (G21). The SAMPLE below activates only
        when EVERY content variable is unset (bare preview/render).
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - exit:"blur-recede": the GRAPHICS layer blurs+fades+recedes over the
        final EXIT_BLUR_S while the footage in the hole stays sharp (it is
        composited UNDER this layer). Default "hold" = hard-off on the cut
        (compositor owns the seam).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · module-takeover</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #nt-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #nt-layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }

      /* Graphite canvas + faint 48px dot field + a soft blue glow, MASKED so
         the face hole stays transparent (SVG evenodd: outer frame minus the
         rounded PIP rect — geometry contract with graphics.pip_hole). */
      #nt-canvas {
        position: absolute; inset: 0;
        background-color: var(--module-canvas, #121721);
        background-image:
          radial-gradient(circle at 1px 1px, rgba(241,244,246,0.07) 1.2px, transparent 1.6px),
          radial-gradient(ellipse 1100px 700px at 8% 0%, rgba(68,123,228,0.16), transparent 70%);
        background-size: 48px 48px, 100% 100%;
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
      }
      /* The PIP card RING around the transparent hole (~28%W x 89%H, r24 —
         hairline border + shadow; the renderer puts the footage underneath). */
      #nt-face-slot {
        position: absolute;
        left: 1344px; top: 60px; width: 534px; height: 960px;
        border-radius: 24px;
        border: 2px solid rgba(241, 244, 246, 0.16);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(241, 244, 246, 0.08);
      }

      /* Content column left (~58%W band before the PIP gutter). */
      #nt-stage {
        position: absolute;
        left: 96px; top: 0; width: 1130px; height: 1080px;
        padding: 96px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 44px;
      }
      .module { will-change: opacity; }

      #nt-eyebrow {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 26px; line-height: 1;
        letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--accent-process, #447BE4);
      }
      #nt-eyebrow .dot {
        width: 12px; height: 12px; border-radius: 2px;
        background: var(--accent-process, #447BE4);
        flex: 0 0 auto;
      }
      #nt-eyebrow.result, #nt-eyebrow.result .dot { color: var(--accent-result, #CC7200); }
      #nt-eyebrow.result .dot { background: var(--accent-result, #CC7200); }

      #nt-headline {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 104px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      #nt-headline .line { display: block; will-change: opacity; }
      #nt-headline .l2 { color: var(--accent-result, #CC7200); }

      /* Benchmark panel — 1px hairline module; hero vs comparison bars. */
      #nt-bars {
        border: 1px solid rgba(241, 244, 246, 0.14);
        border-radius: 6px;
        background: rgba(241, 244, 246, 0.03);
        padding: 36px 40px;
        display: flex; flex-direction: column; gap: 30px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 300px 1fr 150px;
        align-items: center;
        gap: 28px;
      }
      .bar-label {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 23px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.66);
      }
      .bar-track {
        position: relative;
        height: 22px;
        background: rgba(241, 244, 246, 0.06);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; }
      .bar-row.hero .bar-fill { background: var(--accent-result, #CC7200); }
      .bar-row.compare .bar-track { height: 14px; }
      .bar-row.compare .bar-fill { background: var(--accent-compare, #7C8088); }
      .bar-value {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 30px;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-align: right;
        will-change: opacity;
      }
      .bar-row.compare .bar-value { color: rgba(241, 244, 246, 0.72); font-size: 26px; }
      #nt-delta {
        align-self: flex-start;
        display: flex; align-items: center; gap: 14px;
        border: 1px solid var(--accent-result, #CC7200);
        border-radius: 4px;
        padding: 12px 20px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 25px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: #ffffff;
        will-change: transform, opacity;
      }
      #nt-delta .dot {
        width: 11px; height: 11px; border-radius: 2px;
        background: var(--accent-result, #CC7200);
        flex: 0 0 auto;
      }

      #nt-chips { display: flex; flex-wrap: wrap; gap: 14px; }
      .nt-chip {
        border: 1px solid rgba(241, 244, 246, 0.16);
        border-radius: 4px;
        background: rgba(241, 244, 246, 0.04);
        padding: 13px 18px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 21px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.86);
        will-change: opacity;
      }

      #nt-evidence {
        font-family: var(--eyebrow-font);
        font-weight: 500; font-size: 22px; line-height: 1;
        letter-spacing: 0.14em; text-transform: uppercase;
        /* LL-006: receipt text stays at the brighter receipt gray */
        color: var(--receipt-gray, rgba(255, 255, 255, 0.72));
      }
    </style>
  </head>
  <body>
    <div
      id="nt-root"
      data-composition-id="module-takeover"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="9"
    >
      <div id="nt-layer">
        <div id="nt-canvas"></div>
        <div id="nt-face-slot"></div>
        <div id="nt-stage">
          <div id="nt-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="nt-eyebrow-text"></span></div>
          <div id="nt-headline" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="nt-bars" class="module clip" data-start="0" data-duration="60" data-track-index="3">
            <div class="bar-row hero">
              <span class="bar-label"></span>
              <span class="bar-track"><span class="bar-fill"></span></span>
              <span class="bar-value"></span>
            </div>
            <div class="bar-row compare">
              <span class="bar-label"></span>
              <span class="bar-track"><span class="bar-fill"></span></span>
              <span class="bar-value"></span>
            </div>
            <div id="nt-delta"><span class="dot"></span><span id="nt-delta-text"></span></div>
          </div>
          <div id="nt-chips" class="module clip" data-start="0" data-duration="60" data-track-index="4"></div>
          <div id="nt-evidence" class="module clip" data-start="0" data-duration="60" data-track-index="5"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("nt-root");
        const D = parseFloat(root.dataset.duration) || 9;
        const M = window.__motionTokens;

        // In-card payoff constants (Sniper design parameters, see header):
        const HERO_FILL_S = 0.4;      // hero bar fill, power2.out
        const COMPARE_FILL_S = 0.8;   // comparison 2x slower, power1.out
        const CHIP_SWEEP_S = 0.085;   // one chip per ~85ms, L->R
        const DELTA_BEAT_S = 0.1;     // delta chip pops only AFTER both bars
        const LINE_STAGGER_S = 0.12;  // headline per-line ramp stagger
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9;   // one module per spoken clause

        const defaults = {
          eyebrow: "", eyebrowAccent: "process", headlineLines: "",
          heroLabel: "", heroValue: "", heroPct: "",
          compareLabel: "", compareValue: "", comparePct: "",
          deltaChip: "", chips: "",
          evidenceSource: "", evidenceDate: "",
          moduleLands: "", exit: "hold",
        };
        const CONTENT_KEYS = ["eyebrow", "headlineLines", "heroLabel", "heroValue",
          "heroPct", "compareLabel", "compareValue", "comparePct", "deltaChip",
          "chips", "evidenceSource", "evidenceDate"];
        // PREVIEW-ONLY demo (original Sniper sample copy): activates ONLY
        // when every content variable is unset (G21 — no sample leaks into
        // plans).
        const SAMPLE = {
          eyebrow: "REVIEW PASS",
          headlineLines: "ONE PASS.|FEWER RETAKES.",
          heroLabel: "CLEAN TAKES", heroValue: "91%", heroPct: "91",
          compareLabel: "FIRST DRAFT", compareValue: "74%", comparePct: "74",
          deltaChip: "+17 POINTS",
          chips: "SILENCE|FILLER|RETAKES|PACING|CAPTIONS|QC",
          evidenceSource: "SAMPLE DATA", evidenceDate: "PREVIEW",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }
        function pct(k) {
          const raw = str(k);
          if (!raw) return null;
          const v = parseFloat(raw);
          if (!isFinite(v) || v < 0 || v > 100) {
            throw new Error("module-takeover: " + k + " must be 0-100, got '" + raw + "'");
          }
          return v;
        }

        // ---- Fill / prune the modules (unset content renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("nt-eyebrow");
        if (ebText) {
          document.getElementById("nt-eyebrow-text").textContent = ebText;
          if (str("eyebrowAccent") === "result") ebEl.classList.add("result");
        } else { ebEl.remove(); }

        const headEl = document.getElementById("nt-headline");
        const heads = str("headlineLines");
        if (heads) {
          heads.split("|").forEach(function (line, j) {
            const el = document.createElement("span");
            el.className = "line" + (j === 1 ? " l2" : "");
            el.textContent = line.trim();
            headEl.appendChild(el);
          });
        } else { headEl.remove(); }

        const barsEl = document.getElementById("nt-bars");
        const heroPct = pct("heroPct");
        const comparePct = pct("comparePct");
        const bars = [];
        if (heroPct == null && comparePct == null) {
          barsEl.remove();
        } else {
          [["hero", heroPct, "heroLabel", "heroValue", HERO_FILL_S, "power2.out"],
           ["compare", comparePct, "compareLabel", "compareValue", COMPARE_FILL_S, "power1.out"]]
            .forEach(function (row) {
              const el = barsEl.querySelector(".bar-row." + row[0]);
              if (row[1] == null) { el.remove(); return; }
              el.querySelector(".bar-label").textContent = str(row[2]);
              el.querySelector(".bar-value").textContent = str(row[3]);
              bars.push({ fill: el.querySelector(".bar-fill"),
                          value: el.querySelector(".bar-value"),
                          pct: row[1], dur: row[4], ease: row[5] });
            });
          const deltaText = str("deltaChip");
          const deltaEl = document.getElementById("nt-delta");
          if (deltaText) document.getElementById("nt-delta-text").textContent = deltaText;
          else deltaEl.remove();
        }

        const chipsEl = document.getElementById("nt-chips");
        const chipTexts = str("chips") ? str("chips").split("|")
          .map(function (s) { return s.trim(); }).filter(Boolean) : [];
        const chipEls = chipTexts.map(function (t) {
          const el = document.createElement("span");
          el.className = "nt-chip";
          el.textContent = t;
          chipsEl.appendChild(el);
          return el;
        });
        if (!chipEls.length) chipsEl.remove();

        const evSource = str("evidenceSource");
        const evEl = document.getElementById("nt-evidence");
        if (evSource) {
          // LL-006: separator glyph so the label never parses as the value.
          evEl.textContent = ["CLAIM SOURCE", evSource, str("evidenceDate")]
            .filter(Boolean).join(" \u00b7 ");
        } else { evEl.remove(); }

        // ---- Narration-paced module lands ----
        // One land per PRESENT module, order [headline, bars, chips,
        // evidence]. A count mismatch fails LOUDLY — never guess a schedule.
        const modules = [];
        if (ebText || heads) modules.push("head");
        if (bars.length) modules.push("bars");
        if (chipEls.length) modules.push("chips");
        if (evSource) modules.push("evidence");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("module-takeover: moduleLands needs " + modules.length +
              " finite times for modules [" + modules.join(", ") + "], got '" +
              landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build (skeleton-first + eyebrow-first + opacity ramps) ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        if (landOf.head != null) {
          const t0 = landOf.head;
          let headAt = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            headAt = t0 + M.EYEBROW_LEAD_S;     // eyebrow leads the headline
          }
          if (heads) {
            headEl.querySelectorAll(".line").forEach(function (lineEl, j) {
              M.textRamp(tl, lineEl, headAt + j * LINE_STAGGER_S);
            });
          }
        }

        if (landOf.bars != null) {
          const tB = landOf.bars;
          // Skeleton lands as ONE unit (labels + empty tracks), THEN fills
          // (skeleton -> hold -> bars fill; token SKELETON_GAP_S).
          M.textRamp(tl, barsEl, tB);
          const fillAt = tB + M.SKELETON_GAP_S;
          bars.forEach(function (b) {
            tl.fromTo(b.fill, { width: "0%" },
              { width: b.pct + "%", duration: b.dur, ease: b.ease }, fillAt);
            // Value label lands WITH the bar tip.
            M.textRamp(tl, b.value, fillAt + b.dur - M.TEXT_RAMP_S);
          });
          if (str("deltaChip")) {
            // Delta pops only AFTER BOTH bars (hero 0.4 < compare 0.8).
            const deltaAt = fillAt + COMPARE_FILL_S + DELTA_BEAT_S;
            tl.fromTo("#nt-delta", { autoAlpha: 0, scale: 0.92 },
              { autoAlpha: 1, scale: 1, duration: M.TEXT_RAMP_S,
                ease: "power2.out" }, deltaAt);
          }
        }

        if (landOf.chips != null) {
          const tC = landOf.chips;
          chipEls.forEach(function (el, k) {
            M.textRamp(tl, el, tC + k * CHIP_SWEEP_S);   // 85ms left-to-right sweep
          });
        }

        if (landOf.evidence != null) {
          M.textRamp(tl, evEl, landOf.evidence);   // the source line lands LAST
        }

        // exit:"blur-recede": graphics layer only — the footage in the
        // hole is UNDER this comp, so the face stays sharp while the canvas,
        // ring and modules blur+fade+recede over the final EXIT_BLUR_S.
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#nt-layer", D - M.EXIT_BLUR_S);
        }
        // Otherwise HOLDS to the end — the compositor owns the seam.

        tl.seek(0);
        window.__timelines["module-takeover"] = tl;
      })();
    </script>
  </body>
</html>
