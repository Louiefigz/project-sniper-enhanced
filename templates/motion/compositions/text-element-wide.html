<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Text","default":"Your text here"},
    {"id":"fontSize","type":"number","label":"Font size (px)","default":64,"min":24,"max":220,"step":2,"unit":"px"},
    {"id":"weight","type":"number","label":"Font weight (100-900)","default":700,"min":100,"max":900,"step":100},
    {"id":"color","type":"color","label":"Text color","default":"#FFFFFF"},
    {"id":"align","type":"enum","label":"Text align","default":"center","options":[{"value":"left","label":"Left"},{"value":"center","label":"Center"},{"value":"right","label":"Right"}]}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: TEXT-ELEMENT-WIDE (Primitives, 16:9)
    The LANDSCAPE sibling of text-element (9:16) — same bare, placeable text
    primitive on the 1920x1080 longform canvas, centered at the true frame
    center (no portrait icon-rail asymmetry on 16:9). Paired -wide variant per
    repo convention (icon-badge-wide / kinetic-quote-wide): canvas is fixed per
    comp via data-width/height, so aspect = a sibling file, not a variable.
    Transparent 1920x1080 overlay -> render with `--format mov` (ProRes 4444).

    CONTRACT: identical to text-element.html — text / fontSize / weight /
    color / align variables, house fade/slide-in + fade-out ending at D,
    RENDER LENGTH = the root data-duration attribute (rewritten per window).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · text-element-wide</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #te-root { position: relative; width: 1920px; height: 1080px; }

      /* .stage OWNS the centering transform; GSAP animates only the inner block. */
      .stage {
        position: absolute;
        left: 960px;
        top: 540px;
        transform: translate(-50%, -50%);
      }
      /* EXPLICIT width (not max-width): a shrink-to-fit block inside an
         absolutely positioned .stage would wrap at (canvas − left) px, not the
         safe width — the chip-row 2x2 lesson. align positions text within it. */
      #te-text {
        width: 1400px;
        line-height: 1.14;
        letter-spacing: -0.01em;
        text-wrap: balance;
        /* An unbroken over-long token WRAPS (visibly) instead of clipping
           mid-word at the canvas edge — overflow past the block would be cut
           by the canvas overflow:hidden with no warning anywhere. */
        overflow-wrap: break-word;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="te-root"
      data-composition-id="text-element-wide"
      data-width="1920"
      data-height="1080"
      data-duration="3"
    >
      <div class="stage">
        <div id="te-text" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("te-root");
        const D = parseFloat(root.dataset.duration) || 3;

        const defaults = {
          text: "Your text here", fontSize: 64, weight: 700,
          color: "#FFFFFF", align: "center",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        const el = document.getElementById("te-text");
        el.textContent = String(vars.text);
        const size = Math.min(220, Math.max(24, Number(vars.fontSize) || 64));
        const weight = Math.min(900, Math.max(100, Number(vars.weight) || 700));
        const align = ["left", "center", "right"].indexOf(String(vars.align)) >= 0
          ? String(vars.align) : "center";
        el.style.fontSize = size + "px";
        el.style.fontWeight = String(weight);
        el.style.color = String(vars.color);
        el.style.textAlign = align;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Brief house fade/slide-in: rise from below, power3.out settle.
        tl.fromTo("#te-text", { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);

        // House exit — fade ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.18);
        tl.to("#te-text", { opacity: 0, y: -14, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["text-element-wide"] = tl;
      })();
    </script>
  </body>
</html>
