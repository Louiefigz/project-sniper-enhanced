name: Windows qualification

on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform-installer]
    paths-ignore:
      - release/macos-intel-qualification.url
      - .github/workflows/macos-intel-qualification.yml
      - release/prepare_macos_qualification.py
      - release/tests/test_macos_intel_qualification.py

jobs:
  install-and-admit:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble qualification package
        shell: pwsh
        run: python -m release.prepare_windows_qualification "$env:RUNNER_TEMP\Project Sniper Windows"
      - name: Parse Windows PowerShell sources
        shell: powershell
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\Project Sniper Windows" -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parsing failed for $($_.FullName)."
            }
          }
      - name: Compile the Windows media jail preflight
        shell: powershell
        run: |
          . "$env:RUNNER_TEMP\Project Sniper Windows\install\lib\windows\MediaJail.ps1"
          $source = "$env:RUNNER_TEMP\Project Sniper Windows\scripts\producer\headless\windows_media_inspect.cs"
          $target = "$env:RUNNER_TEMP\windows_media_inspect_preflight.exe"
          Compile-JailProgram $source $target
          if (-not (Test-Path $target)) { throw 'The Windows media jail preflight did not compile.' }
      - name: Ensure qualification workspace capacity
        shell: powershell
        run: |
          $free = (Get-PSDrive -Name C).Free
          if ($free -lt 22GB) {
            $cache = [IO.Path]::GetFullPath($env:RUNNER_TOOL_CACHE).TrimEnd('\')
            if ($cache -ne 'C:\hostedtoolcache\windows') { throw "Unexpected runner tool cache: $cache" }
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          $free = (Get-PSDrive -Name C).Free
          if ($free -lt 20GB) { throw "Windows qualification needs 20 GB free; found $free bytes." }
      - name: Run the buyer installer
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\install.ps1" -Workspace "$env:RUNNER_TEMP\Sniper Projects"'
      - name: Re-run to prove idempotence
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\install.ps1" -Workspace "$env:RUNNER_TEMP\Sniper Projects"'
      - name: Run the full installed doctor
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\doctor.ps1" --json'
      - name: Prove the command launcher
        shell: cmd
        run: '"%RUNNER_TEMP%\Project Sniper Windows\sniper.cmd" workspace'
      - name: Prove literal local settings override
        shell: powershell
        run: |
          $override = "$env:RUNNER_TEMP\Local Project `$97"
          Set-Content "$env:RUNNER_TEMP\Project Sniper Windows\runtime\sniper.local.env" `
            -Value "SNIPER_WORKSPACE_ROOT=$override" -Encoding ASCII
          $found = & "$env:RUNNER_TEMP\Project Sniper Windows\sniper.cmd" workspace
          if ($found -ne $override) { throw "Local settings override was not read literally: $found" }
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qualification-diagnostics
          path: |
            ${{ runner.temp }}\Project Sniper Windows\runtime\logs
            ${{ runner.temp }}\Project Sniper Windows\runtime\state
