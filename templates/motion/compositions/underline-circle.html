<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"shape","type":"enum","label":"Annotation shape","default":"underline","options":[{"value":"underline","label":"Underline"},{"value":"circle","label":"Circle"}]},
    {"id":"x","type":"number","label":"Region left (canvas px)","default":240,"min":0,"max":1080,"step":1,"unit":"px"},
    {"id":"y","type":"number","label":"Region top (canvas px)","default":880,"min":0,"max":1920,"step":1,"unit":"px"},
    {"id":"w","type":"number","label":"Region width (canvas px)","default":600,"min":20,"max":1080,"step":1,"unit":"px"},
    {"id":"h","type":"number","label":"Region height (canvas px)","default":150,"min":20,"max":1920,"step":1,"unit":"px"},
    {"id":"drawAt","type":"number","label":"Draw-in moment (s)","default":0.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"accent","type":"color","label":"Ink color","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: UNDERLINE-CIRCLE (MG-3)
    Trigger it serves: emphasis on ON-SCREEN content — annotate a word/region on the
    speaker's own screen (own-screen / approved contexts only, PLAN §2.1). A hand-drawn
    marker UNDERLINE or CIRCLE that stroke-draws in over the thing being pointed at.
    Transparent 1080x1920 overlay (everything but the mark is empty) -> render with
    `--format mov` (ProRes 4444) for alpha.

    CONTRACT for the PRODUCER compositing stage:
      - shape / x / y / w / h / drawAt / accent are `data-composition-variables`.
      - x,y,w,h are the CANVAS-PIXEL bounding box (SVG viewBox = 1080x1920, 1:1 with the
        canvas) of the region to annotate. `underline` draws a wavy marker line along the
        region's BOTTOM edge (x..x+w at y+h); `circle` draws a hand-drawn ellipse AROUND
        the box (a little padding, overshoot close — the classic marker-circle look).
      - The mark stroke-draws (SVG dashoffset, seek-safe) starting at `drawAt` seconds
        (relative to the overlay's outStart), then HOLDS to the end. drawAt is when the
        speaker emphasizes the region.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (see stat-card note); set it
        directly per render, comfortably past drawAt so the mark holds while it's discussed.
      - Placement law: legal only where annotating screen content is allowed (own-screen /
        approved). The producer's visual-state lint owns that gate — this template just draws.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · underline-circle</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — only the mark paints */
        font-family: var(--font);
      }
      #anno-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }
      #anno-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #anno-path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 13px;
        stroke-linecap: round;
        stroke-linejoin: round;
        will-change: stroke-dashoffset;
      }
    </style>
  </head>
  <body>
    <div
      id="anno-root"
      data-composition-id="underline-circle"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="2.5"
    >
      <svg
        id="anno-svg"
        class="clip"
        viewBox="0 0 1080 1920"
        preserveAspectRatio="none"
        data-start="0"
        data-duration="60"
        data-track-index="1"
      >
        <path id="anno-path" d="" />
      </svg>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("anno-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 2.5;

        const defaults = { shape: "underline", x: 240, y: 880, w: 600, h: 150, drawAt: 0.2, accent: "#054BC9" };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        const x = Number(vars.x), y = Number(vars.y), w = Number(vars.w), h = Number(vars.h);

        // Deterministic hand-drawn geometry (no Math.random — wobble is a pure fn of t).
        // UNDERLINE: a gentle two-hump marker stroke along the region's bottom edge,
        // ending on a slight upward flick.
        function buildUnderline() {
          const y0 = y + h;                 // bottom edge of the region
          const amp = Math.min(14, h * 0.12);
          const pts = [];
          const N = 40;
          for (let i = 0; i <= N; i++) {
            const t = i / N;
            const px = x + w * t;
            // two soft humps + a rising tail so it reads as a fast marker underline
            const py = y0 + Math.sin(t * Math.PI * 2) * amp * 0.5 - t * amp * 0.9;
            pts.push([px, py]);
          }
          return pointsToPath(pts);
        }

        // CIRCLE: a hand-drawn ellipse around the padded box, over-closing ~20deg past
        // the start so the ends cross like a real marker circle.
        function buildCircle() {
          const cx = x + w / 2, cy = y + h / 2;
          const rx = w / 2 + 26, ry = h / 2 + 26;
          const start = -Math.PI * 0.62;    // start upper-left, sweep clockwise
          const sweep = Math.PI * 2 + Math.PI * 0.12; // ~380deg overshoot
          const pts = [];
          const N = 80;
          for (let i = 0; i <= N; i++) {
            const t = i / N;
            const a = start + sweep * t;
            // subtle radius wobble = the human hand; deterministic in the angle
            const wob = 1 + 0.03 * Math.sin(a * 3);
            pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob]);
          }
          return pointsToPath(pts);
        }

        function pointsToPath(pts) {
          let d = "M " + pts[0][0].toFixed(2) + " " + pts[0][1].toFixed(2);
          for (let i = 1; i < pts.length; i++) {
            d += " L " + pts[i][0].toFixed(2) + " " + pts[i][1].toFixed(2);
          }
          return d;
        }

        const path = document.getElementById("anno-path");
        path.setAttribute("d", vars.shape === "circle" ? buildCircle() : buildUnderline());

        // Stroke-draw setup: measure total length ONCE (static geometry, not a clock),
        // dash the whole stroke, hide it by offsetting a full length.
        const L = path.getTotalLength();
        path.style.strokeDasharray = L;
        // Resting DOM state = fully drawn (correct even if a seek never fires the tween).
        path.style.strokeDashoffset = 0;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const drawAt = Math.max(0, Math.min(Number(vars.drawAt), D - 0.5));
        const drawDur = vars.shape === "circle" ? 0.5 : 0.4;
        // Draw-in (seek-safe: strokeDashoffset is a pure function of tween progress).
        tl.fromTo(path, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: drawDur, ease: "power2.out" }, drawAt);
        // Mark HOLDS to the end (annotations stay while the region is discussed).

        tl.seek(0);
        window.__timelines["underline-circle"] = tl;
      })();
    </script>
  </body>
</html>
