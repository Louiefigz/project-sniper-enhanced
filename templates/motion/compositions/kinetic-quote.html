<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"quote","type":"string","label":"Quote line (<= 8 words)","default":"AI made this buildable."},
    {"id":"bg","type":"enum","label":"Background","default":"dark","options":[{"value":"dark","label":"Near-black"},{"value":"light","label":"White"}]},
    {"id":"highlight","type":"string","label":"Word to accent (optional)","default":"buildable"},
    {"id":"accent","type":"color","label":"Accent color","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: KINETIC-QUOTE (MG-1)
    Trigger it serves: thesis / definition lines — the one sentence the clip exists for.
    FULL-FRAME OPAQUE TAKEOVER (not transparent) -> render to MP4. The compositing
    stage crossfades the base video under it at the cut (PLAN §3.3).

    CONTRACT for the PRODUCER compositing stage:
      - quote / bg / highlight / accent are `data-composition-variables` (fill with --variables).
      - Keep quote <= 8 words / <= ~2.5s (takeover doctrine, PLAN §2). Words enter
        per-word, staggered, and HOLD to the end; the compositor owns the out-transition.
      - `highlight` accents one word: GOLD (#FFD400) on the dark bg, accent-blue on light —
        both high-contrast + on-brand (gold is the caption secondary accent).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (see stat-card note); set it
        directly per render. Background is solid from FRAME 1 (doubles as the crossfade base).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · kinetic-quote</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #quote-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* Full-bleed background lives on a CHILD (never the root) — the producer's
         frame compositing can drop the root's own background (frame renders black). */
      #quote-bg { position: absolute; inset: 0; }
      #quote-root[data-bg="dark"]  #quote-bg { background: #0B0B0C; }
      #quote-root[data-bg="light"] #quote-bg { background: #FFFFFF; }

      .stage {
        position: absolute;
        left: var(--visual-center-x);
        top: 900px;
        transform: translate(-50%, -50%);
        width: var(--safe-width);
      }
      #quote-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 10px 26px;                     /* row-gap col-gap */
        width: 100%;
      }
      .word {
        display: inline-block;              /* transforms need block-level + intrinsic size */
        font-weight: 700;
        font-size: 108px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        will-change: transform, opacity;
      }
      #quote-root[data-bg="dark"]  .word { color: #FFFFFF; }
      #quote-root[data-bg="light"] .word { color: var(--ink); }
    </style>
  </head>
  <body>
    <div
      id="quote-root"
      data-composition-id="kinetic-quote"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="2.5"
      data-bg="dark"
    >
      <div id="quote-bg"></div>
      <div class="stage">
        <div id="quote-line" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("quote-root");
        const D = parseFloat(root.dataset.duration) || 2.5;

        const defaults = { quote: "AI made this buildable.", bg: "dark", highlight: "buildable", accent: "#054BC9" };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        root.dataset.bg = vars.bg === "light" ? "light" : "dark";
        document.documentElement.style.setProperty("--accent", vars.accent);
        // Highlight color: gold reads on the near-black bg; accent-blue on white.
        const hlColor = root.dataset.bg === "dark" ? "#FFD400" : vars.accent;

        const norm = function (w) { return w.toLowerCase().replace(/[^a-z0-9]/g, ""); };
        const hlNorm = norm(String(vars.highlight || ""));

        const line = document.getElementById("quote-line");
        const words = String(vars.quote).trim().split(/\s+/).filter(Boolean);
        const spans = words.map(function (w) {
          const el = document.createElement("span");
          el.className = "word";
          el.textContent = w;
          if (hlNorm && norm(w) === hlNorm) el.style.color = hlColor;
          line.appendChild(el);
          return el;
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Per-word kinetic entrance (scale + slide up), staggered so words land in sequence.
        // Compress the stagger for long lines so the whole entrance clears ~D-0.5.
        const budget = Math.max(0.3, D - 0.6);
        const step = spans.length > 1 ? Math.min(0.09, budget / spans.length) : 0;
        spans.forEach(function (span, i) {
          const t = 0.12 + i * step;
          tl.set(span, { opacity: 0, y: 46, scale: 0.82 }, 0);
          tl.to(span, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
        });

        tl.seek(0);
        window.__timelines["kinetic-quote"] = tl;
      })();
    </script>
  </body>
</html>
