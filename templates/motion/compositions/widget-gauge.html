<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Gauge label (<= 2 words, empty = omit)","default":"Difficulty"},
    {"id":"pos1","type":"number","label":"Marker pos @ keyframe 1 (0=left .. 1=right)","default":0.15,"min":0,"max":1,"step":0.01},
    {"id":"at1","type":"number","label":"Keyframe 1 time (s)","default":0.3,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"pos2","type":"number","label":"Marker pos @ keyframe 2","default":0.45,"min":0,"max":1,"step":0.01},
    {"id":"at2","type":"number","label":"Keyframe 2 time (s); <= at1 omits it onward","default":1.4,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"pos3","type":"number","label":"Marker pos @ keyframe 3","default":0.72,"min":0,"max":1,"step":0.01},
    {"id":"at3","type":"number","label":"Keyframe 3 time (s); <= at2 omits it onward","default":2.6,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"pos4","type":"number","label":"Marker pos @ keyframe 4","default":0.93,"min":0,"max":1,"step":0.01},
    {"id":"at4","type":"number","label":"Keyframe 4 time (s); <= at3 omits it","default":3.8,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"labelInAt","type":"number","label":"Staged: label pill entrance (s); all 0 = enter together (default)","default":0,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"barInAt","type":"number","label":"Staged: bar entrance (s)","default":0,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"markerInAt","type":"number","label":"Staged: marker arrow entrance (s)","default":0,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"accent","type":"color","label":"Label accent color","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: WIDGET-GAUGE (MG-3.5, R6)
    Class it serves: a PERSISTENT parametric widget (Reference Style Study R6) —
    a difficulty/intensity gauge (green -> red 6-segment bar + a marker arrow that
    TRACKS THE NARRATIVE), pinned in the headroom. Unlike the pop-and-fade cards,
    a widget holds for its whole window and its state moves with the story.
    Transparent 1080x1920 overlay -> render with `--format mov` (ProRes 4444) for alpha.

    CONTRACT for the PRODUCER compositing stage:
      - label + up to FOUR keyframes (posN 0..1 = marker position left->right;
        atN seconds relative to this overlay's outStart) are
        `data-composition-variables` — fill with --variables.
      - Keyframes are KEPT while their time strictly advances: at1 is always used;
        keyframe N (N>=2) is dropped (and everything after it) as soon as
        atN <= at(N-1). So 2 keyframes = set at2 <= at1; the marker then just
        eases pos1 -> nothing and holds. The marker holds pos1 before at1 and
        holds the last posN after the last atN (seek-safe: the marker position is
        a pure function of timeline time — hyperframes-keyframes doctrine).
      - HEADROOM placement (R3): the widget sits high (y~150-260), NOT in the
        free band — the face keeps the middle. The comp is full-canvas; the
        PRODUCER may additionally TRANSLATE it face-relative via anchor
        "headroom" + a measured faceBBoxNorm (graphics_stage).
      - The widget PERSISTS: it fades in once and holds to the end (no out-fade);
        the compositor gates it to the window and the base returns after.
      - STAGED ENTRANCE (R9, deep-pass correction): labelInAt / barInAt / markerInAt
        give the pill, bar and marker-arrow their own entrance times so the widget
        BUILDS (pill first -> bar -> marker) instead of appearing whole. DEFAULTS
        ARE ALL 0 = the original single container fade (backward compatible — old
        specs render identically); set any > 0 to opt into staging. Marker TRAVEL
        (the posN keyframes) is unchanged and remains the "value hand-off" that
        tracks the narrative.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (see stat-card note) —
        set it directly per render; the framework ignores --variables for it.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · widget-gauge</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #gauge-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* HEADROOM band (R3): high on the canvas, centered on the visual center. */
      .stage {
        position: absolute;
        left: var(--visual-center-x);
        top: 158px;
        transform: translateX(-50%);
        width: var(--safe-width);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .gauge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        will-change: transform, opacity;
      }
      /* Small label pill above the bar — accent field, white text. */
      .glabel {
        font-weight: 700;
        font-size: 34px;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-ink);
        background: var(--accent);
        padding: 12px 24px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      }
      /* The bar track holds the 6 color segments + the moving marker. */
      .track {
        position: relative;
        width: 560px;
        height: 30px;
        max-width: 100%;
      }
      .segs {
        display: flex;
        width: 100%;
        height: 100%;
        gap: 6px;
        border-radius: 999px;
        overflow: hidden;                 /* round the whole bar's outer corners */
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.30);
      }
      .seg { flex: 1 1 0; height: 100%; }
      /* green -> red across six steps (intensity ramp). */
      .seg.s1 { background: #2FBF71; }
      .seg.s2 { background: #7DC93B; }
      .seg.s3 { background: #E2C022; }
      .seg.s4 { background: #F2A73B; }
      .seg.s5 { background: #EF6D3A; }
      .seg.s6 { background: #E23B3B; }

      /* Downward marker arrow, sitting just above the bar and pointing at it. */
      .marker {
        position: absolute;
        top: -26px;
        left: 0;                          /* JS drives this (px within the track) */
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 17px solid transparent;
        border-right: 17px solid transparent;
        border-top: 22px solid #FFFFFF;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
        will-change: left;
      }
    </style>
  </head>
  <body>
    <div
      id="gauge-root"
      data-composition-id="widget-gauge"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="4"
    >
      <div class="stage">
        <div
          id="gauge-el"
          class="gauge clip"
          data-start="0"
          data-duration="60"
          data-track-index="1"
        >
          <div id="gauge-label" class="glabel">Difficulty</div>
          <div class="track">
            <div class="segs">
              <div class="seg s1"></div><div class="seg s2"></div>
              <div class="seg s3"></div><div class="seg s4"></div>
              <div class="seg s5"></div><div class="seg s6"></div>
            </div>
            <div id="gauge-marker" class="marker"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("gauge-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 4;

        const defaults = {
          label: "Difficulty",
          pos1: 0.15, at1: 0.3, pos2: 0.45, at2: 1.4,
          pos3: 0.72, at3: 2.6, pos4: 0.93, at4: 3.8,
          labelInAt: 0, barInAt: 0, markerInAt: 0, accent: "#054BC9",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        // Optional label — an empty string omits the pill and re-centers the bar.
        const labelEl = document.getElementById("gauge-label");
        const label = String(vars.label == null ? "" : vars.label).trim();
        if (label) { labelEl.textContent = label; } else { labelEl.remove(); }

        // Build the marker keyframe list: pos1 is always used; each later
        // keyframe is kept only while its time strictly advances (clamp pos 0..1).
        const clamp01 = function (n) { return Math.max(0, Math.min(1, Number(n))); };
        const raw = [
          { pos: vars.pos1, at: Number(vars.at1) },
          { pos: vars.pos2, at: Number(vars.at2) },
          { pos: vars.pos3, at: Number(vars.at3) },
          { pos: vars.pos4, at: Number(vars.at4) },
        ];
        const kfs = [];
        for (let i = 0; i < raw.length; i++) {
          const at = isFinite(raw[i].at) ? raw[i].at : 0;
          if (i > 0 && !(at > kfs[kfs.length - 1].at)) break;   // stop when time doesn't advance
          kfs.push({ pos: clamp01(raw[i].pos), at: Math.max(0, at) });
        }

        const track = document.querySelector(".track");
        const marker = document.getElementById("gauge-marker");
        // The marker's left is a px position INSIDE the track (width read live so
        // it stays correct if the token width ever changes).
        function place(p) {
          const w = track.clientWidth || 560;
          marker.style.left = (clamp01(p) * w) + "px";
        }
        place(kfs[0].pos);                  // resting state = first keyframe position

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Entrance. DEFAULT (all InAt == 0): the original single container fade —
        // byte-identical to the pre-upgrade behavior. STAGED (any InAt > 0, R9):
        // the pill, bar and marker enter on their own times so the widget builds.
        const labelInAt = Math.max(0, Number(vars.labelInAt) || 0);
        const barInAt = Math.max(0, Number(vars.barInAt) || 0);
        const markerInAt = Math.max(0, Number(vars.markerInAt) || 0);
        const staged = labelInAt > 0 || barInAt > 0 || markerInAt > 0;
        if (!staged) {
          tl.fromTo("#gauge-el", { opacity: 0, y: -16 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0);
        } else {
          // Container stays put; each element enters on its own time. The marker
          // gets an opacity-only entrance so its CSS translateX(-50%) is preserved
          // (a y/transform tween would clobber the centering + the travel `left`).
          gsap.set("#gauge-el", { opacity: 1, y: 0 });
          if (label) {
            tl.fromTo("#gauge-label", { opacity: 0, y: -16 },
              { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, labelInAt);
          }
          tl.fromTo(".segs", { opacity: 0, y: -16 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, barInAt);
          tl.fromTo("#gauge-marker", { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out" }, markerInAt);
        }

        // Marker travel — a proxy tweened through the keyframes; onUpdate places
        // the marker. Pure function of timeline time => seek-safe under render.
        const proxy = { p: kfs[0].pos };
        for (let i = 1; i < kfs.length; i++) {
          tl.to(proxy, {
            p: kfs[i].pos,
            duration: Math.max(0.05, kfs[i].at - kfs[i - 1].at),
            ease: "power2.inOut",
            onUpdate: function () { place(proxy.p); },
          }, kfs[i - 1].at);
        }
        // Before at1 the marker holds pos1 (resting DOM state, set above); after
        // the last keyframe GSAP re-applies the final tween state on any seek, so
        // the marker parks on the last posN with no extra handling.

        tl.seek(0);
        window.__timelines["widget-gauge"] = tl;
      })();
    </script>
  </body>
</html>
