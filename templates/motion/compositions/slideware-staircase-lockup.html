<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Kicker (sentence case; wrap payload words in *asterisks* for bold)","default":""},
    {"id":"payload","type":"string","label":"Payload (renders ALL-CAPS in the accent on an ink plate)","default":""},
    {"id":"coWord","type":"string","label":"Co-word (paper tab, lands right-below the payload)","default":""},
    {"id":"payload2","type":"string","label":"Replace-chain payload 2 (empty = off)","default":""},
    {"id":"payload3","type":"string","label":"Replace-chain payload 3 (empty = off)","default":""},
    {"id":"band","type":"enum","label":"Vertical band","default":"headroom","options":[{"value":"headroom","label":"Headroom (section steps)"},{"value":"chest","label":"Chest (action payloads / shouts)"}]},
    {"id":"payloadSize","type":"number","label":"Payload size (px; 106=standard 5.5%H, 150=hero, 69=verdict)","default":106,"min":60,"max":152,"step":2,"unit":"px"},
    {"id":"kickerAt","type":"number","label":"Kicker pop (s)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"payloadAt","type":"number","label":"Payload pop (s)","default":0.35,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"coAt","type":"number","label":"Co-word pop (s; 0.3-0.9s after payload)","default":0.75,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"replaceAt2","type":"number","label":"Swap to payload 2 at (s; 0 = off)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"replaceAt3","type":"number","label":"Swap to payload 3 at (s; 0 = off)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"accent","type":"color","label":"Payload accent (default: Sniper signal amber --lemon)","default":"#FDA933"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: SLIDEWARE-STAIRCASE-LOCKUP (short-form slide set, 2 of 4)
    A three-step keyword lockup over footage: a sentence-case kicker, a big
    ALL-CAPS payload, and a short co-word that steps down to the RIGHT of
    the payload, so the three rows read as a staircase. Each token pops on
    its spoken word; the payload can be swapped in place (replace-chain).
    Transparent 1080x1920 overlay -> render `--format mov` (ProRes 4444).

    SNIPER DESIGN (the short-form slide set — same plates, paper and amber
    as slideware-takeover-deck / -receipt-cell / -caption-dual-mode):
      - Kicker = Inter 400 white on a small ink tab (rgba(19,23,32,0.84),
        4px corners); *asterisk* words set in Inter 700 in the accent colour,
        so the kicker previews the payload it introduces.
      - Payload = --font-display (Bricolage Grotesque 800) caps in the accent
        (default --lemon signal amber) on an ink plate (rgba(19,23,32,0.92),
        6px corners). Each wrapped line gets its own plate.
      - Co-word = Inter 700 --rail-cream-ink on a --rail-cream paper tab, the
        paper surface of the slide set, stepped down to the right.
      - Legibility comes from the plates, never from text outlines. Contrast
        is independent of the footage: white on the kicker tab over pure
        white footage 11.03:1; amber on the payload plate over white footage
        7.47:1 (9.31:1 on solid ink); ink on the paper tab 16.23:1.

    CONTRACT for the PRODUCER compositing stage:
      - IN = 0-FRAME POP per token, word-locked to the spoken word: set
        kickerAt/payloadAt/coAt to transcript times (tokens stagger 0.3-0.9s).
        No fades, no slides — the token is simply ON from its frame.
      - OUT = instant in-place replace (payload2/payload3 + replaceAt2/3,
        chain cadence 0.31-1.0s — the swap does NOT re-enter) or instant
        clear ON the compositor's cut. NEVER a fade.
      - band: "headroom" = numbered-kicker section steps (center ~y0.23);
        "chest" = action payloads / caption shouts (center ~y0.63). Verdict
        variant: payloadSize 69, repeating the EXACT string and colour of the
        payload it calls back.
      - EMPTY-DEFAULTS LAW (G21): kicker/payload/coWord/payload2/payload3
        default EMPTY — unset renders NOTHING; sample only when ALL unset.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · slideware-staircase-lockup</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --asl-accent: #FDA933; }     /* = --lemon; the accent var re-tints it */
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;           /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #asl-root { position: relative; width: 1080px; height: 1920px; }

      /* .stage OWNS the centering transform; GSAP only toggles token alpha. */
      #asl-stage {
        position: absolute;
        left: 540px;
        top: 440px;                        /* headroom center; chest overrides */
        transform: translate(-50%, -50%);
        width: 960px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #asl-root.chest #asl-stage { top: 1210px; }   /* chest band y0.58-0.68 */

      /* Kicker: sentence case on a small ink tab. */
      #asl-kicker {
        max-width: 960px;
        font-size: 40px;
        font-weight: 400;
        line-height: 1.2;
        color: #FFFFFF;
        text-align: center;
        text-wrap: balance;
        background: rgba(19, 23, 32, 0.84);
        border-radius: 4px;
        padding: 8px 18px 10px;
        margin-bottom: 14px;
        will-change: opacity;
      }
      #asl-kicker b { font-weight: 700; color: var(--asl-accent); }

      /* Payload slot: replace-chain spans stack in place (no re-enter). */
      #asl-payload {
        position: relative;
        width: 100%;
        text-align: center;
        will-change: opacity;
      }
      .asl-pay {
        display: block;
        font-family: var(--font-display);
        font-weight: 800;
        line-height: 1.3;                  /* leaves a thin gap between per-line plates */
        letter-spacing: -0.01em;
        text-transform: uppercase;
        color: var(--asl-accent);
        text-wrap: balance;
        overflow-wrap: break-word;
      }
      .asl-pay.alt { position: absolute; left: 0; top: 0; width: 100%; }
      /* Ink plate per wrapped line (box-decoration-break: clone). */
      .asl-plate {
        background: rgba(19, 23, 32, 0.92);
        border-radius: 6px;
        padding: 0.02em 0.2em 0.07em;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      /* Co-word: paper tab, stepped RIGHT-BELOW the payload landing. */
      #asl-co {
        align-self: flex-end;
        margin-right: 120px;
        margin-top: 14px;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--rail-cream-ink);
        background: var(--rail-cream);
        border-radius: 4px;
        padding: 7px 16px 9px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        will-change: opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="asl-root"
      data-composition-id="slideware-staircase-lockup"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="3"
    >
      <div id="asl-stage">
        <div id="asl-kicker" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
        <div id="asl-payload" class="clip" data-start="0" data-duration="60" data-track-index="2"></div>
        <div id="asl-co" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("asl-root");
        const D = parseFloat(root.dataset.duration) || 3;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          kicker: "", payload: "", coWord: "", payload2: "", payload3: "",
          band: "headroom", payloadSize: 106,
          kickerAt: 0, payloadAt: 0.35, coAt: 0.75,
          replaceAt2: 0, replaceAt3: 0, accent: "#FDA933",
        };
        // PREVIEW-ONLY sample lockup, original Sniper copy (activates only
        // when ALL content is unset).
        const SAMPLE = { kicker: "Pass *#1:* cut before you polish", payload: "Cut Dead Air", coWord: "then retakes" };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["kicker", "payload", "coWord", "payload2", "payload3"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--asl-accent", String(vars.accent));

        if (String(vars.band) === "chest") root.classList.add("chest");
        const size = Math.min(152, Math.max(60, Number(vars.payloadSize) || 106));

        const clampAt = function (raw, fallback) {
          const v = isFinite(Number(raw)) ? Number(raw) : fallback;
          return Math.max(0, Math.min(v, Math.max(0, D - 0.1)));
        };
        const kickerAt = clampAt(vars.kickerAt, 0);
        const payloadAt = clampAt(vars.payloadAt, 0.35);
        const coAt = clampAt(vars.coAt, 0.75);

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // --- Kicker: sentence case, *asterisk* runs render bold in the
        //     accent (the payload words inside the kicker). 0-frame pop at
        //     kickerAt. ---
        const kickerEl = document.getElementById("asl-kicker");
        const kickerText = (vars.kicker == null ? "" : String(vars.kicker)).trim();
        if (kickerText) {
          kickerText.split(/(\*[^*]+\*)/).forEach(function (chunk) {
            if (!chunk) return;
            const isBold = chunk.charAt(0) === "*" && chunk.charAt(chunk.length - 1) === "*";
            const node = isBold ? document.createElement("b") : document.createTextNode(chunk);
            if (isBold) node.textContent = chunk.slice(1, -1);
            kickerEl.appendChild(node);
          });
          tl.set(kickerEl, { autoAlpha: 0 }, 0);
          tl.set(kickerEl, { autoAlpha: 1 }, kickerAt);
        } else {
          kickerEl.remove();               // unset var renders NOTHING
        }

        // --- Payload: ALL-CAPS accent on an ink plate, 0-frame pop; the
        //     replace-chain swaps the string IN PLACE (never re-enters). ---
        const payloadEl = document.getElementById("asl-payload");
        const payTexts = [vars.payload, vars.payload2, vars.payload3].map(function (p) {
          return (p == null ? "" : String(p)).trim();
        });
        const paySpans = payTexts.map(function (t, i) {
          if (!t) return null;
          const el = document.createElement("span");
          el.className = "asl-pay" + (i > 0 ? " alt" : "");
          el.style.fontSize = size + "px";
          const plate = document.createElement("span");
          plate.className = "asl-plate";
          plate.textContent = t;
          el.appendChild(plate);
          payloadEl.appendChild(el);
          return el;
        });
        if (paySpans.some(Boolean)) {
          tl.set(payloadEl, { autoAlpha: 0 }, 0);
          tl.set(payloadEl, { autoAlpha: 1 }, payloadAt);
          const rep2 = clampAt(vars.replaceAt2, 0);
          const rep3 = clampAt(vars.replaceAt3, 0);
          if (paySpans[1]) tl.set(paySpans[1], { autoAlpha: 0 }, 0);
          if (paySpans[2]) tl.set(paySpans[2], { autoAlpha: 0 }, 0);
          if (paySpans[1] && rep2 > 0) {   // instant in-place replace, no fade
            tl.set(paySpans[0], { autoAlpha: 0 }, rep2);
            tl.set(paySpans[1], { autoAlpha: 1 }, rep2);
            if (paySpans[2] && rep3 > rep2) {
              tl.set(paySpans[1], { autoAlpha: 0 }, rep3);
              tl.set(paySpans[2], { autoAlpha: 1 }, rep3);
            }
          }
        } else {
          payloadEl.remove();              // unset var renders NOTHING
        }

        // --- Co-word: 0-frame pop, 0.3-0.9s after the payload. ---
        const coEl = document.getElementById("asl-co");
        const coText = (vars.coWord == null ? "" : String(vars.coWord)).trim();
        if (coText) {
          coEl.textContent = coText;
          tl.set(coEl, { autoAlpha: 0 }, 0);
          tl.set(coEl, { autoAlpha: 1 }, Math.max(coAt, payloadAt));
        } else {
          coEl.remove();                   // unset var renders NOTHING
        }

        // Keep the paused timeline non-empty even for a single-token lockup
        // (an all-set timeline has zero tween duration; the render must span D).
        tl.set({}, {}, Math.max(0, D - 0.01));

        // No self exit — OUT is an instant clear ON the compositor's cut
        // (window end) or the in-place replace above. NEVER fade.
        tl.seek(0);
        window.__timelines["slideware-staircase-lockup"] = tl;
      })();
    </script>
  </body>
</html>
