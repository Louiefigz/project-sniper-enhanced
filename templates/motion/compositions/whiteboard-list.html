<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title pill text (empty = no pill)","default":""},
    {"id":"item1","type":"string","label":"Row 1 text (empty = never appears)","default":""},
    {"id":"item2","type":"string","label":"Row 2 text (empty = never appears)","default":""},
    {"id":"item3","type":"string","label":"Row 3 text (empty = never appears)","default":""},
    {"id":"item4","type":"string","label":"Row 4 text (empty = never appears)","default":""},
    {"id":"item5","type":"string","label":"Row 5 text (empty = never appears)","default":""},
    {"id":"at1","type":"number","label":"Row 1 land time (s)","default":0.4,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Row 2 land time (s)","default":1.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Row 3 land time (s)","default":2.0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at4","type":"number","label":"Row 4 land time (s)","default":2.8,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at5","type":"number","label":"Row 5 land time (s)","default":3.6,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"accent","type":"color","label":"Accent color (pill tint + checks + ticks)","default":"#054BC9"},
    {"id":"paper","type":"enum","label":"Paper","default":"whiteboard","options":[{"value":"whiteboard","label":"Whiteboard (cool paper, dot field)"},{"value":"cream","label":"Warm paper (dot field, dark ink)"}]}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: WHITEBOARD-LIST (16:9 talking-head longform)
    The checklist sibling of whiteboard-map — same full-frame paper canvas
    (Sniper paper #F1F4F6 with a 96px ink dot field; the "cream" paper value is
    a warm paper #F3EFE6 with the same dots; ink text 16.4 / 15.8:1). A title
    pill top-LEFT and up to 5 checklist
    rows (accent check square + dark text) landing per spoken beat down a left
    spine: each row's short connector TICK draws on just before the row lands.

    CONTRACT for the PRODUCER compositing stage:
      - anchor "own-screen" -> render `--format mp4` (opaque takeover). No self
        out-transition — the compositor (flash/wash) owns both seams.
      - title / item1..5 / at1..5 / accent are `data-composition-variables`.
        An EMPTY itemN never appears (rows compact upward); empty title = no
        pill and no first tick. atN = transcript time of the spoken beat,
        relative to the overlay's outStart.
      - UNSET everything renders the PREVIEW SAMPLE only (glass-rail G21
        pattern): demo content activates when title AND item1..5 are ALL unset;
        any plan that sets one row gets exactly its rows — no sample leak.
      - Timing (Sniper design parameters, same as whiteboard-map): row fades+rises ~250ms
        at atN; its spine tick draws ~300ms starting ~200ms before atN; the
        canvas drifts ~1.5% across D; un-landed rows are INVISIBLE.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window). Make it comfortably past the last atN.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · whiteboard-list</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F1F4F6;             /* opaque — this comp owns the whole frame */
        font-family: var(--font);
      }
      #wl-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Full-bleed paper on a CHILD (never the root). */
      #wl-bg { position: absolute; inset: 0; background: #F1F4F6; }

      /* Drifting world (oversized so the drift never exposes an edge). */
      #wl-world {
        position: absolute;
        left: -48px; top: -48px;
        width: 2016px; height: 1176px;
        will-change: transform;
      }
      #wl-grid {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(circle at 2px 2px, rgba(19, 23, 32, 0.16) 1.6px, transparent 2.2px);
        background-size: 96px 96px;
      }
      /* Warm-paper variant (paper value "cream"): warm off-white with the same
         dot field, ink text. Toggled by the `paper` var flipping #wl-root.cream. */
      #wl-root.cream #wl-bg { background: #F3EFE6; }
      #wl-root.cream #wl-grid {
        background-image:
          radial-gradient(circle at 2px 2px, rgba(60, 44, 20, 0.18) 1.6px, transparent 2.2px);
      }
      #wl-root.cream .wl-text { color: #141414; }
      #wl-canvas { position: absolute; left: 48px; top: 48px; width: 1920px; height: 1080px; }

      #wl-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .wl-tick {
        fill: none;
        stroke: color-mix(in srgb, var(--accent) 45%, #ffffff);
        stroke-width: 7px;
        stroke-linecap: round;
        will-change: stroke-dashoffset;
      }

      /* Title pill — same accent-tinted pill as whiteboard-map, anchored top-LEFT. */
      #wl-title {
        position: absolute;
        left: 150px; top: 120px;
        padding: 18px 36px;
        border-radius: 18px;
        background: color-mix(in srgb, var(--accent) 15%, #ffffff);
        border: 2px solid color-mix(in srgb, var(--accent) 30%, #ffffff);
        color: #101318;
        font-weight: 800;
        font-size: 46px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 10px 26px rgba(16, 24, 48, 0.10);
        will-change: transform, opacity;
      }

      /* Checklist rows — accent check square + dark ink text ON the canvas
         (the whiteboard language: written on the paper, not carded). */
      .wl-row {
        position: absolute;
        left: 170px;
        display: flex;
        align-items: center;
        gap: 24px;
        will-change: transform, opacity;
      }
      .wl-check {
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--accent) 15%, #ffffff);
        border: 2px solid color-mix(in srgb, var(--accent) 30%, #ffffff);
        color: var(--accent);
        font-weight: 900;
        font-size: 34px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }
      .wl-text {
        font-weight: 700;
        font-size: 40px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        color: #14161b;
        white-space: nowrap;
        max-width: 1450px;
      }
    </style>
  </head>
  <body>
    <div
      id="wl-root"
      data-composition-id="whiteboard-list"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="6"
    >
      <div id="wl-bg"></div>
      <div id="wl-world">
        <div id="wl-grid" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
        <div id="wl-canvas">
          <svg id="wl-svg" class="clip" viewBox="0 0 1920 1080" preserveAspectRatio="none"
               data-start="0" data-duration="60" data-track-index="2"></svg>
          <div id="wl-title" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
          <div id="wl-row-1" class="wl-row clip" data-start="0" data-duration="60" data-track-index="4">
            <span class="wl-check">✓</span><span class="wl-text"></span>
          </div>
          <div id="wl-row-2" class="wl-row clip" data-start="0" data-duration="60" data-track-index="5">
            <span class="wl-check">✓</span><span class="wl-text"></span>
          </div>
          <div id="wl-row-3" class="wl-row clip" data-start="0" data-duration="60" data-track-index="6">
            <span class="wl-check">✓</span><span class="wl-text"></span>
          </div>
          <div id="wl-row-4" class="wl-row clip" data-start="0" data-duration="60" data-track-index="7">
            <span class="wl-check">✓</span><span class="wl-text"></span>
          </div>
          <div id="wl-row-5" class="wl-row clip" data-start="0" data-duration="60" data-track-index="8">
            <span class="wl-check">✓</span><span class="wl-text"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("wl-root");
        const D = parseFloat(root.dataset.duration) || 6;

        // All content defaults are EMPTY: an unset row renders NOTHING (G21).
        const defaults = {
          title: "",
          item1: "", item2: "", item3: "", item4: "", item5: "",
          at1: 0.4, at2: 1.2, at3: 2.0, at4: 2.8, at5: 3.6,
          accent: "#054BC9", paper: "whiteboard",
        };
        // PREVIEW-ONLY demo content — activates ONLY when title AND every itemN
        // are unset (a bare preview/render with no --variables).
        const SAMPLE = {
          title: "The workflow",
          item1: "Record the episode once",
          item2: "Cut the filler automatically",
          item3: "Graphics land on the beat",
          item4: "Captions burn in",
          item5: "Ship to every platform",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["title", "item1", "item2", "item3", "item4", "item5"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--accent", vars.accent);
        if (String(vars.paper) === "cream") root.classList.add("cream");

        // Title pill (empty = no pill; the spine then starts at the first row).
        const titleEl = document.getElementById("wl-title");
        const titleText = (vars.title == null ? "" : String(vars.title)).trim();
        if (titleText) titleEl.textContent = titleText;
        else titleEl.remove();
        const PILL_BOTTOM = 206;   // spine start just under the pill
        const SPINE_X = 198;       // check-square center column (hidden under the pill)

        // Fill / prune the five static rows; empties drop and the list compacts.
        const active = [];
        for (let n = 1; n <= 5; n++) {
          const row = document.getElementById("wl-row-" + n);
          const text = (vars["item" + n] == null ? "" : String(vars["item" + n])).trim();
          if (!text) { row.remove(); continue; }
          row.querySelector(".wl-text").textContent = text;
          const at = Number(vars["at" + n]);
          active.push({ row: row, check: row.querySelector(".wl-check"),
                        at: isFinite(at) ? at : 0.4 });
        }
        // Vertical rhythm: fixed checklist spacing below the pill; a short list
        // breathes a little wider so 2 rows and 5 rows both read deliberate.
        const SQ = 56;
        const spacing = active.length <= 3 ? 150 : 128;
        const y0 = active.length <= 3 ? 330 : 300;
        active.forEach(function (a, i) {
          a.y = y0 + i * spacing;
          a.row.style.top = a.y + "px";
        });

        // Spine ticks: a short accent segment draws down to each row — from the
        // pill for row 1, from the previous row's square for the rest. Round
        // caps + the draw-on = the same hand grammar as whiteboard-map's elbows.
        const svg = document.getElementById("wl-svg");
        const NS = "http://www.w3.org/2000/svg";
        active.forEach(function (a, i) {
          let fromY;
          if (i === 0) {
            if (!titleText) return;              // no pill -> row 1 has no tick
            fromY = PILL_BOTTOM;
          } else {
            fromY = active[i - 1].y + SQ + 8;
          }
          const toY = a.y - 8;
          if (toY - fromY < 12) return;          // nothing meaningful to draw
          const path = document.createElementNS(NS, "path");
          path.setAttribute("class", "wl-tick");
          path.setAttribute("id", "wl-tick-" + (i + 1));
          path.setAttribute("d", "M " + SPINE_X + " " + fromY + " L " + SPINE_X + " " + toY);
          svg.appendChild(path);
          const L = path.getTotalLength();
          path.style.strokeDasharray = L;
          path.style.strokeDashoffset = L;       // resting = NOT drawn (progressive disclosure)
          a.tick = path;
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Same living-canvas drift as whiteboard-map (~1.5% across D).
        tl.fromTo("#wl-world", { x: 12, y: 5 }, { x: -16, y: -6, duration: D, ease: "none" }, 0);

        // Title pill fades+rises first (~250ms).
        if (titleText) {
          tl.set(titleEl, { opacity: 0, y: -12, scale: 0.96 }, 0);
          tl.to(titleEl, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power2.out" }, 0.12);
        }

        // Per row: tick draws ~300ms starting ~200ms before the land; the row
        // fades+rises ~250ms at atN with a small check-square pop.
        active.forEach(function (a) {
          const at = Math.max(0.15, Math.min(a.at, D - 0.35));
          if (a.tick) {
            tl.to(a.tick, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
              Math.max(0, at - 0.2));
          }
          tl.set(a.row, { opacity: 0, y: 14 }, 0);
          tl.set(a.check, { scale: 0.85 }, 0);
          tl.to(a.row, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at);
          tl.to(a.check, { scale: 1, duration: 0.3, ease: "back.out(2)" }, at + 0.05);
        });

        // No self fade-out: own-screen takeover holds; the compositor owns both seams.
        tl.seek(0);
        window.__timelines["whiteboard-list"] = tl;
      })();
    </script>
  </body>
</html>
