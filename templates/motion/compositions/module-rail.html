  <!--
    PROJECT SNIPER · LONG-FORM template: MODULE-RAIL (16:9, 1920x1080)
    The light information panel. A cool-paper field grows out of the LEFT
    edge into a 634px column beside the presenter and carries, top to bottom:
    an eyebrow, a thesis headline (2 lines max), an optional explainer, ONE
    content zone in one of five information shapes, an optional footer tag
    and a receipt line. The presenter keeps playing, full-frame, on the right.

    SNIPER DESIGN (tokens.css light module surface):
      - Field = --rail-cream (cool paper #F1F4F6) carrying a faint 48px ink
        dot field and a faint process-blue glow in the top-left corner — the
        light twin of module-takeover's graphite canvas, so both module
        surfaces read as the same instrument.
      - Eyebrow = --eyebrow-font (IBM Plex Mono 600) caps led by a square
        marker; headline = --font-display (Bricolage Grotesque 800) in
        --rail-cream-ink; explainer + row titles = --font (Inter 400/700);
        every number, key, tag, date, badge and receipt = Plex Mono.
      - Rows are white cards with 5px corners and 1px ink hairlines; the
        steps rail, status connectors and timeline nodes are square-cornered
        markers (2-3px radii), never dots or pills.
      - Semantic accents, one hex per role (WCAG 2.x ratios computed from
        the tokens.css values against the surface each colour sits on):
                     role                on paper #F1F4F6   on white card
          process  #447BE4 blue          3.66:1             4.04:1
          result   #CC7200 amber         3.18:1             3.51:1
          warn     #D33B36 red           4.27:1             4.72:1
          ink      #131720               16.23:1            17.93:1
          ink 72%  (eyebrow text)        6.78:1             7.13:1
          ink 62%  (explainer, numbers,
                    keys, dates, receipt) 4.85:1            5.02:1
        Checklist badge = ink text on an amber fill, 5.10:1. Amber is the
        result the viewer should remember; red is reserved for limits and
        failures (footAccent / row accent "warn") and appears nowhere else.

    CONTRACT for the PRODUCER compositing stage:
      - ALPHA OVERLAY, anchor "free-band" (render --format mov). NOT
        own-screen: the field grows from the LEFT edge with a HARD vertical
        edge (RAIL_WIPE_S = 0.3s power2.out — one quick gesture the eye can
        follow without waiting on it) and settles at RAIL_WIDTH_PX = 634
        (33.0%W). 634px is a geometry pin: it equals producer_config's
        recompose rail_width_frac 0.3302 for the kind, so the face-anchored
        `recompose` move (motion/recompose.py) re-centres the presenter in the
        remaining 67%W. The face is never covered.
      - Headline: at most 2 pipe-separated lines (more FAILS LOUDLY);
        capitalisation comes from the COPY, never from CSS.
      - contentMode picks the zone's information shape; rows are
        `field~field~...` per mode:
          kv        key~value[~TAG[~accent]]   accent: process|result|warn|ink
          status    label~status[~accent]      blue connector between cards
          steps     num~title[~TAG]            square markers on a blue rail
          checklist num~title[~badge]          badge default OK (amber fill)
          timeline  date~title[~node]          node: process|result
        An unknown mode, an unknown accent or a malformed row FAILS LOUDLY.
      - UNSET content renders NOTHING (G21). The SAMPLE below (original Sniper
        preview copy, steps mode) activates only when EVERY content variable
        is unset (bare preview/render).
      - moduleLands: narration-paced lands, one per PRESENT module in order
        [head, row x N (each row is its own land, so every point can lock to
        the word that introduces it), foot, evidence]. A count mismatch FAILS
        LOUDLY. Empty = LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S
        (0.2 + k*0.9s: one module per spoken clause at a relaxed pace — the
        same default cadence as module-takeover).
      - Build order: field grow -> head (the eyebrow leads the headline by
        EYEBROW_LEAD_S; headline lines ramp in place LINE_STAGGER_S = 0.12s
        apart; the explainer follows one stagger later) -> the zone chrome
        (steps/timeline spine) ramps SKELETON_GAP_S before the first row,
        never before the field has grown -> each row lands SHELL-FIRST and its
        text follows ROW_TEXT_GAP_S = 0.15s later (Sniper design parameter:
        the card registers a beat before its words, short enough that the
        row still reads as one land). Checklist badges land WITH their row;
        a status connector arrives WITH the card it leads to; timeline nodes
        land as whole units down the spine -> the footer tag and the receipt
        land LAST.
      - exit:"blur-recede": the WHOLE FIELD blurs+fades+recedes over the
        final EXIT_BLUR_S. The comp is an alpha layer, so the live face beside
        it stays sharp and the paper never outlives the stage. Default "hold"
        = hard-off on the cut (the compositor owns the seam).
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - Re-tint through the tokens: --rail-cream / --rail-cream-ink /
        --accent-process / --accent-result / --accent-warn (each fallback hex
        below equals the tokens.css value).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · module-rail</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #nr-root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        /* Ink steps derived from the ink token (ratios in the header). */
        --nr-ink: var(--rail-cream-ink, #131720);
        --nr-ink-label: color-mix(in srgb, var(--rail-cream-ink, #131720) 72%, transparent);
        --nr-ink-soft: color-mix(in srgb, var(--rail-cream-ink, #131720) 62%, transparent);
        --nr-hairline: color-mix(in srgb, var(--rail-cream-ink, #131720) 12%, transparent);
      }

      /* The paper field: grows 0 -> 634px (33.0%W) from the LEFT edge with a
         HARD vertical edge (no radius). overflow-hidden REVEALS the pinned,
         fixed-width stage instead of squishing it (glass-rail twin). */
      #nr-field {
        position: absolute;
        left: 0; top: 0;
        width: 634px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--rail-cream, #F1F4F6);
        background-image:
          radial-gradient(circle at 1px 1px, rgba(19, 23, 32, 0.09) 1.2px, transparent 1.6px),
          radial-gradient(ellipse 760px 520px at 0% 0%, rgba(68, 123, 228, 0.09), transparent 70%);
        background-size: 48px 48px, 100% 100%;
        will-change: width, opacity, filter;
      }
      #nr-stage {
        position: absolute;
        left: 56px; top: 0;
        width: 522px; height: 1080px;
        padding: 88px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 26px;
      }
      .module { will-change: opacity; }

      #nr-eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 23px; line-height: 1;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--nr-ink-label);
      }
      #nr-eyebrow .dot {
        width: 12px; height: 12px; border-radius: 2px;
        background: var(--nr-ink);
        flex: 0 0 auto;
      }
      #nr-eyebrow.process .dot { background: var(--accent-process, #447BE4); }
      #nr-eyebrow.result .dot { background: var(--accent-result, #CC7200); }

      #nr-headline {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 62px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: var(--nr-ink);
      }
      #nr-headline .line { display: block; will-change: opacity; }
      #nr-headline .l2.process { color: var(--accent-process, #447BE4); }
      #nr-headline .l2.result { color: var(--accent-result, #CC7200); }

      #nr-explainer {
        font-weight: 400; font-size: 25px; line-height: 1.34;
        color: var(--nr-ink-soft);
      }

      /* ---- Content zone (one chassis, five information shapes) ---- */
      #nr-zone { display: flex; flex-direction: column; gap: 14px; position: relative; }
      .nr-row { will-change: opacity; }
      .nr-row .row-inner { will-change: opacity; }

      /* White hairline card — the shared row container (kv, status, steps
         and checklist rows all live in it). */
      .card {
        background: #FFFFFF;
        border: 1px solid var(--nr-hairline);
        border-radius: 5px;
        padding: 16px 20px;
        box-shadow: 0 1px 3px rgba(19, 23, 32, 0.06);
      }
      .row-inner { display: flex; align-items: center; gap: 16px; min-width: 0; }
      .row-num {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 17px;
        color: var(--nr-ink-soft);
        flex: 0 0 auto;
      }
      .row-title {
        font-weight: 700; font-size: 27px; line-height: 1.05;
        letter-spacing: -0.01em;
        color: var(--nr-ink);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .row-tag {
        margin-left: auto;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 16px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent-process, #447BE4);
        flex: 0 0 auto;
      }
      .row-tag.result { color: var(--accent-result, #CC7200); }
      .row-tag.warn { color: var(--accent-warn, #D33B36); }
      .row-tag.ink { color: var(--nr-ink-soft); }

      /* steps: square markers on a blue rail linking the rows. */
      #nr-zone.mode-steps { padding-left: 30px; }
      #nr-zone.mode-steps::before {
        content: "";
        position: absolute; left: 5px; top: 18px; bottom: 18px;
        width: 2px;
        background: color-mix(in srgb, var(--accent-process, #447BE4) 55%, transparent);
      }
      .rail-dot {
        position: absolute; left: -30px; top: 50%;
        margin-top: -6px;
        width: 12px; height: 12px; border-radius: 2px;
        background: var(--accent-process, #447BE4);
      }
      #nr-zone.mode-steps .nr-row { position: relative; }

      /* checklist: the badge rides the row's right edge — ink mono on an
         amber fill (5.10:1). */
      .row-badge {
        margin-left: auto; flex: 0 0 auto;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 15px;
        letter-spacing: 0.1em;
        color: var(--nr-ink);
        background: var(--accent-result, #CC7200);
        border-radius: 3px;
        padding: 5px 10px;
      }

      /* status/queue: blue left rule + mono state; blue connector. */
      .card.status { border-left: 4px solid var(--accent-process, #447BE4); }
      .status-label {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 23px; letter-spacing: 0.04em;
        color: var(--nr-ink);
        white-space: nowrap;
      }
      .status-state {
        margin-left: auto; flex: 0 0 auto;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 16px; letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-process, #447BE4);
      }
      .status-state.result { color: var(--accent-result, #CC7200); }
      .status-state.warn { color: var(--accent-warn, #D33B36); }
      .nr-connector {
        width: 2px; height: 22px;
        margin: -8px 0 -8px 28px;
        background: var(--accent-process, #447BE4);
        will-change: opacity;
      }

      /* kv ledger: mono receipt rows. */
      .kv-key {
        font-family: var(--eyebrow-font);
        font-weight: 500; font-size: 19px;
        color: var(--nr-ink-soft);
        flex: 0 0 auto;
      }
      .kv-value {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 22px;
        color: var(--nr-ink);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* timeline: square outlined nodes on a blue spine. */
      #nr-zone.mode-timeline { padding-left: 40px; gap: 26px; }
      #nr-zone.mode-timeline::before {
        content: "";
        position: absolute; left: 9px; top: 14px; bottom: 14px;
        width: 2px;
        background: var(--accent-process, #447BE4);
      }
      #nr-zone.mode-timeline .nr-row { position: relative; }
      .tl-ring {
        position: absolute; left: -40px; top: 4px;
        width: 20px; height: 20px; border-radius: 3px;
        background: var(--rail-cream, #F1F4F6);
        border: 3px solid var(--accent-process, #447BE4);
      }
      .tl-ring.result { border-color: var(--accent-result, #CC7200); }
      .tl-date {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 17px; letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--nr-ink-soft);
      }
      .tl-title {
        font-weight: 700; font-size: 28px; line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--nr-ink);
      }
      .mode-timeline .row-inner { flex-direction: column; align-items: flex-start; gap: 4px; }

      /* Outlined footer tag: mono caps led by a square accent marker. */
      #nr-foot {
        align-self: flex-start;
        display: flex; align-items: center; gap: 12px;
        border: 1px solid color-mix(in srgb, var(--rail-cream-ink, #131720) 30%, transparent);
        border-radius: 4px;
        padding: 10px 16px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 18px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--nr-ink);
      }
      #nr-foot .dot {
        width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto;
        background: var(--accent-result, #CC7200);
      }
      #nr-foot.process .dot { background: var(--accent-process, #447BE4); }
      #nr-foot.warn .dot { background: var(--accent-warn, #D33B36); }

      #nr-evidence {
        font-family: var(--eyebrow-font);
        font-weight: 500; font-size: 19px; line-height: 1.3;
        letter-spacing: 0.13em; text-transform: uppercase;
        color: var(--nr-ink-soft);
        border-top: 1px solid color-mix(in srgb, var(--rail-cream-ink, #131720) 18%, transparent);
        padding-top: 16px;
      }
    </style>
  </head>
  <body>
    <div
      id="nr-root"
      data-composition-id="module-rail"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="8"
    >
      <div id="nr-field">
        <div id="nr-stage">
          <div id="nr-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="nr-eyebrow-text"></span></div>
          <div id="nr-headline" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="nr-explainer" class="module clip" data-start="0" data-duration="60" data-track-index="3"></div>
          <div id="nr-zone" class="module clip" data-start="0" data-duration="60" data-track-index="4"></div>
          <div id="nr-foot" class="module clip" data-start="0" data-duration="60" data-track-index="5"><span class="dot"></span><span id="nr-foot-text"></span></div>
          <div id="nr-evidence" class="module clip" data-start="0" data-duration="60" data-track-index="6"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("nr-root");
        const D = parseFloat(root.dataset.duration) || 8;
        const M = window.__motionTokens;

        // Chassis constants (Sniper design parameters, see header):
        const RAIL_WIPE_S = 0.3;        // left-edge grow, hard vertical edge
        const RAIL_WIDTH_PX = 634;      // settled 33.0%W (recompose 0.3302)
        const LINE_STAGGER_S = 0.12;    // headline per-line ramp stagger
        const ROW_TEXT_GAP_S = 0.15;    // row shell first, its text 0.15s later
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9; // one module per spoken clause

        const MODES = ["kv", "status", "steps", "checklist", "timeline"];
        const ACCENTS = ["process", "result", "warn", "ink"];

        const defaults = {
          eyebrow: "", eyebrowAccent: "ink", headlineLines: "", l2Accent: "ink",
          explainer: "", contentMode: "steps", rows: "",
          footChip: "", footAccent: "result",
          evidenceSource: "", evidenceDate: "",
          moduleLands: "", exit: "hold",
        };
        const CONTENT_KEYS = ["eyebrow", "headlineLines", "explainer", "rows",
          "footChip", "evidenceSource", "evidenceDate"];
        // PREVIEW-ONLY demo (original Sniper sample copy, steps mode). It
        // activates ONLY when every content variable is unset (G21).
        const SAMPLE = {
          eyebrow: "ROUGH-CUT PASS",
          headlineLines: "One pass.|Nothing missed.",
          explainer: "Every step a rough cut runs before review.",
          contentMode: "steps",
          rows: "01~Transcribe~WORDS|02~Trim~CUTS|03~Captions~BURN|04~Pacing~TIGHTEN|05~Review~VERIFY",
          evidenceSource: "SAMPLE PROJECT · PREVIEW DATA",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }
        function accentOf(raw, where) {
          const a = (raw || "").trim().toLowerCase();
          if (!a) return "";
          if (ACCENTS.indexOf(a) < 0) {
            throw new Error("module-rail: " + where + " accent '" + a +
              "' not in " + ACCENTS.join("|"));
          }
          return a;
        }

        // ---- Fill / prune the chassis modules (unset renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("nr-eyebrow");
        if (ebText) {
          document.getElementById("nr-eyebrow-text").textContent = ebText;
          const ea = accentOf(str("eyebrowAccent") || "ink", "eyebrowAccent");
          if (ea && ea !== "ink") ebEl.classList.add(ea);
        } else { ebEl.remove(); }

        const headEl = document.getElementById("nr-headline");
        const heads = str("headlineLines");
        if (heads) {
          const lines = heads.split("|").map(function (s) { return s.trim(); });
          if (lines.length > 2) {
            throw new Error("module-rail: headlineLines is 2 lines max " +
              "(thesis headline), got " + lines.length);
          }
          lines.forEach(function (line, j) {
            const el = document.createElement("span");
            el.className = "line" + (j === 1 ? " l2" : "");
            const l2a = accentOf(str("l2Accent") || "ink", "l2Accent");
            if (j === 1 && l2a && l2a !== "ink") el.classList.add(l2a);
            el.textContent = line;
            headEl.appendChild(el);
          });
        } else { headEl.remove(); }

        const expText = str("explainer");
        const expEl = document.getElementById("nr-explainer");
        if (expText) expEl.textContent = expText;
        else expEl.remove();

        // ---- Content zone: parse rows per contentMode (fail loudly) ----
        const zone = document.getElementById("nr-zone");
        const mode = str("contentMode") || "steps";
        if (MODES.indexOf(mode) < 0) {
          throw new Error("module-rail: contentMode '" + mode + "' not in " +
            MODES.join("|"));
        }
        const rowsRaw = str("rows");
        const rowEls = [];      // [{el (ramp target), inner (text target or null)}]
        if (rowsRaw) {
          zone.classList.add("mode-" + mode);
          rowsRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length < 2 || !f[0] || !f[1]) {
              throw new Error("module-rail: " + mode + " row " + (i + 1) +
                " needs at least 2 tilde-separated fields, got '" + line + "'");
            }
            const row = document.createElement("div");
            row.className = "nr-row" + (mode === "timeline" ? "" : " card");
            if (mode === "status") row.classList.add("status");
            const inner = document.createElement("div");
            inner.className = "row-inner";
            row.appendChild(inner);
            function span(cls, text) {
              const s = document.createElement("span");
              s.className = cls;
              s.textContent = text;
              inner.appendChild(s);
              return s;
            }
            if (mode === "kv") {
              span("kv-key", f[0]);
              span("kv-value", f[1]);
              if (f[2]) span("row-tag " + (accentOf(f[3], "kv row " + (i + 1)) || "process"), "→ " + f[2]);
            } else if (mode === "status") {
              span("status-label", f[0]);
              span("status-state " + (accentOf(f[2], "status row " + (i + 1)) || "process"), f[1]);
              if (i > 0) {           // card -> connector -> card
                const conn = document.createElement("div");
                conn.className = "nr-connector";
                zone.appendChild(conn);
                rowEls[rowEls.length - 1].connectorNext = conn;
              }
            } else if (mode === "steps") {
              span("row-num", f[0]);
              span("row-title", f[1]);
              if (f[2]) span("row-tag", f[2]);
              const dot = document.createElement("span");
              dot.className = "rail-dot";
              row.appendChild(dot);
            } else if (mode === "checklist") {
              span("row-num", f[0]);
              span("row-title", f[1]);
              span("row-badge", f[2] || "OK");
            } else {                 // timeline
              const ring = document.createElement("span");
              ring.className = "tl-ring" +
                ((accentOf(f[2], "timeline row " + (i + 1)) || "process") === "result" ? " result" : "");
              row.appendChild(ring);
              span("tl-date", f[0]);
              span("tl-title", f[1]);
            }
            zone.appendChild(row);
            rowEls.push({ el: row, inner: inner });
          });
        } else { zone.remove(); }

        const footText = str("footChip");
        const footEl = document.getElementById("nr-foot");
        if (footText) {
          document.getElementById("nr-foot-text").textContent = footText;
          const fa = accentOf(str("footAccent") || "result", "footAccent");
          if (fa && fa !== "result") footEl.classList.add(fa);
        } else { footEl.remove(); }

        const evSource = str("evidenceSource");
        const evEl = document.getElementById("nr-evidence");
        if (evSource) {
          evEl.textContent = ["CLAIM SOURCE", evSource, str("evidenceDate")]
            .filter(Boolean).join(" · ");
        } else { evEl.remove(); }

        // ---- Narration-paced module lands ----
        // One land per PRESENT module, rows EXPANDED (each row word-lockable):
        // [head, row x N, foot, evidence]. Mismatch fails LOUDLY.
        const modules = [];
        if (ebText || heads || expText) modules.push("head");
        rowEls.forEach(function (_, i) { modules.push("row" + (i + 1)); });
        if (footText) modules.push("foot");
        if (evSource) modules.push("evidence");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("module-rail: moduleLands needs " + modules.length +
              " finite times for modules [" + modules.join(", ") + "], got '" +
              landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Field grows in from the LEFT edge (hard vertical edge).
        tl.fromTo("#nr-field", { width: 0 },
          { width: RAIL_WIDTH_PX, duration: RAIL_WIPE_S, ease: "power2.out" }, 0);

        if (landOf.head != null) {
          const t0 = landOf.head;
          let headAt = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            headAt = t0 + M.EYEBROW_LEAD_S;    // the eyebrow leads the headline
          }
          let lastAt = headAt;
          if (heads) {
            headEl.querySelectorAll(".line").forEach(function (lineEl, j) {
              lastAt = headAt + j * LINE_STAGGER_S;
              M.textRamp(tl, lineEl, lastAt);  // in-place opacity ramp
            });
          }
          if (expText) M.textRamp(tl, expEl, lastAt + LINE_STAGGER_S);
        }

        // Zone chrome (the steps/timeline spine) is a SKELETON: it ramps
        // SKELETON_GAP_S before the first row (containers before text,
        // clamped to the grow) so no bare spine sits on empty paper longer
        // than the skeleton beat (plan_lint_visual LL-002 doctrine).
        if (rowEls.length) {
          M.textRamp(tl, zone,
            Math.max(RAIL_WIPE_S, landOf.row1 - M.SKELETON_GAP_S));
        }

        // Rows: shell-FIRST at each land, text ROW_TEXT_GAP_S later.
        // Timeline nodes land as whole units, node by node down the spine.
        // Status connectors arrive WITH the card that follows them
        // (card -> connector -> card).
        rowEls.forEach(function (r, i) {
          const land = landOf["row" + (i + 1)];
          if (mode === "timeline") {
            M.textRamp(tl, r.el, land);
          } else {
            M.skeletonFirst(tl, r.el, r.inner, { at: land, gapS: ROW_TEXT_GAP_S });
          }
          if (i > 0 && rowEls[i - 1].connectorNext) {
            M.textRamp(tl, rowEls[i - 1].connectorNext, land);
          }
        });

        if (landOf.foot != null) M.textRamp(tl, footEl, landOf.foot);
        if (landOf.evidence != null) M.textRamp(tl, evEl, landOf.evidence);

        // exit:"blur-recede": the whole FIELD — an alpha layer over live
        // footage, so the face beside it stays sharp and the paper never
        // outlives the stage. Default "hold": the compositor owns the seam.
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#nr-field", D - M.EXIT_BLUR_S);
        }

        tl.seek(0);
        window.__timelines["module-rail"] = tl;
      })();
    </script>
  </body>
</html>
