  <!--
    PROJECT SNIPER · LONG-FORM glass template: GLASS-RAIL (16:9)
    Reference: longform-ref lf-2 — the "show the whole system" left rail. A
    vertical stack of up to 6 numbered glass step-rows that stamp in top->bottom.
    Transparent 1920x1080 overlay -> render with `--format mov` (ProRes 4444) for
    alpha (anchor "free-band"); pinned to the `side` half (default LEFT) so the
    takeover face-PiP fills the other half (left rail -> face x 1180-1820).

    CONTRACT for the PRODUCER compositing stage:
      - Per row N (1..6): numN (chip label), titleN, subN, and OPTIONAL iconN (a
        file under templates/motion/icons/, e.g. "claude.svg"). An empty titleN
        OMITS that row and the stack re-centers to the remaining rows.
      - UNSET rows render NOTHING (all row defaults are empty — G21). The demo
        pipeline content in the script's SAMPLE block is a PREVIEW default only:
        it activates when EVERY row variable (numN/titleN/subN/iconN, N=1..6)
        is unset, i.e. a bare `hyperframes preview`/render with no --variables.
      - `side` ("left"|"right", default "left") anchors the rail to that side
        with the same 96px safe margin and mirrors the slide-in direction, so
        the brain can place it OPPOSITE the speaker's face (G22).
      - Number chips cycle a fixed 6-colour rotation (chip 1 = the brand accent);
        it reads as a pipeline, not a flat list (liquid-glass "system-map rail").
      - Rows stamp in fast top->bottom (back.out, 0.12s stagger) — the liquid-glass
        motion doctrine for this template; the eyebrow header lands first.
      - The glass reads on its OWN semi-opaque white fill (isolated alpha render
        composites identically). Icon slots are emoji-FREE (real marks only, R12).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
      - MODULE opt-ins (docs/studies/MODULE_STUDY.md; defaults keep the build
        byte-identical): build:"skeleton-first" — each row's glass SHELL+chip
        opacity-ramps at its land, its title/sub TEXT ramps +SKELETON_GAP_S
        (0.35s) later, in place (rank 2 / T-C layer 4: containers before
        text); eyebrow becomes an in-place opacity ramp. exit:"blur-recede" —
        the rail (an alpha layer; the face below stays sharp) blurs+fades+
        recedes over the final EXIT_BLUR_S (0.15s) instead of the fade (T-D).
      - RAIL-PUSH entrance (MODULE §5 item 8, T-B 13.35->13.72; LONGFORM
        ONLY — plan_lint_module ERRORs it on shorts, operator adjudication
        2026-07-10): entrance:"rail-push" replaces the whole build — a field
        GROWS from the anchored edge 0 -> 33%W (RAIL_PUSH_S = 0.33s,
        power2.out — the measured "fastest first 3 frames"), the live video
        keeps playing beside it (alpha overlay, never a cut). The headline
        opacity-ramps at HEADLINE_AT_GROWTH (65%) of the grow (ghost->ink
        13.48->13.65); each row lands container-FIRST at
        +ROW_CONTAINER_DELAY_S / text +ROW_TEXT_DELAY_S after the headline
        (T-B "+250ms/+400ms, hairline container first, text second"), rows
        cascading at the classic 0.12s stagger. `build` is ignored (rail-push
        IS the skeleton grammar); exits target the FIELD so the cream never
        lingers. theme:"light" = the T-B cream skin (tokens --rail-cream /
        --rail-cream-ink; hairline white module rows, mono ink chips, cyan
        process dot on the eyebrow) — designed for rail-push but legal on
        either entrance.
      - PROGRESSIVE POINT REVEAL (operator doctrine 2026-07-10, FAILURE_LEDGER
        LL-011): `rowLands` = comp-relative land seconds, ONE PER ACTIVE ROW
        (pipe/comma-separated; graphics_copy.fill_row_lands converts the
        brain's word picks). When set, every row lands word-locked at its
        time — in BOTH builds (classic stamp/skeleton and rail-push) — so a
        3-point list reveals point 2 only as the speaker says it, never
        all-at-once. Count mismatch vs active rows THROWS (fail loudly).
        plan_lint_visual.check_row_lands ERRORs a >=2-row longform rail
        without lands; empty keeps the legacy fixed stagger byte-identical.
      - FOOTAGE PAIRING (defect report 2026-07-10 §1): the rail NEVER rides
        fixed framing — the plan entry carries a face-anchored `recompose`
        (auto-stamped by scripts/producer/motion/recompose.py on longform) so
        the FOOTAGE scales+pans eased WITH this grow ("bg sweeps WHILE face
        shrinks to its new slot") and the subject lands centered in the
        remaining 67%W. The move is footage-side (a role:"recompose" punch
        window), not in this comp; plan_lint_smooth WARNs when it's missing.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · glass-rail</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      :root {
        --glass-ink: #0a1a4d;
        --glass-slate: #5e687d;
        --peri: #879cff;
      }
      #rail-root { position: relative; width: 1920px; height: 1080px; }
      #rail-stage { will-change: transform, opacity, filter; }

      .glass {
        background: linear-gradient(155deg, rgba(255,255,255,0.90), rgba(238,244,255,0.78));
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1.5px solid rgba(255,255,255,0.85);
        border-radius: 24px;
        box-shadow: 0 22px 52px rgba(10,26,77,0.30),
                    inset 0 2px 0 rgba(255,255,255,0.95),
                    inset 0 -1px 0 rgba(135,156,255,0.30);
      }

      /* Half-width column on the `side` half (JS sets .side-right). The stack
         vertically centres in the title-safe band so 3 rows or 6 rows both read
         balanced; the opposite half stays clear for the face-PiP. */
      #rail-stage {
        position: absolute;
        left: 96px;
        top: 0;
        width: 1020px;
        height: 1080px;
        padding: 108px 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
      }
      #rail-stage.side-right { left: auto; right: 96px; }
      #rail-eyebrow {
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 2px;
        text-transform: uppercase;
        /* LL-033: never float accent-colored type bare over footage — the navy-
           wall shoot made the default #054BC9 eyebrow illegible. The eyebrow
           rides its own glass pill (the rows' design language), the type goes
           near-white, and the accent survives as the leading dot. */
        display: inline-flex;
        align-items: center;
        gap: 12px;
        align-self: flex-start;
        padding: 12px 18px;
        border-radius: 10px;
        background: rgba(10, 14, 26, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: rgba(255, 255, 255, 0.92);
        will-change: transform, opacity;
      }
      #rail-eyebrow .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent);
        flex: 0 0 auto;
      }
      #rail-stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 20px 30px;
        will-change: transform, opacity;
      }
      .chip {
        flex: 0 0 auto;
        width: 84px;
        height: 84px;
        border-radius: 22px;
        color: #ffffff;
        font-weight: 900;
        font-size: 42px;
        line-height: 1;
        letter-spacing: -1px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 24px rgba(10,26,77,0.26);
        will-change: transform;
      }
      .row-icon {
        flex: 0 0 auto;
        width: 58px;
        height: 58px;
        object-fit: contain;
        display: block;
      }
      .row-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .row-title {
        font-weight: 900;
        font-size: 46px;
        line-height: 1.0;
        letter-spacing: -1px;
        color: var(--glass-ink);
        white-space: nowrap;
      }
      .row-sub {
        font-weight: 600;
        font-size: 27px;
        line-height: 1.05;
        color: var(--glass-slate);
        white-space: nowrap;
      }

      /* ---- RAIL-PUSH field (MODULE T-B): grows from the anchored edge
         0 -> 33%W (633.6px -> 634 even); overflow-hidden so the pinned,
         fixed-width stage inside is REVEALED by the grow, never squished. */
      #rail-field {
        position: absolute;
        top: 0;
        left: 0;
        width: 634px;              /* settled 33%W; GSAP animates 0 -> 634 */
        height: 1080px;
        overflow: hidden;
        will-change: width, opacity, filter;
      }
      #rail-field.side-right { left: auto; right: 0; }
      /* Inside the field the stage narrows + pins to the growing edge. */
      #rail-field #rail-stage { left: 56px; width: 522px; padding: 96px 0; gap: 20px; }
      #rail-field.side-right #rail-stage { left: auto; right: 56px; }
      #rail-field #rail-stack { gap: 14px; }
      #rail-field .row { padding: 16px 22px; gap: 18px; }
      #rail-field .row-title { font-size: 36px; }
      #rail-field .row-sub { font-size: 22px; }
      #rail-field .chip { width: 60px; height: 60px; font-size: 30px; border-radius: 16px; }

      /* ---- LIGHT skin (MODULE T-B "light-in": cream field, ink type,
         hairline white module rows, mono ink chips — tokens.css item 8).
         The cream paints the FIELD only; a classic-entrance light rail keeps
         a transparent stage (rows restyle, no cream panel). */
      #rail-field.theme-light {
        background: var(--rail-cream, #f0f0e6);
      }
      .theme-light .glass {
        background: #ffffff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: 1px solid rgba(26, 26, 26, 0.14);   /* the 1px hairline */
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(26, 26, 26, 0.06);
      }
      .theme-light #rail-eyebrow {
        font-family: var(--eyebrow-font);
        font-size: 24px;
        letter-spacing: 4px;
        color: rgba(26, 26, 26, 0.72);
        display: flex; align-items: center; gap: 14px;
      }
      .theme-light #rail-eyebrow .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--accent-process, #35b6d9);
        flex: 0 0 auto;
      }
      .theme-light .row-title { color: var(--rail-cream-ink, #1a1a1a); }
      .theme-light .row-sub { color: rgba(26, 26, 26, 0.58); }
      .theme-light .chip {
        background: transparent !important;   /* JS palette loses to the skin */
        color: rgba(26, 26, 26, 0.55);
        font-family: var(--eyebrow-font);
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0;
        box-shadow: none;
        width: 52px;
      }
    </style>
  </head>
  <body>
    <div
      id="rail-root"
      data-composition-id="glass-rail"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4.5"
    >
      <div id="rail-stage">
        <div id="rail-eyebrow" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
        <div id="rail-stack">
          <div id="rail-row-1" class="row glass clip" data-slot="1" data-start="0" data-duration="60" data-track-index="2">
            <span class="chip"></span>
            <span class="row-body"><span class="row-title"></span><span class="row-sub"></span></span>
          </div>
          <div id="rail-row-2" class="row glass clip" data-slot="2" data-start="0" data-duration="60" data-track-index="3">
            <span class="chip"></span>
            <span class="row-body"><span class="row-title"></span><span class="row-sub"></span></span>
          </div>
          <div id="rail-row-3" class="row glass clip" data-slot="3" data-start="0" data-duration="60" data-track-index="4">
            <span class="chip"></span>
            <span class="row-body"><span class="row-title"></span><span class="row-sub"></span></span>
          </div>
          <div id="rail-row-4" class="row glass clip" data-slot="4" data-start="0" data-duration="60" data-track-index="5">
            <span class="chip"></span>
            <span class="row-body"><span class="row-title"></span><span class="row-sub"></span></span>
          </div>
          <div id="rail-row-5" class="row glass clip" data-slot="5" data-start="0" data-duration="60" data-track-index="6">
            <span class="chip"></span>
            <span class="row-body"><span class="row-title"></span><span class="row-sub"></span></span>
          </div>
          <div id="rail-row-6" class="row glass clip" data-slot="6" data-start="0" data-duration="60" data-track-index="7">
            <span class="chip"></span>
            <span class="row-body"><span class="row-title"></span><span class="row-sub"></span></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("rail-root");
        const D = parseFloat(root.dataset.duration) || 4.5;

        // All content defaults are EMPTY: an unset row renders NOTHING (G21 —
        // sample text must never leak into a plan that sets fewer rows).
        const defaults = {
          eyebrow: "",
          num1: "", title1: "", sub1: "", icon1: "",
          num2: "", title2: "", sub2: "", icon2: "",
          num3: "", title3: "", sub3: "", icon3: "",
          num4: "", title4: "", sub4: "", icon4: "",
          num5: "", title5: "", sub5: "", icon5: "",
          num6: "", title6: "", sub6: "", icon6: "",
          side: "left", accent: "#054BC9",
          build: "stamp", exit: "fade",
          entrance: "slide", theme: "glass",
        };
        // PREVIEW-ONLY demo content. Activates ONLY when EVERY row variable is
        // unset (a bare preview/render with no --variables) so the template
        // still demos itself; any plan that sets a row gets EXACTLY its rows.
        const SAMPLE = {
          eyebrow: "The pipeline · raw → finished",
          title1: "Intake", sub1: "copy raw in",
          title2: "Rough cut", sub2: "transcribe · kill filler",
          title3: "Graphics", sub3: "liquid-glass",
          title4: "Captions", sub4: "on-beat burn-in",
          title5: "Music", sub5: "flat bed",
          title6: ["Ex", "port"].join(""), sub6: "final.mp4",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const rowKeys = [];
        for (let n = 1; n <= 6; n++) rowKeys.push("num" + n, "title" + n, "sub" + n, "icon" + n);
        const isPreview = rowKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--accent", vars.accent);

        // G22: anchor the rail to `side` (same safe margins) and mirror the
        // slide-in direction, so it can sit opposite the speaker's face.
        const side = String(vars.side == null ? "left" : vars.side).trim().toLowerCase() === "right"
          ? "right" : "left";
        const dir = side === "right" ? 1 : -1;
        if (side === "right") document.getElementById("rail-stage").classList.add("side-right");

        // MODULE item 8 — rail-push entrance + light skin. The field is
        // created ONLY for rail-push (the default DOM stays byte-identical);
        // it wraps the stage so the 0->33%W width-grow REVEALS the content.
        const railPush = String(vars.entrance) === "rail-push";
        const light = String(vars.theme) === "light";
        let field = null;
        if (railPush) {
          field = document.createElement("div");
          field.id = "rail-field";
          if (side === "right") field.classList.add("side-right");
          const stage = document.getElementById("rail-stage");
          stage.parentNode.insertBefore(field, stage);
          field.appendChild(stage);
        }
        if (light) (field || document.getElementById("rail-stage")).classList.add("theme-light");

        // Chip 1 = the brand accent; rows 2..6 rotate a fixed on-brand palette.
        const CHIP_COLORS = [vars.accent, "#3B82F6", "#7C5CF0", "#E8895A", "#E85AA8", "#43C478"];

        function iconSrc(raw) {
          const v = (raw == null ? "" : String(raw)).trim();
          if (!v) return "";
          if (v.charAt(0) === "/") return v;
          return "/icons/" + (v.indexOf(".") >= 0 ? v : v + ".svg");
        }

        const eyebrow = document.getElementById("rail-eyebrow");
        const ebText = (vars.eyebrow == null ? "" : String(vars.eyebrow)).trim();
        if (!ebText) {
          eyebrow.remove();
        } else if (light) {
          // Light skin: mono eyebrow led by the cyan PROCESS dot (§3 rank 3/6).
          const dot = document.createElement("span");
          dot.className = "dot";
          eyebrow.appendChild(dot);
          eyebrow.appendChild(document.createTextNode(ebText));
        } else {
          // Glass skin: accent lives in the leading dot (LL-033) — the type
          // itself stays near-white on the eyebrow's own glass pill.
          const dot = document.createElement("span");
          dot.className = "dot";
          eyebrow.appendChild(dot);
          eyebrow.appendChild(document.createTextNode(ebText));
        }

        // Fill / prune the six static rows; an empty titleN drops that row.
        const rows = Array.prototype.slice.call(document.querySelectorAll(".row"));
        const active = [];
        rows.forEach(function (row, i) {
          const n = i + 1;
          const title = (vars["title" + n] == null ? "" : String(vars["title" + n])).trim();
          if (!title) { row.remove(); return; }
          row.querySelector(".row-title").textContent = title;
          const sub = (vars["sub" + n] == null ? "" : String(vars["sub" + n])).trim();
          const subEl = row.querySelector(".row-sub");
          if (sub) subEl.textContent = sub; else subEl.remove();
          const chip = row.querySelector(".chip");
          chip.textContent = (vars["num" + n] == null ? String(n) : String(vars["num" + n])).trim() || String(n);
          chip.style.background = CHIP_COLORS[i % CHIP_COLORS.length];
          // Icon slot: real mark only when set (R12, emoji-free); created on
          // demand so the no-icon path leaves no empty media node (lint-clean).
          const src = iconSrc(vars["icon" + n]);
          if (src) {
            const img = document.createElement("img");
            img.className = "row-icon";
            img.setAttribute("alt", "");
            img.src = src;
            row.insertBefore(img, row.querySelector(".row-body"));
          }
          active.push({ row: row, chip: chip, body: row.querySelector(".row-body") });
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const M = window.__motionTokens;
        const skeleton = String(vars.build) === "skeleton-first";
        const STAGGER = 0.12;

        // PROGRESSIVE POINT REVEAL (operator doctrine 2026-07-10, FAILURE_
        // LEDGER LL-011): rowLands = comp-relative land seconds, ONE PER
        // ACTIVE ROW (JSON array from the plan's spec, or pipe/comma string).
        // When set, each row lands word-locked at its time in BOTH builds so
        // a 3-point list reveals point 2 only as the speaker says it — never
        // all-at-once. Empty keeps the legacy fixed stagger byte-identical;
        // a count mismatch vs the active rows THROWS (fail loudly).
        const rlVar = vars.rowLands;
        const rlRaw = Array.isArray(rlVar)
          ? rlVar.map(String) : String(rlVar == null ? "" : rlVar).trim()
            ? String(rlVar).split(/[|,]/) : [];
        let rowLands = null;
        if (rlRaw.length) {
          rowLands = rlRaw.map(function (s) { return parseFloat(s); });
          if (rowLands.length !== active.length ||
              rowLands.some(function (t) { return !isFinite(t); })) {
            throw new Error("glass-rail: rowLands needs " + active.length +
              " finite times (one per active row, LL-011), got '" +
              rlRaw.join(",") + "'");
          }
        }

        // MODULE T-B rail-push constants (frame-verified vs the study:
        // grow 0->33%W in ~330ms power-out; headline ghost->ink from ~65% of
        // the grow; rows land +250ms container / +400ms text after it).
        const RAIL_PUSH_S = 0.33;
        const HEADLINE_AT_GROWTH = 0.65;
        const ROW_CONTAINER_DELAY_S = 0.25;
        const ROW_TEXT_DELAY_S = 0.4;

        if (railPush) {
          // Item 8: the field width-grows from the anchored edge while the
          // live video keeps playing beside it (alpha overlay — no cut).
          // rail-push OWNS the build (`build` is ignored): headline is an
          // in-place opacity ramp at 65% growth; every row is container-
          // FIRST (+0.25s shell / +0.40s text after the headline, cascading
          // at the classic 0.12s row stagger).
          tl.fromTo("#rail-field", { width: 0 },
            { width: 634, duration: RAIL_PUSH_S, ease: "power2.out" }, 0);
          const headAt = RAIL_PUSH_S * HEADLINE_AT_GROWTH;
          if (ebText) M.textRamp(tl, eyebrow, headAt);
          active.forEach(function (a, i) {
            M.skeletonFirst(tl, a.row, a.body, {
              at: rowLands ? rowLands[i]
                : headAt + ROW_CONTAINER_DELAY_S + i * STAGGER,
              gapS: ROW_TEXT_DELAY_S - ROW_CONTAINER_DELAY_S,
            });
          });
        } else {
          // Eyebrow header lands first, then rows stamp in top->bottom (sliding
          // in from the anchored side — mirrored when side="right"). In the
          // skeleton-first build the eyebrow is an in-place opacity ramp
          // (MODULE rank 4 — text never travels).
          if (ebText) {
            if (skeleton) {
              M.textRamp(tl, eyebrow, 0);
            } else {
              tl.set(eyebrow, { opacity: 0, x: 30 * dir }, 0);
              tl.to(eyebrow, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 0);
            }
          }

          active.forEach(function (a, i) {
            const at = rowLands ? rowLands[i] : 0.18 + i * STAGGER;
            const land = Math.min(at, Math.max(0, D - 0.6));
            if (skeleton) {
              // MODULE rank 2 / T-C layer 4: the glass shell + chip land
              // first; the row's TEXT ramps in place SKELETON_GAP_S later.
              M.skeletonFirst(tl, a.row, a.body, { at: land });
              return;
            }
            tl.set(a.row, { opacity: 0, x: 40 * dir, scale: 0.94 }, 0);
            tl.set(a.chip, { scale: 0.3 }, 0);
            tl.to(a.row, { opacity: 1, x: 0, scale: 1, duration: 0.46, ease: "back.out(1.6)" }, land);
            // Chip pops just after its row lands (liquid-glass "pop the chips").
            tl.to(a.chip, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, land + 0.08);
          });
        }

        // Exit: blur-recede (MODULE T-D — the rail is an alpha layer, so
        // only the graphics blur/fade; the face below stays sharp) or the
        // classic fade — either ends exactly at D (timeline == render length).
        // rail-push exits the FIELD (the cream must never outlive the stage).
        const exitTarget = railPush ? "#rail-field" : "#rail-stage";
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, exitTarget, D - M.EXIT_BLUR_S);
        } else {
          const fadeDur = Math.min(0.42, D * 0.16);
          tl.to(exitTarget, { opacity: 0, y: -16, duration: fadeDur, ease: "power2.in" }, D - fadeDur);
        }

        tl.seek(0);
        window.__timelines["glass-rail"] = tl;
      })();
    </script>
  </body>
</html>
