<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"value","type":"string","label":"Stat value (verbatim from transcript)","default":"10+ years"},
    {"id":"label","type":"string","label":"Stat label","default":"in software"},
    {"id":"count_up","type":"boolean","label":"Animate the number counting up","default":true},
    {"id":"accent","type":"color","label":"Accent color","default":"#054BC9"},
    {"id":"build","type":"enum","label":"Build grammar","default":"pop","options":[{"value":"pop","label":"Pop (back.out, unchanged)"},{"value":"skeleton-first","label":"Skeleton-first (shell before content — MODULE rank 2)"}]},
    {"id":"eyebrow","type":"string","label":"Eyebrow microtext (mono caps + colored dot; empty = omit)","default":""},
    {"id":"evidenceSource","type":"string","label":"Evidence ribbon source (mono receipt, lands last; empty = omit)","default":""},
    {"id":"evidenceDate","type":"string","label":"Evidence ribbon date","default":""}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: STAT-CARD (MG-1)
    Trigger it serves: numbers / metrics ("10+ years", "1,000,000 followers", "$12k/mo").
    Transparent 1080x1920 overlay -> render with `--format mov` (ProRes 4444) for alpha.

    CONTRACT for the PRODUCER compositing stage:
      - CONTENT + accent are `data-composition-variables` (fill with --variables).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (below). HyperFrames
        fixes root duration at compile time and IGNORES --variables for it, so the
        timeline reads its length from that attribute (one source of truth). To
        change the overlay length, template the `data-duration` value directly
        (a deterministic one-line edit) — do NOT try to pass duration via --variables.
      - The number counts up FROM 0 to the numeric run inside `value`, preserving
        prefix/suffix/comma-format ("$12k/mo" -> counts the 12). value with no digits
        just renders statically. Numbers are verbatim from the transcript (never
        invented) — MG plan §4 lint cross-checks spec values appear in the transcript.
      - MODULE opt-ins (docs/studies/MODULE_STUDY.md; all default OFF — the pop
        build is byte-identical without them): build:"skeleton-first" — the
        card SHELL opacity-ramps at 0, content (value/bar/label + count-up
        start) ramps +SKELETON_GAP_S (0.35s, rank 2); eyebrow — mono caps +
        colored dot ABOVE the value, leading content by EYEBROW_LEAD_S
        (0.25s, rank 3; in the pop build it simply rides the card pop);
        evidenceSource/-Date — mono receipt ribbon, lands LAST (rank 9).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · stat-card</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #stat-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* Centered on the true visual center (x=495), in the free band (y 560-1150). */
      .stage {
        position: absolute;
        left: var(--visual-center-x);
        top: 820px;
        transform: translate(-50%, -50%);
        width: var(--safe-width);
        display: flex;
        justify-content: center;
      }
      .card {
        background: var(--card-bg);
        border-radius: var(--card-radius);
        padding: 44px 56px;
        box-shadow: var(--card-shadow);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        max-width: var(--safe-width);
        will-change: transform, opacity;
      }
      .value {
        font-weight: 700;
        font-size: 112px;
        line-height: 1;
        color: var(--ink);
        letter-spacing: -0.02em;
        white-space: nowrap;                /* stats are short; keeps the count on one line */
        font-variant-numeric: tabular-nums; /* digits don't jitter width while counting */
        padding-bottom: 6px;                /* clear the descender off the accent rule */
      }
      .accent-bar {
        display: block;                     /* transformed elements must be block + sized */
        width: 156px;
        height: 9px;
        border-radius: 5px;
        background: var(--accent);
        transform-origin: center;
      }
      .label {
        font-weight: 700;
        font-size: 40px;
        line-height: 1.1;
        letter-spacing: 0.01em;
        color: var(--accent);
        text-align: center;
        max-width: var(--safe-width);
      }
      /* MODULE slots (mono caps, wide tracking — study layout system). */
      .eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 26px; line-height: 1;
        letter-spacing: 4px; text-transform: uppercase;
        color: var(--ink-soft);
        will-change: opacity;
      }
      .eyebrow .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--eyebrow-dot, var(--accent));
        flex: 0 0 auto;
      }
      .evidence {
        font-family: var(--eyebrow-font);
        font-weight: 500; font-size: 21px; line-height: 1;
        letter-spacing: 3px; text-transform: uppercase;
        color: var(--ink-soft);
        will-change: opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="stat-root"
      data-composition-id="stat-card"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="3"
    >
      <div class="stage">
        <div
          id="stat-card-el"
          class="card clip"
          data-start="0"
          data-duration="60"
          data-track-index="1"
        >
          <div id="stat-eyebrow" class="eyebrow"><span class="dot"></span><span id="stat-eyebrow-text"></span></div>
          <div id="stat-value" class="value">10+ years</div>
          <div id="stat-accent" class="accent-bar"></div>
          <div id="stat-label" class="label">in software</div>
          <div id="stat-evidence" class="evidence"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("stat-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 3;

        // Declared defaults double as the no-framework fallback.
        const defaults = { value: "10+ years", label: "in software", count_up: true,
                           accent: "#054BC9", build: "pop", eyebrow: "",
                           evidenceSource: "", evidenceDate: "" };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        const valueEl = document.getElementById("stat-value");
        const labelEl = document.getElementById("stat-label");
        labelEl.textContent = vars.label;
        document.documentElement.style.setProperty("--accent", vars.accent);

        // MODULE slots — empty defaults REMOVE the nodes (no stray flex
        // gaps: the classic card layout stays byte-identical without them).
        const ebText = (vars.eyebrow == null ? "" : String(vars.eyebrow)).trim();
        const ebEl = document.getElementById("stat-eyebrow");
        if (ebText) document.getElementById("stat-eyebrow-text").textContent = ebText;
        else ebEl.remove();
        const evSource = (vars.evidenceSource == null ? "" : String(vars.evidenceSource)).trim();
        const evDate = (vars.evidenceDate == null ? "" : String(vars.evidenceDate)).trim();
        const evEl = document.getElementById("stat-evidence");
        if (evSource) evEl.textContent = ["CLAIM SOURCE", evSource, evDate].filter(Boolean).join(" ");
        else evEl.remove();

        // Parse the first run of digits (with thousands commas) out of the value.
        function parseNumber(str) {
          const m = String(str).match(/\d[\d,]*/);
          if (!m) return null;
          const raw = m[0];
          const digits = raw.replace(/,/g, "");
          return {
            prefix: String(str).slice(0, m.index),
            suffix: String(str).slice(m.index + raw.length),
            target: parseInt(digits, 10),
            hadComma: raw.indexOf(",") !== -1,
          };
        }
        function fmt(n, hadComma) {
          return hadComma || n >= 1000 ? n.toLocaleString("en-US") : String(n);
        }

        const parsed = vars.count_up ? parseNumber(vars.value) : null;
        // Resting DOM state = the final value (correct even if a seek never fires onUpdate).
        valueEl.textContent = vars.value;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const M = window.__motionTokens;
        const skeleton = String(vars.build) === "skeleton-first";
        // Content start: 0 in the pop build; in the skeleton-first build the
        // shell lands first (rank 2), the eyebrow leads content (rank 3).
        let contentAt = 0;

        if (skeleton) {
          // MODULE rank 2: shell opacity-ramps at 0; first content +0.35s.
          contentAt = M.SKELETON_GAP_S;
          const firstContent = ebText ? ebEl : valueEl;
          M.skeletonFirst(tl, "#stat-card-el", firstContent, { at: 0 });
          if (ebText) contentAt += M.EYEBROW_LEAD_S;   // eyebrow-first lead
          if (firstContent !== valueEl) M.textRamp(tl, valueEl, contentAt);
          M.textRamp(tl, "#stat-accent", contentAt);
          M.textRamp(tl, labelEl, contentAt);
        } else {
          // Card pop-in + subtle settle (back.out overshoot IS the settle).
          tl.fromTo(
            "#stat-card-el",
            { scale: 0.86, opacity: 0, y: 20 },
            { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" },
            0
          );
          // Accent bar draws out from center.
          tl.fromTo("#stat-accent", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: "power2.out" }, 0.16);
        }

        // Count-up (seek-safe: onUpdate is a pure function of tween progress).
        const countDur = Math.max(0.4, Math.min(1.05, D - 0.5));
        if (parsed) {
          const proxy = { n: 0 };
          tl.fromTo(
            proxy,
            { n: 0 },
            {
              n: parsed.target,
              duration: countDur,
              ease: "power2.out",
              onUpdate: function () {
                valueEl.textContent = parsed.prefix + fmt(Math.round(proxy.n), parsed.hadComma) + parsed.suffix;
              },
            },
            contentAt
          );
        }

        // Evidence ribbon lands LAST in the build (MODULE rank 9).
        if (evSource) {
          M.textRamp(tl, evEl,
            Math.min(contentAt + countDur + M.EYEBROW_LEAD_S, D - 0.6));
        }

        // Fade-out — ends exactly at D so the timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.2);
        tl.to(
          "#stat-card-el",
          { opacity: 0, scale: 0.97, y: -14, duration: fadeDur, ease: "power2.in" },
          D - fadeDur
        );

        tl.seek(0);
        window.__timelines["stat-card"] = tl;
      })();
    </script>
  </body>
</html>
