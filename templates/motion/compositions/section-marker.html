<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"num","type":"string","label":"Eyebrow / section label — appears FIRST (e.g. 1 or System No.2)","default":"System No.1"},
    {"id":"line1","type":"string","label":"Title — serif-accent, wipes in (<= 2 words)","default":"Familiarity"},
    {"id":"line2","type":"string","label":"Qualifier — white sans, optional (<= 2 words)","default":"Rule"},
    {"id":"side","type":"enum","label":"Anchor side (the emptier side, opposite the subject)","default":"left","options":[{"value":"left","label":"Top-left"},{"value":"right","label":"Top-right"}]},
    {"id":"accent","type":"color","label":"Accent color (serif title)","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: SECTION-MARKER (REBUILT for R9/R10 — deep-pass
    correction, REFERENCE_STYLE_STUDY "Template corrections queued" #1).
    Trigger it serves: numbered section markers (R7) — a small eyebrow, a
    serif-accent name, an optional qualifier, pinned in the HEADROOM on the EMPTY
    SIDE while a section is discussed. Distinct from `stinger-wipe` (full-frame
    opaque chapter takeover): this is a small alpha overlay over the live head.
    Transparent 1080x1920 overlay -> render with `--format mov` (ProRes 4444).

    WHY THE REBUILD: the previous version was CENTERED and NUMERAL-LED (a big serif
    numeral dropped in first, label under it). The reference exemplars anchor
    TOP-LEFT / the emptier side (R10 placement law) and build EYEBROW-FIRST (R9):
    small eyebrow appears -> serif-accent title WIPES in below -> qualifier settles.
    Var IDS are UNCHANGED (num/line1/line2/accent) so existing plans/render specs
    keep working; `side` is added. The ROLES shift per R9 (num is now the small
    eyebrow, line1 is now the serif title) — old sample vars render faithfully as
    "<eyebrow> / <serif title> / <qualifier>", which is the R9-correct layout.

    CONTRACT for the PRODUCER compositing stage:
      - num (eyebrow) / line1 (title) / line2 (qualifier, empty = omit) / side /
        accent are `data-composition-variables`. side picks the emptier side; the
        PRODUCER passes the side OPPOSITE the measured subject (free_space / R10).
      - R2 two-tone: the TITLE is serif-italic (var --font-serif-accent) in the
        accent color; eyebrow + qualifier are white sans. Entrance ~100-170ms wipes
        (R9), never a pop-from-nothing.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (see stat-card note);
        ~2.5s convention. It builds in, holds, fades out at D.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · section-marker</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #marker-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* HEADROOM, side-anchored (R10). JS sets left/right + alignment from `side`. */
      .stage {
        position: absolute;
        top: 250px;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      /* CONTRAST GUARANTEE: a soft feathered scrim behind the headroom text so it
         reads on ANY footage (the blue-serif-on-blue-wall failure). Darkens the
         backing → light title/eyebrow always separate; feathers to 0 so it never
         reads as a hard panel. Kept subtle (R10 clean-overlay doctrine). */
      .stage::before {
        content: "";
        position: absolute;
        inset: -34px -64px;
        background: radial-gradient(120% 120% at 50% 45%,
          rgba(8, 12, 24, 0.54), rgba(8, 12, 24, 0.30) 55%, rgba(8, 12, 24, 0) 82%);
        filter: blur(7px);
        z-index: -1;
        pointer-events: none;
      }
      .eyebrow {
        font-weight: 700;
        font-size: 38px;
        line-height: 1;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #FFFFFF;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.5);
        will-change: transform, opacity;
      }
      /* Title wipes in behind an overflow-hidden clip. */
      .title-clip { overflow: hidden; padding: 6px 0; max-width: 100%; }
      .title {
        display: inline-block;
        font-family: var(--font-serif-accent);
        font-style: italic;
        font-weight: 700;
        font-size: 118px;
        line-height: 0.98;
        letter-spacing: -0.01em;
        color: var(--accent);
        white-space: nowrap;
        text-shadow: 0 6px 26px rgba(0, 0, 0, 0.4);
        will-change: transform;
      }
      .qualifier {
        font-weight: 700;
        font-size: 52px;
        line-height: 1.02;
        letter-spacing: -0.01em;
        color: #FFFFFF;
        white-space: nowrap;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="marker-root"
      data-composition-id="section-marker"
      data-width="1080"
      data-height="1920"
      data-duration="2.5"
    >
      <div id="marker-stage" class="stage">
        <div
          id="marker-el"
          class="clip"
          data-start="0"
          data-duration="60"
          data-track-index="1"
          style="display:flex;flex-direction:column;gap:14px;"
        >
          <div id="marker-eyebrow" class="eyebrow">System No.1</div>
          <div class="title-clip"><span id="marker-title" class="title">Familiarity</span></div>
          <div id="marker-qualifier" class="qualifier">Rule</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("marker-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 2.5;

        const defaults = { num: "System No.1", line1: "Familiarity", line2: "Rule", side: "left", accent: "#054BC9" };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        // num -> eyebrow, line1 -> title, line2 -> qualifier (ids kept for compat).
        document.getElementById("marker-eyebrow").textContent = String(vars.num);
        const titleEl = document.getElementById("marker-title");
        const line1 = String(vars.line1);
        titleEl.textContent = line1;
        // Auto-fit the serif title to the headroom width. A long 2-word title
        // ("Batch Recording") at the base 118px + nowrap overruns the frame edge.
        // Estimate width from char count (DETERMINISTIC — headless renders can't
        // rely on getBoundingClientRect before the serif font loads): if the
        // estimate exceeds FIT_W, shrink the font to fit; short titles stay full.
        const FIT_W = 780, BASE_PX = 118, CH_RATIO = 0.56;
        const estW = (line1.length || 1) * CH_RATIO * BASE_PX;
        if (estW > FIT_W) {
          titleEl.style.fontSize = Math.max(60, BASE_PX * (FIT_W / estW)).toFixed(1) + "px";
        }
        const qualEl = document.getElementById("marker-qualifier");
        const qual = String(vars.line2 == null ? "" : vars.line2).trim();
        if (qual) { qualEl.textContent = qual; } else { qualEl.remove(); }

        // Side anchor (R10): left/right + text alignment; wipe direction follows.
        const right = String(vars.side) === "right";
        const stage = document.getElementById("marker-stage");
        if (right) {
          stage.style.right = "64px";
          stage.style.alignItems = "flex-end";
          stage.style.textAlign = "right";
        } else {
          stage.style.left = "64px";
          stage.style.alignItems = "flex-start";
          stage.style.textAlign = "left";
        }
        const wipeFrom = right ? 108 : -108;   // xPercent — wipe in from the anchor side

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // R9 build order: eyebrow first, serif title WIPES in, qualifier settles.
        tl.fromTo("#marker-eyebrow", { opacity: 0, y: -12 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0);
        tl.fromTo("#marker-title", { xPercent: wipeFrom, opacity: 0 },
          { xPercent: 0, opacity: 1, duration: 0.44, ease: "power3.out" }, 0.14);
        if (qual) {
          tl.fromTo("#marker-qualifier", { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 0.3);
        }

        // Finish on the final sampled 30fps frame, not at the unsampled t=D
        // endpoint. Otherwise the encoded tail retains part of the scrim and
        // the compositor cuts it off at the next shot.
        const RENDER_FPS = 30;
        const fadeDur = Math.min(0.42, D * 0.18);
        const fadeEnd = Math.max(0, D - (1 / RENDER_FPS));
        const fadeStart = Math.max(0, fadeEnd - fadeDur);
        // Fade the stage, not only marker-el: the contrast scrim is a stage
        // pseudo-element and otherwise survives until a hard window cutoff.
        tl.to("#marker-stage", {
          opacity: 0, y: -14, duration: fadeEnd - fadeStart, ease: "power2.in"
        }, fadeStart);

        tl.seek(0);
        window.__timelines["section-marker"] = tl;
      })();
    </script>
  </body>
</html>
