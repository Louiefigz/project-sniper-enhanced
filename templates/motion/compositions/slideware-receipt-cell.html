  lang="en"
  data-composition-variables='[

    {"id":"at5","type":"number","label":"Cell 5 pop (s)","default":1.6,"min":0,"max":30,"step":0.05,"unit":"s"},

>
  <!--
    PROJECT SNIPER · Motion template: SLIDEWARE-RECEIPT-CELL (short-form slide set, 3 of 4)
    Proof cells: small 9:16 media thumbnails, each with an optional label
    tab above and an optional view count below, so a claim ("it worked")
    is backed by the clips themselves. Layouts: a 1x4 strip in the
    headroom, a 2x3 grid, or one large showcase cell.
    Transparent 1080x1920 overlay -> render `--format mov` (ProRes 4444).

    SNIPER DESIGN (the short-form slide set — same ink tabs, amber marker
    and corners as slideware-takeover-deck / -staircase-lockup /
    -caption-dual-mode):
      - Label tab = --eyebrow-font (IBM Plex Mono 600) caps, white on an ink
        tab (rgba(19,23,32,0.88), 4px corners) led by a square --lemon
        marker; wraps to at most 2 lines.
      - Media slot = 9:16, 6px corners, 1px light hairline and a soft shadow
        over footage; "square" corners (2px, no shadow) sit flush inside a
        slide takeover. Empty slots show a deterministic graphite placeholder
        tinted from the Sniper palette.
      - View count = --lemon eye glyph + Plex Mono 600 white count on an ink
        tab, flush with the cell's left edge.
      - Contrast holds over any footage: white on the ink tab over pure
        white footage 12.67:1; the amber marker/glyph there 6.58:1 (9.31:1 on
        solid ink).
      - Cell widths (Sniper design parameters): strip 162px (~0.15W — four
        cells plus gaps fit the 760px headroom band), grid 173px (~0.16W —
        three per 600px row), showcase 454px (~0.42W — one clip large enough
        to read its content).

    CONTRACT for the PRODUCER compositing stage:
      - A cell exists when viewsN OR labelN OR mediaN is set. mediaN is a
        web-root path under templates/motion/ (image or video file). VIDEO-IN-
        CELL: a video src becomes a muted `class="clip"` <video> so the
        framework owns playback (a receipt is a playing clip, not a still);
        a known infra dependency. With no media the cell renders a
        deterministic placeholder thumb.
      - ANIMATION: per-cell 0-FRAME POPS word-locked to atN (strip default
        0.35s L->R; tighten to ~0.1s for a fast alternating build), or
        set every atN to 0 to arrive fully-built ON a cut.
      - EXITS: instant / ON-cut — the comp holds to D; compositor owns seams.
      - corner: "rounded" = 6px + shadow over footage; "square" = 2px
        corners for use inside slide takeovers.
      - EMPTY-DEFAULTS LAW (G21): labels/views/media default EMPTY — unset
        renders NOTHING; the sample strip activates only when ALL are unset.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · slideware-receipt-cell</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;           /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #arc-root { position: relative; width: 1080px; height: 1920px; }

      /* .stage OWNS the centering; per-layout top + flex-wrap width below. */
      #arc-stage {
        position: absolute;
        left: 540px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      #arc-root.strip    #arc-stage { top: 300px;  width: 760px;  gap: 18px; }   /* headroom y0.14-0.35 */
      #arc-root.grid     #arc-stage { top: 560px;  width: 600px;  gap: 22px 20px; }
      #arc-root.showcase #arc-stage { top: 480px;  width: 480px;  gap: 0; }

      .arc-cell {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: opacity;
      }
      /* Label tab ABOVE the thumb: mono caps + square amber marker. */
      .arc-label {
        background: rgba(19, 23, 32, 0.88);
        border-radius: 4px;
        /* Bottom inset is a transparent border, not padding: the clamp's
           overflow clip stops at the padding edge, so a clamped third line
           can never peek out under the second. */
        padding: 6px 10px 0;
        border-bottom: 7px solid transparent;
        margin-bottom: 8px;
        max-width: 100%;
        font-family: var(--eyebrow-font);
        font-size: 19px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #FFFFFF;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .arc-label::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 0 8px 2px 0;
        border-radius: 2px;
        background: var(--lemon);
        vertical-align: middle;
      }
      /* 9:16 media slot. rounded = over footage; square = inside takeovers. */
      .arc-media {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        border-radius: 6px;
        border: 1px solid rgba(241, 244, 246, 0.18);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        background: var(--module-canvas);
      }
      #arc-root.square-corners .arc-media { border-radius: 2px; box-shadow: none; }
      .arc-media img, .arc-media video {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      /* Deterministic placeholder thumb (no media path given). */
      .arc-ph { position: absolute; inset: 0; }
      .arc-ph::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
      }
      /* View count BELOW its thumb, flush with the cell's left edge. */
      .arc-views {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        background: rgba(19, 23, 32, 0.88);
        border-radius: 4px;
        padding: 6px 12px 6px 10px;
      }
      .arc-views svg { width: 24px; height: 24px; display: block; }
      .arc-views svg path { fill: var(--lemon); }
      .arc-views span {
        font-family: var(--eyebrow-font);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #FFFFFF;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="arc-root"
      data-composition-id="slideware-receipt-cell"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="3"
    >
      <div id="arc-stage" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("arc-root");
        const D = parseFloat(root.dataset.duration) || 3;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          layout: "strip", corner: "rounded",
          label1: "", label2: "", label3: "", label4: "", label5: "", label6: "",
          views1: "", views2: "", views3: "", views4: "", views5: "", views6: "",
          media1: "", media2: "", media3: "", media4: "", media5: "", media6: "",
          at1: 0.2, at2: 0.55, at3: 0.9, at4: 1.25, at5: 1.6, at6: 1.95,
        };
        // PREVIEW-ONLY sample strip, original Sniper copy (activates only
        // when ALL content is unset).
        const SAMPLE = {
          label1: "Rough cut", label2: "Tight cut", label3: "Captioned", label4: "Final",
          views1: "3.1K", views2: "9.8K", views3: "24K", views4: "61K",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = [];
        for (let i = 1; i <= 6; i++) contentKeys.push("label" + i, "views" + i, "media" + i);
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        const layout = ["strip", "grid", "showcase"].indexOf(String(vars.layout)) >= 0
          ? String(vars.layout) : "strip";
        root.classList.add(layout);
        if (String(vars.corner) === "square") root.classList.add("square-corners");
        // Cell width by layout (Sniper design parameters — see header) and
        // the cell cap per layout.
        const CELL_W = { strip: 162, grid: 173, showcase: 454 }[layout];
        const MAX_CELLS = { strip: 4, grid: 6, showcase: 1 }[layout];

        // Deterministic placeholder tints from the Sniper palette (graphite
        // with process-blue / result-amber / compare-gray casts; no
        // Math.random — fixed per index).
        const PH = [
          "linear-gradient(160deg, #26334D 0%, #121721 100%)",
          "linear-gradient(160deg, #3D3020 0%, #15171C 100%)",
          "linear-gradient(160deg, #353A44 0%, #14171D 100%)",
          "linear-gradient(160deg, #1E3860 0%, #101521 100%)",
          "linear-gradient(160deg, #45341C 0%, #17150F 100%)",
          "linear-gradient(160deg, #2C3140 0%, #121721 100%)",
        ];
        const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
        const VIDEO_EXT = /\.(mp4|mov|webm|m4v)$/i;

        const stage = document.getElementById("arc-stage");
        const str = function (v) { return (v == null ? "" : String(v)).trim(); };
        const cells = [];
        let trackIdx = 2;
        for (let i = 1; i <= MAX_CELLS; i++) {
          const label = str(vars["label" + i]);
          const views = str(vars["views" + i]);
          const media = str(vars["media" + i]);
          if (!label && !views && !media) continue;   // unset cell renders NOTHING

          const cell = document.createElement("div");
          cell.className = "arc-cell";
          cell.style.width = CELL_W + "px";
          if (label) {
            const chip = document.createElement("div");
            chip.className = "arc-label";
            chip.textContent = label;
            cell.appendChild(chip);
          }
          const slot = document.createElement("div");
          slot.className = "arc-media";
          if (media && VIDEO_EXT.test(media)) {
            // VIDEO-IN-CELL: framework-owned playback (muted clip element).
            const v = document.createElement("video");
            v.muted = true;
            v.setAttribute("muted", "");
            v.setAttribute("playsinline", "");
            v.className = "clip";
            v.setAttribute("data-start", "0");
            v.setAttribute("data-duration", "60");
            v.setAttribute("data-track-index", String(trackIdx++));
            v.src = media;
            slot.appendChild(v);
          } else if (media) {
            const img = document.createElement("img");
            img.alt = "";
            img.src = media;
            slot.appendChild(img);
          } else {
            const ph = document.createElement("div");
            ph.className = "arc-ph";
            ph.style.background = PH[(i - 1) % PH.length];
            slot.appendChild(ph);
          }
          cell.appendChild(slot);
          if (views) {
            const chip = document.createElement("div");
            chip.className = "arc-views";
            chip.innerHTML = EYE + "<span></span>";
            chip.querySelector("span").textContent = views;
            cell.appendChild(chip);
          }
          stage.appendChild(cell);
          const at = isFinite(Number(vars["at" + i])) ? Number(vars["at" + i]) : 0;
          cells.push({ el: cell, at: Math.max(0, Math.min(at, Math.max(0, D - 0.05))) });
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Per-cell 0-FRAME POPS word-locked to atN — no fades, no slides.
        cells.forEach(function (c) {
          if (c.at <= 0) return;           // atN 0 = fully built ON the cut
          tl.set(c.el, { autoAlpha: 0 }, 0);
          tl.set(c.el, { autoAlpha: 1 }, c.at);
        });

        // Keep the paused timeline non-empty for an all-on-the-cut build.
        tl.set({}, {}, Math.max(0, D - 0.01));

        // No self exit — instant clear ON the compositor's cut (window end).
        tl.seek(0);
        window.__timelines["slideware-receipt-cell"] = tl;
      })();
    </script>
  </body>
</html>
