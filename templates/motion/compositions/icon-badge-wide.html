<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"icon1","type":"string","label":"Badge 1 icon (file under /icons)","default":"openai"},
    {"id":"icon2","type":"string","label":"Badge 2 icon (empty = omit)","default":"claude"},
    {"id":"icon3","type":"string","label":"Badge 3 icon (empty = omit)","default":"gemini"},
    {"id":"x1","type":"number","label":"Badge 1 center X (px, 1920 canvas)","default":421,"min":0,"max":1920,"step":1},
    {"id":"y1","type":"number","label":"Badge 1 center Y (px, 1080 canvas)","default":402,"min":0,"max":1080,"step":1},
    {"id":"x2","type":"number","label":"Badge 2 center X","default":958,"min":0,"max":1920,"step":1},
    {"id":"y2","type":"number","label":"Badge 2 center Y","default":143,"min":0,"max":1080,"step":1},
    {"id":"x3","type":"number","label":"Badge 3 center X","default":1497,"min":0,"max":1920,"step":1},
    {"id":"y3","type":"number","label":"Badge 3 center Y","default":402,"min":0,"max":1080,"step":1},
    {"id":"at1","type":"number","label":"Badge 1 land time (s)","default":0.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Badge 2 land time (s)","default":0.55,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Badge 3 land time (s)","default":0.9,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"size","type":"number","label":"Badge tile size (px)","default":168,"min":90,"max":280,"step":2,"unit":"px"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: ICON-BADGE-WIDE (16:9 talking-head longform)
    The LANDSCAPE sibling of icon-badge (9:16). Reference: the pro's intro tool
    montage (AG_PLACE.png t=8/10, ICON_PLACE.png) — big recognizable brand marks
    placed in the GAP beside/above the speaker's head, NOT crammed in a corner:
    one to the LEFT, one ABOVE, one to the RIGHT, level and energetic.

    Why this comp exists: icon-badge is portrait-only and anchors to the 9:16
    reframe constant --visual-center-x (495px). On a 1920x1080 longform frame that
    lands the row at ~26% from the left (a corner). This comp instead takes the
    per-badge CENTER positions (x1,y1 .. x3,y3) as variables — PRODUCER computes
    them from the speaker's faceBBoxNorm (left gap / above head / right gap,
    centered in each gap at head height) — so placement is subject-relative and
    the compositor overlays at (0,0) with NO face-anchor offset math.

    CONTRACT for the PRODUCER compositing stage:
      - Transparent 1920x1080 overlay -> render `--format mov` (ProRes 4444, alpha).
        anchor is NOT face-relative (positions are baked in-comp); compositor
        overlays at 0,0.
      - iconN (filename under /icons, .svg optional), xN/yN (badge CENTER px on the
        1920x1080 canvas), atN (spoken-word land time rel. to outStart), size (tile
        px). Empty iconN OMITS that badge — the others keep their absolute spots.
      - Entrance: a quick ~160ms pop that lands on atN from a visible scale (R9,
        never from nothing), with the badge's own soft glow lifting it off video.
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render rewrites
        it per window; --variables never sets it). Hold comfortably past last atN.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · icon-badge-wide</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #badge-root { position: relative; width: 1920px; height: 1080px; }

      /* Each badge is absolutely positioned at its CENTER (JS sets left/top from
         xN/yN); translate(-50%,-50%) centers the tile on that point. GSAP animates
         only transforms/opacity on the INNER wrap so the centering stays intact. */
      .badge {
        position: absolute;
        transform: translate(-50%, -50%);
        will-change: transform, opacity;
      }
      /* Rounded app-icon tile — bare recognizable mark, generous glow so it lifts
         off the footage (the pro marks all carry a soft halo). */
      .badge-inner {
        width: 100%;
        height: 100%;
        border-radius: 24%;
        background: rgba(255, 255, 255, 0.96);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 18px 48px rgba(0, 0, 0, 0.34),
          0 0 42px rgba(255, 255, 255, 0.16),
          inset 0 2px 0 rgba(255, 255, 255, 0.9);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      .badge-mark {
        width: 62%;
        height: 62%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="badge-root"
      data-composition-id="icon-badge-wide"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="3"
    >
      <div id="badge-1" class="badge clip" data-start="0" data-duration="60" data-track-index="1">
        <div class="badge-inner"></div>
      </div>
      <div id="badge-2" class="badge clip" data-start="0" data-duration="60" data-track-index="2">
        <div class="badge-inner"></div>
      </div>
      <div id="badge-3" class="badge clip" data-start="0" data-duration="60" data-track-index="3">
        <div class="badge-inner"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("badge-root");
        const D = parseFloat(root.dataset.duration) || 3;

        const defaults = {
          icon1: "openai", icon2: "claude", icon3: "gemini",
          x1: 421, y1: 402, x2: 958, y2: 143, x3: 1497, y3: 402,
          at1: 0.2, at2: 0.55, at3: 0.9, size: 168,
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        const size = Math.max(60, Number(vars.size) || 168);
        const items = [
          { icon: vars.icon1, x: Number(vars.x1), y: Number(vars.y1), at: Number(vars.at1) },
          { icon: vars.icon2, x: Number(vars.x2), y: Number(vars.y2), at: Number(vars.at2) },
          { icon: vars.icon3, x: Number(vars.x3), y: Number(vars.y3), at: Number(vars.at3) },
        ];

        // Resolve an iconN var to a rooted /icons src (.svg optional).
        function iconSrc(raw) {
          const v = (raw == null ? "" : String(raw)).trim();
          if (!v) return "";
          if (v.charAt(0) === "/") return v;
          return "/icons/" + (v.indexOf(".") >= 0 ? v : v + ".svg");
        }

        const badges = Array.prototype.slice.call(document.querySelectorAll(".badge"));
        const active = [];
        badges.forEach(function (badge, i) {
          const it = items[i];
          const src = iconSrc(it.icon);
          if (!src || !isFinite(it.x) || !isFinite(it.y)) { badge.remove(); return; }
          badge.style.width = size + "px";
          badge.style.height = size + "px";
          badge.style.left = it.x + "px";
          badge.style.top = it.y + "px";
          const img = document.createElement("img");
          img.className = "badge-mark";
          img.setAttribute("alt", "");
          img.src = src;
          badge.querySelector(".badge-inner").appendChild(img);
          active.push({ badge: badge, at: isFinite(it.at) ? it.at : 0.2 });
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // R9 entrance: a ~160ms pop STARTING from a visible scale (0.7), never from
        // nothing; each badge lands on its spoken-word time (atN). back.out settles.
        active.forEach(function (a) {
          tl.set(a.badge, { opacity: 0, y: 18, scale: 0.7 }, 0);
          const at = Math.max(0, Math.min(a.at, D - 0.4));
          tl.to(a.badge, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2.4)" }, at);
        });

        // Fade the whole set out — ends exactly at D so timeline length == render.
        const fadeDur = Math.min(0.42, D * 0.18);
        active.forEach(function (a) {
          tl.to(a.badge, { opacity: 0, y: -14, duration: fadeDur, ease: "power2.in" }, D - fadeDur);
        });

        tl.seek(0);
        window.__timelines["icon-badge-wide"] = tl;
      })();
    </script>
  </body>
</html>
