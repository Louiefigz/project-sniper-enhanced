<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"avatarSrc","type":"string","label":"Avatar image path under the motion web root (e.g. /assets/face.png; empty = initials circle)","default":""},
    {"id":"initials","type":"string","label":"Initials for the neutral circle when no avatar image","default":""},
    {"id":"line1","type":"string","label":"Accent credential line (builds word-by-word)","default":""},
    {"id":"line2","type":"string","label":"White block line (lands after the recompose)","default":""},
    {"id":"at1","type":"number","label":"Avatar + line 1 build time (s)","default":0.15,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Recompose + line 2 time (s)","default":3,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Line 2 payoff time (s)","default":4.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"accentColor","type":"color","label":"Accent color (line 1 + avatar ring)","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: AVATAR-BIO-CARD (16:9 talking-head longform)
    Reference: study pair 2 bio-card takeover (avatarbio_26 burst + sheet_02-03,
    t26.5-31.5): a dark navy full-frame takeover — a circular avatar pops in
    left-of-center, an accent "credential" line builds WORD-BY-WORD to its right
    with a thin white arc swooshing under it; then the composition RECOMPOSES:
    the avatar translates up-right (smaller), line 1 rides to the top-right, a
    new arc draws under the avatar's new seat, and a white block line 2 lands
    where the avatar was. The reference's purple accent is recolored to the
    brand accent; the STRUCTURE is preserved.

    CONTRACT for the PRODUCER compositing stage:
      - anchor "own-screen" -> render `--format mp4` (opaque takeover). The navy
        base is OPAQUE from frame 0; no self out-transition — the compositor
        owns both seams.
      - avatarSrc / initials / line1 / line2 / at2 / accentColor are
        `data-composition-variables`. avatarSrc is an image path served under
        the motion web root (e.g. "/assets/face.png"); when it is EMPTY (or the
        file fails to load — alt="" renders nothing) the neutral INITIALS circle
        underneath shows instead. Empty line1/line2 simply never appear.
        at2 = transcript time of the recompose beat (line 2's spoken landing),
        relative to the overlay's outStart; line 1's word build auto-compresses
        to finish before it.
      - UNSET everything renders the PREVIEW SAMPLE only (glass-rail G21
        pattern): demo content activates when avatarSrc AND initials AND
        line1 AND line2 are ALL unset; any plan that sets one field gets
        exactly its fields — no sample leak.
      - Grammar (burst-measured): avatar pops ~450ms at 0.1s; line-1 words land
        ~130ms apart (R18 kinetic-text cadence); arc 1 draws ~500ms under the
        line; at at2 the whole composition recomposes over ~600ms, arc 1
        un-draws while arc 2 draws under the avatar's new seat, and line 2
        fades+rises ~300ms as the recompose settles.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it). Make it comfortably
        past at2 (+~1.5s of settle).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · avatar-bio-card</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070d19;             /* opaque — this comp owns the whole frame */
        font-family: var(--font);
      }
      #abc-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Full-bleed navy on a CHILD (never the root) — the producer's frame
         compositing can drop the root's own background (frame renders black). */
      #abc-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(1200px 800px at 24% 16%, rgba(16, 26, 48, 0.9) 0%, rgba(16, 26, 48, 0) 62%),
          radial-gradient(1300px 900px at 82% 78%, rgba(10, 20, 40, 0.85) 0%, rgba(10, 20, 40, 0) 65%),
          #070d19;
      }

      /* Avatar group — a sized block so GSAP transforms are legal. Center rests
         at (768, 600); the recompose translates it up-right and shrinks it. */
      #abc-avatar-g {
        position: absolute;
        left: 558px; top: 390px;
        width: 420px; height: 420px;
        will-change: transform, opacity;
      }
      #abc-ring {
        position: absolute; inset: -22px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.22);
      }
      #abc-initials {
        position: absolute; inset: 0;
        border-radius: 50%;
        background: linear-gradient(148deg, #16223a 0%, #0d1626 100%);
        border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eef2fa;
        font-weight: 800;
        font-size: 150px;
        letter-spacing: 4px;
      }
      #abc-avatar-img {
        position: absolute; inset: 0;
        width: 420px; height: 420px;
        border-radius: 50%;
        object-fit: cover;
      }

      /* Line 1 — accent kinetic credential line right of the avatar. */
      #abc-line1-g {
        position: absolute;
        left: 960px; top: 330px;
        width: 700px;
        text-align: center;
        color: var(--accent);
        font-weight: 800;
        font-size: 58px;
        line-height: 1.18;
        letter-spacing: -0.01em;
        text-shadow: 0 0 28px color-mix(in srgb, var(--accent) 45%, transparent);
        will-change: transform, opacity;
      }
      .abc-w { display: inline-block; will-change: transform, opacity; }

      /* Arcs — thin white swooshes (drawn via dashoffset). */
      #abc-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .abc-arc {
        fill: none;
        stroke: rgba(255, 255, 255, 0.88);
        stroke-width: 5px;
        stroke-linecap: round;
        will-change: stroke-dashoffset;
      }

      /* Line 2 — white block statement, lands where the avatar was. */
      #abc-line2 {
        position: absolute;
        left: 120px; top: 520px;
        width: 820px;
        text-align: left;
        color: #f4f7fd;
        font-weight: 800;
        font-size: 48px;
        line-height: 1.18;
        letter-spacing: -0.005em;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="abc-root"
      data-composition-id="avatar-bio-card"
      data-width="1920"
      data-height="1080"
      data-duration="6.5"
    >
      <div id="abc-bg"></div>
      <svg id="abc-svg" class="clip" viewBox="0 0 1920 1080" preserveAspectRatio="none"
           data-start="0" data-duration="60" data-track-index="1"></svg>
      <div id="abc-avatar-g" class="clip" data-start="0" data-duration="60" data-track-index="2">
        <div id="abc-ring"></div>
        <div id="abc-initials"></div>
      </div>
      <div id="abc-line1-g" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
      <div id="abc-line2" class="clip" data-start="0" data-duration="60" data-track-index="4"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("abc-root");
        const D = parseFloat(root.dataset.duration) || 6.5;

        // All content defaults are EMPTY (G21 empty-defaults law).
        const defaults = {
          avatarSrc: "", initials: "", line1: "", line2: "",
          at1: 0.15, at2: 3, at3: 4.2, accentColor: "#054BC9",
        };
        // PREVIEW-ONLY demo content (the reference bio beat). Activates ONLY
        // when avatarSrc AND initials AND line1 AND line2 are ALL unset.
        const SAMPLE = {
          initials: "PS",
          line1: "A decade building production software",
          line2: "Using AI to build reliable content systems",
          at2: 3,
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["avatarSrc", "initials", "line1", "line2"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--accent", vars.accentColor);

        const txt = function (v) { return (v == null ? "" : String(v)).trim(); };
        const avatarSrc = txt(vars.avatarSrc);
        const initials = txt(vars.initials);
        const line1 = txt(vars.line1);
        const line2 = txt(vars.line2);
        const at1 = Math.max(0, Math.min(Number(vars.at1) || 0.15, D - 1.2));
        const at2 = Math.max(1.2, Math.min(Number(vars.at2) || 3, D - 1.2));
        const at3 = Math.max(at2 + 0.35,
          Math.min(Number(vars.at3) || at2 + 0.4, D - 0.4));

        // Avatar: initials circle is ALWAYS underneath; a set avatarSrc stacks a
        // cover img over it (alt="" -> a failed load renders nothing, so the
        // neutral initials circle shows — no broken-image glyph).
        document.getElementById("abc-initials").textContent = initials;
        if (avatarSrc) {
          const img = document.createElement("img");
          img.id = "abc-avatar-img";
          img.src = avatarSrc;
          img.alt = "";
          document.getElementById("abc-avatar-g").appendChild(img);
        }

        // Line 1 word spans (kinetic build).
        const line1El = document.getElementById("abc-line1-g");
        let words = [];
        if (line1) {
          line1.split(/\s+/).forEach(function (w, i) {
            if (i > 0) line1El.appendChild(document.createTextNode(" "));
            const s = document.createElement("span");
            s.className = "abc-w";
            s.textContent = w;
            line1El.appendChild(s);
            words.push(s);
          });
        } else {
          line1El.remove();
        }
        const line2El = document.getElementById("abc-line2");
        if (line2) line2El.textContent = line2;
        else line2El.remove();

        // Arcs. Arc 1 swooshes under line 1 from the avatar's right edge; arc 2
        // sweeps up-right under the avatar's recomposed seat. Resting state =
        // NOT drawn (progressive disclosure).
        const svg = document.getElementById("abc-svg");
        const NS = "http://www.w3.org/2000/svg";
        function buildArc(id, d) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("class", "abc-arc");
          p.setAttribute("id", id);
          p.setAttribute("d", d);
          svg.appendChild(p);
          const L = p.getTotalLength();
          p.style.strokeDasharray = L;
          p.style.strokeDashoffset = L;
          return p;
        }
        const arc1 = buildArc("abc-arc-1", "M 985 680 Q 1170 762 1370 622");
        const arc2 = buildArc("abc-arc-2", "M 660 706 Q 952 772 1128 542");

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Phase 1 — avatar pops, line 1 builds word-by-word, arc 1 swooshes.
        tl.set("#abc-avatar-g", { opacity: 0, scale: 0.82 }, 0);
        tl.to("#abc-avatar-g", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, at1);

        const wordsStart = at1;
        const wordsEnd = Math.max(wordsStart + 0.2, at2 - 0.7);
        if (words.length) {
          const step = Math.min(0.13, (wordsEnd - wordsStart) / words.length);
          words.forEach(function (s, i) {
            tl.set(s, { opacity: 0, y: 14, scale: 0.92 }, 0);
            tl.to(s, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power2.out" },
              wordsStart + i * step);
          });
          tl.to(arc1, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" },
            Math.max(wordsStart + 0.3, wordsEnd - 0.45));
        }

        // Phase 2 — the RECOMPOSE at at2: avatar up-right (smaller), line 1
        // rides to the top-right, arc 1 un-draws while arc 2 draws under the
        // avatar's new seat, and white line 2 lands where the avatar was.
        const MOVE = 0.6;
        tl.to("#abc-avatar-g", { x: 477, y: -140, scale: 0.74, duration: MOVE,
          ease: "power3.inOut", overwrite: "auto" }, at2);
        if (words.length) {
          tl.to(line1El, { y: -255, scale: 0.62, duration: MOVE, ease: "power3.inOut" }, at2);
          tl.to(arc1, { strokeDashoffset: arc1.getTotalLength(), duration: 0.3,
            ease: "power2.in" }, at2);
        }
        tl.to(arc2, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, at2 + 0.25);
        if (line2) {
          tl.set(line2El, { opacity: 0, y: 22 }, 0);
          tl.to(line2El, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, at3);
        }

        // No self fade-out: own-screen takeover holds; the compositor owns both seams.
        tl.seek(0);
        window.__timelines["avatar-bio-card"] = tl;
      })();
    </script>
  </body>
</html>
