<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title pill text (empty = no pill, no connectors)","default":""},
    {"id":"node1","type":"string","label":"Node 1 text (empty = never appears)","default":""},
    {"id":"node2","type":"string","label":"Node 2 text (empty = never appears)","default":""},
    {"id":"node3","type":"string","label":"Node 3 text (empty = never appears)","default":""},
    {"id":"node4","type":"string","label":"Node 4 text (empty = never appears)","default":""},
    {"id":"at1","type":"number","label":"Node 1 land time (s)","default":0.5,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Node 2 land time (s)","default":1.4,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Node 3 land time (s)","default":2.3,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at4","type":"number","label":"Node 4 land time (s)","default":3.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"accent","type":"color","label":"Accent color (pill tint + connectors)","default":"#054BC9"},
    {"id":"handoffText","type":"string","label":"Value-handoff sentence (builds center-frame, then shrinks into the pill; empty = off)","default":""},
    {"id":"handoffAt","type":"number","label":"Handoff time (s) — when the sentence shrinks into the pill","default":1.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"icon1","type":"string","label":"Node 1 icon file in templates/motion/icons/ (e.g. notion.svg; empty = none)","default":""},
    {"id":"icon2","type":"string","label":"Node 2 icon file (empty = none)","default":""},
    {"id":"icon3","type":"string","label":"Node 3 icon file (empty = none)","default":""},
    {"id":"icon4","type":"string","label":"Node 4 icon file (empty = none)","default":""},
    {"id":"panX","type":"number","label":"Total lateral canvas pan across the window (px; 0 = default drift)","default":0,"min":-1200,"max":1200,"step":10,"unit":"px"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: WHITEBOARD-MAP (16:9 talking-head longform)
    Reference: the pro's whiteboard mind-map cutaway (INTRO_MACHINE_VS_PRO_AUDIT
    §2 row 4, §3 "Whiteboard"; REFERENCE_STYLE_STUDY R14) — anonymized frame
    reference/whiteboard-map-reference.png.
    A FULL-FRAME OPAQUE graph-paper world: a center-top title pill, child nodes
    (dark rounded rects, white text) landing per spoken beat, each announced by a
    rounded-elbow connector that DRAWS ON from the pill just before the node lands,
    while the whole canvas drifts laterally. The reference's green is recolored to
    the Project Sniper accent tint; the STRUCTURE is preserved.

    CONTRACT for the PRODUCER compositing stage:
      - anchor "own-screen" -> render `--format mp4` (opaque takeover, R14: the
        frame belongs to the canvas, never both). No self out-transition — the
        compositor (white flash / wash, transitions.py) owns both seams.
      - title / node1..4 / at1..4 / accent are `data-composition-variables`.
        An EMPTY nodeN never appears (its connector too). Empty title = no pill
        and no connectors (nodes still land). atN = transcript time of the spoken
        beat, relative to the overlay's outStart.
      - UNSET everything renders the PREVIEW SAMPLE only (glass-rail G21 pattern):
        the demo content activates when title AND node1..4 are ALL unset; any
        plan that sets one node gets exactly its nodes — no sample leak.
      - Grammar (burst-measured): node fades+rises ~250ms at atN; its connector
        draws ~300ms starting ~200ms before atN; canvas drifts ~1.5% across D;
        un-landed nodes are INVISIBLE (progressive disclosure).
      - Layout auto-balances 1..4 nodes in the reference's staggered
        left/right spread below the pill.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
        Make it comfortably past the last atN.

    PAIR-2 UPGRADES (all OPTIONAL — a v1 variable set renders exactly as v1):
      - handoffText + handoffAt (darkmap value handoff, study2 sheet_11 states
        132-134): the sentence builds WORD-BY-WORD center-frame first, then at
        handoffAt shrinks/rises into the title-pill position, where the pill
        fades in to receive it. Use WITH title set (the pill is what the
        sentence hands into; the plan usually sets title to the same or a
        shortened sentence). Set every atN >= handoffAt + 0.55 — the comp
        clamps node/connector starts to that floor while a handoff is active.
        With title empty the sentence just builds and fades (no pill law holds).
      - iconN (sheet_11 states 137-138, Dropbox gray->color): an icon FILE NAME
        from templates/motion/icons/ (plan_lint_motion validates any spec.icon*
        against that dir). The node gains a leading icon chip rendered
        desaturated-gray, popping to full (baked) color ~350ms after the node
        lands. Empty iconN = the v1 text-only node, layout identical.
      - panX (panmap canvas-pan continuity): TOTAL lateral canvas translate in
        px across the window (the world glides x: +panX/2 -> -panX/2). 0/unset
        keeps the v1 ~1.5% drift. The world auto-oversizes so no edge shows.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · whiteboard-map</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f5f0;             /* opaque — this comp owns the whole frame */
        font-family: var(--font);
      }
      #map-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Full-bleed paper on a CHILD (never the root) — the producer's frame
         compositing can drop the root's own background (frame renders black). */
      #map-bg { position: absolute; inset: 0; background: #f7f5f0; }

      /* Drifting world: oversized so the ~1.5% lateral drift never exposes an
         edge. Grid + all content ride it together (the canvas IS the camera). */
      #map-world {
        position: absolute;
        left: -48px; top: -48px;
        width: 2016px; height: 1176px;
        will-change: transform;
      }
      #map-grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, #e9e6de 0 1px, transparent 1px),
          linear-gradient(to bottom, #e9e6de 0 1px, transparent 1px);
        background-size: 192px 192px, 192px 192px;
      }
      /* 1:1 coordinate space (1920x1080) inside the oversized world. */
      #map-canvas { position: absolute; left: 48px; top: 48px; width: 1920px; height: 1080px; }

      #map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .map-conn {
        fill: none;
        stroke: color-mix(in srgb, var(--accent) 45%, #ffffff);
        stroke-width: 7px;
        stroke-linecap: round;
        stroke-linejoin: round;
        will-change: stroke-dashoffset;
      }

      /* Title pill — accent-TINTED field, dark ink (the reference's green pill
         recolored; structure identical). Centered by a full-width flex row so
         GSAP transforms never fight the centering. */
      #map-title-row {
        position: absolute;
        left: 0; top: 150px;
        width: 1920px;
        display: flex;
        justify-content: center;
      }
      #map-title {
        padding: 20px 42px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--accent) 15%, #ffffff);
        border: 2px solid color-mix(in srgb, var(--accent) 30%, #ffffff);
        color: #101318;
        font-weight: 800;
        font-size: 50px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 10px 26px rgba(16, 24, 48, 0.10);
        will-change: transform, opacity;
      }

      /* Child nodes — dark rounded rects, white text, 1-2 lines, centered in a
         fixed slot so text growth stays centered on the connector's landing x. */
      .map-slot {
        position: absolute;
        width: 560px;
        display: flex;
        justify-content: center;
      }
      .map-node {
        max-width: 520px;
        padding: 18px 30px;
        border-radius: 14px;
        background: #14161b;
        color: #ffffff;
        font-weight: 700;
        font-size: 32px;
        line-height: 1.3;
        text-align: center;
        border: 2px solid color-mix(in srgb, var(--accent) 35%, #ffffff);
        box-shadow: 0 12px 30px rgba(16, 24, 40, 0.18);
        will-change: transform, opacity;
      }

      /* Optional node icon chip (pair-2 iconN): white disc, brand mark stacked
         gray-under-color; the color layer pops in after the node lands. The
         GRAY layer's filter is STATIC (never animated). */
      .map-node--icon {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: left;
      }
      .map-icon-chip {
        position: relative;
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #ffffff;
        will-change: transform;
      }
      .map-icon-chip img {
        position: absolute;
        inset: 9px;
        width: 30px;
        height: 30px;
      }
      .map-icon-gray { filter: grayscale(1) opacity(0.55); }
      .map-icon-color { will-change: opacity; }

      /* Value-handoff sentence (pair-2): builds word-by-word center-frame, then
         the whole block shrinks/rises into the title-pill position. */
      #map-handoff {
        position: absolute;
        left: 160px; top: 0;
        width: 1600px; height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      #map-handoff-inner {
        width: 100%;
        text-align: center;
        color: #14161b;
        font-weight: 800;
        font-size: 64px;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      .map-hw { display: inline-block; will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div
      id="map-root"
      data-composition-id="whiteboard-map"
      data-width="1920"
      data-height="1080"
      data-duration="7"
    >
      <div id="map-bg"></div>
      <div id="map-world">
        <div id="map-grid" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
        <div id="map-canvas">
          <svg id="map-svg" class="clip" viewBox="0 0 1920 1080" preserveAspectRatio="none"
               data-start="0" data-duration="60" data-track-index="2"></svg>
          <div id="map-title-row">
            <div id="map-title" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
          </div>
          <div id="map-handoff" class="clip" data-start="0" data-duration="60" data-track-index="8">
            <div id="map-handoff-inner"></div>
          </div>
          <div class="map-slot" id="map-slot-1">
            <div id="map-node-1" class="map-node clip" data-start="0" data-duration="60" data-track-index="4"></div>
          </div>
          <div class="map-slot" id="map-slot-2">
            <div id="map-node-2" class="map-node clip" data-start="0" data-duration="60" data-track-index="5"></div>
          </div>
          <div class="map-slot" id="map-slot-3">
            <div id="map-node-3" class="map-node clip" data-start="0" data-duration="60" data-track-index="6"></div>
          </div>
          <div class="map-slot" id="map-slot-4">
            <div id="map-node-4" class="map-node clip" data-start="0" data-duration="60" data-track-index="7"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("map-root");
        const D = parseFloat(root.dataset.duration) || 7;

        // All content defaults are EMPTY: an unset node renders NOTHING (G21).
        const defaults = {
          title: "",
          node1: "", node2: "", node3: "", node4: "",
          at1: 0.5, at2: 1.4, at3: 2.3, at4: 3.2,
          accent: "#054BC9",
          handoffText: "", handoffAt: 1.2,
          icon1: "", icon2: "", icon3: "", icon4: "",
          panX: 0,
        };
        // PREVIEW-ONLY demo content (the reference beat itself). Activates ONLY
        // when title AND every nodeN are unset — a bare preview/render with no
        // --variables; any plan that sets a node gets EXACTLY its nodes.
        const SAMPLE = {
          title: "And in that time",
          node1: "I've basically launched a YouTube comedy channel",
          node2: "An SEO company",
          node3: "An AI agency",
          at1: 0.5, at2: 2.2, at3: 4.0,
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["title", "node1", "node2", "node3", "node4",
                             "handoffText", "icon1", "icon2", "icon3", "icon4"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--accent", vars.accent);

        // Title pill (empty = no pill, and no connectors to draw FROM).
        const titleEl = document.getElementById("map-title");
        const titleText = (vars.title == null ? "" : String(vars.title)).trim();
        if (titleText) titleEl.textContent = titleText;
        else document.getElementById("map-title-row").remove();
        const PILL_MID = 198;      // connector side-exit y (hidden under the pill)
        const PILL_BOTTOM = 240;   // connector bottom-exit y

        // Value handoff (pair-2, darkmap): word spans build center-frame, the
        // block shrinks/rises into the pill position at handoffAt. Inactive
        // (empty handoffText) = element removed, v1 behavior untouched.
        const handoffText = (vars.handoffText == null ? "" : String(vars.handoffText)).trim();
        const handoffEl = document.getElementById("map-handoff");
        const hAt = Math.max(0.8, Math.min(Number(vars.handoffAt) || 1.2, D - 0.8));
        let handoffWords = [];
        if (handoffText) {
          const inner = document.getElementById("map-handoff-inner");
          handoffText.split(/\s+/).forEach(function (w, i) {
            if (i > 0) inner.appendChild(document.createTextNode(" "));
            const s = document.createElement("span");
            s.className = "map-hw";
            s.textContent = w;
            inner.appendChild(s);
            handoffWords.push(s);
          });
        } else {
          handoffEl.remove();
        }

        // Reference spread (staggered left/right below the pill), auto-balanced
        // per active-node count. [cx, slotTop] in 1920x1080 canvas coords.
        const SPREADS = {
          1: [[500, 560]],
          2: [[480, 580], [1400, 540]],
          3: [[420, 560], [980, 730], [1500, 530]],
          4: [[380, 540], [770, 770], [1210, 750], [1560, 520]],
        };

        // Fill / prune the four static slots; drop empties before layout.
        // iconN (pair-2): a set icon file prepends a gray-under-color chip and
        // switches the node to flex; empty iconN keeps the v1 text-only path.
        function fillNode(node, text, iconFile) {
          if (!iconFile) { node.textContent = text; return null; }
          node.classList.add("map-node--icon");
          const chip = document.createElement("span");
          chip.className = "map-icon-chip";
          const gray = document.createElement("img");
          gray.className = "map-icon-gray";
          gray.src = "/icons/" + iconFile;
          gray.alt = "";
          const color = document.createElement("img");
          color.className = "map-icon-color";
          color.src = "/icons/" + iconFile;
          color.alt = "";
          chip.appendChild(gray);
          chip.appendChild(color);
          node.appendChild(chip);
          const span = document.createElement("span");
          span.textContent = text;
          node.appendChild(span);
          return { chip: chip, gray: gray, color: color };
        }
        const active = [];
        for (let n = 1; n <= 4; n++) {
          const slot = document.getElementById("map-slot-" + n);
          const node = document.getElementById("map-node-" + n);
          const text = (vars["node" + n] == null ? "" : String(vars["node" + n])).trim();
          if (!text) { slot.remove(); continue; }
          const iconFile = (vars["icon" + n] == null ? "" : String(vars["icon" + n])).trim();
          const icon = fillNode(node, text, iconFile);
          const at = Number(vars["at" + n]);
          active.push({ slot: slot, node: node, icon: icon,
                        at: isFinite(at) ? at : 0.5 });
        }
        const spread = SPREADS[active.length] || [];
        active.forEach(function (a, i) {
          a.cx = spread[i][0];
          a.topY = spread[i][1];
          a.slot.style.left = (a.cx - 280) + "px";
          a.slot.style.top = a.topY + "px";
        });

        // Rounded-elbow connectors: exit the pill toward each node (side exit,
        // or straight down when the node sits under the pill), rounded 90°
        // corner, drop to the slot top. Start point hides UNDER the pill (drawn
        // above the SVG), so the draw-on emerges from the pill edge like the
        // reference. Same-side runs fan to distinct y so they never coincide.
        const svg = document.getElementById("map-svg");
        const NS = "http://www.w3.org/2000/svg";
        const sideCount = { left: 0, right: 0 };
        function buildConnector(a, n) {
          const dx = a.cx - 960;
          const endY = a.topY - 8;
          let d;
          if (Math.abs(dx) < 120) {
            d = "M " + a.cx + " " + PILL_BOTTOM + " L " + a.cx + " " + endY;
          } else {
            const side = dx < 0 ? "left" : "right";
            const runY = 186 + sideCount[side] * 26;
            sideCount[side] += 1;
            const r = 34;
            const approachX = a.cx + (dx < 0 ? r : -r);
            d = "M 960 " + runY +
                " L " + approachX + " " + runY +
                " Q " + a.cx + " " + runY + " " + a.cx + " " + (runY + r) +
                " L " + a.cx + " " + endY;
          }
          const path = document.createElementNS(NS, "path");
          path.setAttribute("class", "map-conn");
          path.setAttribute("id", "map-conn-" + n);
          path.setAttribute("d", d);
          svg.appendChild(path);
          const L = path.getTotalLength();
          path.style.strokeDasharray = L;
          path.style.strokeDashoffset = L;   // resting state = NOT drawn (progressive disclosure)
          return { path: path, len: L };
        }
        if (titleText) {
          active.forEach(function (a, i) { a.conn = buildConnector(a, i + 1); });
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // The canvas drifts laterally ~1.5% across the whole window (burst: the
        // world feels alive; between-events motion is the drift, nothing else).
        // panX (pair-2, panmap): a non-zero total pan replaces the default
        // drift; the world is widened so the glide never exposes an edge.
        const panX = Number(vars.panX) || 0;
        if (panX) {
          const extra = Math.max(0, Math.abs(panX) / 2 - 48);
          if (extra > 0) {
            const world = document.getElementById("map-world");
            world.style.left = -(48 + extra) + "px";
            world.style.width = (2016 + 2 * extra) + "px";
            document.getElementById("map-canvas").style.left = (48 + extra) + "px";
          }
          tl.fromTo("#map-world", { x: panX / 2, y: 5 },
            { x: -panX / 2, y: -6, duration: D, ease: "none" }, 0);
        } else {
          tl.fromTo("#map-world", { x: 12, y: 5 }, { x: -16, y: -6, duration: D, ease: "none" }, 0);
        }

        // Value handoff: words land center-frame (~130ms cadence, compressed to
        // finish ~0.55s before hAt), then the block shrinks/rises into the pill
        // position (center 960,198 <- 960,540; pill font 50 / handoff font 64)
        // and fades as the pill fades in to receive it.
        if (handoffText) {
          const wordsStart = 0.15;
          const step = Math.min(0.14,
            Math.max(0.05, (hAt - 0.55 - wordsStart) / handoffWords.length));
          handoffWords.forEach(function (s, i) {
            tl.set(s, { opacity: 0, y: 14, scale: 0.94 }, 0);
            tl.to(s, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power2.out" },
              wordsStart + i * step);
          });
          tl.to(handoffEl, { y: -342, scale: 50 / 64, duration: 0.5, ease: "power2.inOut" }, hAt);
          tl.to(handoffEl, { opacity: 0, duration: 0.25, ease: "power1.in" }, hAt + 0.3);
        }

        // Title pill fades+rises first (~250ms, burst entrance timing); with a
        // handoff active it instead fades in AT the handoff, receiving the
        // sentence as it arrives in the pill position.
        if (titleText) {
          tl.set(titleEl, { opacity: 0, y: -12, scale: 0.96 }, 0);
          tl.to(titleEl, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power2.out" },
            handoffText ? hAt + 0.3 : 0.12);
        }

        // Per node: connector draws ~300ms starting ~200ms before the land (v1
        // grammar — verified: the 0.2s lead applies at every unclamped atN; the
        // 0.15s floor only trims the lead for a node landing at t<0.35);
        // the node fades+rises ~250ms at atN. Un-landed nodes stay invisible.
        // While a handoff is active, node/connector starts are floored to
        // hAt+0.55 so nothing draws under the center-frame sentence.
        const atFloor = handoffText ? hAt + 0.55 : 0.15;
        active.forEach(function (a) {
          const at = Math.max(atFloor, Math.min(a.at, D - 0.35));
          if (a.conn) {
            tl.to(a.conn.path, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
              Math.max(0, at - 0.2));
          }
          tl.set(a.node, { opacity: 0, y: 16, scale: 0.97 }, 0);
          tl.to(a.node, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "power2.out" }, at);
          if (a.icon) {
            // Icon chip: gray at land, popping to full color ~350ms later
            // (sheet_11 states 137-138). Crossfade + a small chip pop.
            tl.set(a.icon.color, { opacity: 0 }, 0);
            tl.to(a.icon.color, { opacity: 1, duration: 0.22, ease: "power2.out" }, at + 0.35);
            tl.to(a.icon.gray, { opacity: 0, duration: 0.22, ease: "power2.out" }, at + 0.35);
            tl.to(a.icon.chip, { scale: 1.14, duration: 0.14, ease: "power2.out" }, at + 0.35);
            tl.to(a.icon.chip, { scale: 1, duration: 0.16, ease: "power2.in" }, at + 0.49);
          }
        });

        // No self fade-out: own-screen takeover holds; the compositor owns both seams.
        tl.seek(0);
        window.__timelines["whiteboard-map"] = tl;
      })();
    </script>
  </body>
</html>
