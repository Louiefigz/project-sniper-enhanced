<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow microtext (mono caps + square marker; empty = omit)","default":""},
    {"id":"eyebrowAccent","type":"enum","label":"Eyebrow marker semantic accent","default":"ink","options":[{"value":"ink","label":"Ink (neutral)"},{"value":"process","label":"Process (blue)"},{"value":"result","label":"Result (amber)"}]},
    {"id":"headlineLines","type":"string","label":"Thesis headline, pipe-separated lines (2 max)","default":""},
    {"id":"explainer","type":"string","label":"1-2 line gray explainer (empty = omit)","default":""},
    {"id":"axisLabel","type":"string","label":"Axis / cap label (mono, above the tracks; empty = omit)","default":""},
    {"id":"bars","type":"string","label":"Bullet bars, pipe-separated: num~value~pct (pct 0-100 of the axis; value lands WITH the tip)","default":""},
    {"id":"threshPct","type":"number","label":"Limit tick position (red; 0-100 of the track)","default":100,"min":0,"max":100,"step":1},
    {"id":"verdict","type":"string","label":"Verdict footnote (mono + amber square marker, lands after the bars; empty = omit)","default":""},
    {"id":"spectrum","type":"string","label":"Spectrum rail, pipe-separated 2-3 labels (e.g. FIRST PASS|PACING HELD|FINAL; empty = omit)","default":""},
    {"id":"moduleLands","type":"string","label":"Narration-paced lands (s, comp-relative, pipe/comma) — one per PRESENT module [head, chart, verdict, spectrum]; empty = 0.2 + k*0.9","default":""},
    {"id":"exit","type":"enum","label":"Exit","default":"hold","options":[{"value":"hold","label":"Hold to end (compositor owns the seam)"},{"value":"blur-recede","label":"Blur-recede 0.15s (whole field — the face beside stays sharp)"}]}
  ]'
>
  <!--
    PROJECT SNIPER · LONG-FORM template: MODULE-BULLET-BARS (16:9, 1920x1080)
    Measurements against a limit, on the light paper panel. A cool-paper field
    grows out of the LEFT edge into a 720px column beside the presenter and
    carries an eyebrow, a thesis headline, an optional explainer, a chart card
    of bullet bars that all share one limit tick, a verdict footnote and an
    optional spectrum rail. The presenter keeps playing, full-frame, right.
    Information shape: "each value vs one limit, then the verdict".

    SNIPER DESIGN (tokens.css light module surface; the module-rail twin):
      - Field = --rail-cream (cool paper #F1F4F6) with a faint 48px ink dot
        field and a faint process-blue glow in the top-left corner.
      - Eyebrow = --eyebrow-font (IBM Plex Mono 600) caps led by a square
        marker; headline = --font-display (Bricolage Grotesque 800) in
        --rail-cream-ink; explainer = --font (Inter 400); every axis label,
        row number, value, verdict and spectrum label = Plex Mono.
      - Chart = one white card, 5px corners, 1px ink hairline. Empty tracks
        are paper-filled; fills are --accent-result (amber: the result);
        the shared limit tick is --accent-warn (red: limits only)
        with a 1.5px white keyline so it stays distinct where a fill runs
        through it.
      - Contrast (WCAG 2.x, computed from the tokens.css values):
          ink #131720 on paper 16.23:1, on the white card 17.93:1
          ink 72% (eyebrow) 6.78:1 on paper; ink 62% (explainer, axis,
            row numbers, spectrum) 4.85:1 on paper, 5.02:1 on white
          amber fill vs its paper track 3.18:1; red tick on white 4.72:1
          square markers: process 3.66:1 / result 3.18:1 on paper
      - Red appears ONLY as the limit tick; amber marks the result.

    CONTRACT for the PRODUCER compositing stage:
      - ALPHA OVERLAY, anchor "free-band" (render --format mov). NOT
        own-screen: the field grows from the LEFT edge with a HARD vertical
        edge (RAIL_WIPE_S = 0.3s power2.out) and settles at RAIL_WIDTH_PX =
        720 (37.5%W). 720px is a geometry pin: it equals producer_config's
        recompose width_frac 0.375 for the kind — wider than module-rail's
        634px because the bars need runway — and the face-anchored
        `recompose` move re-centres the presenter in the remaining ~62%W.
        The face is never covered.
      - Chart grammar: the card, its labels, the empty tracks and the limit
        tick land as ONE skeleton; every fill starts +SKELETON_GAP_S
        later and runs BAR_FILL_S = 0.75s power1.out (Sniper design parameter:
        long enough for the eye to follow the bars toward the limit, short
        enough that the payoff lands inside one spoken clause). Each VALUE
        label lands WITH its bar tip. All bars fill on the same beat — the
        chart land is the narration lock; the verdict is the payoff and
        lands on ITS OWN land, after the bars.
      - threshPct outside [0,100] FAILS LOUDLY; a bar pct outside [0,100]
        FAILS LOUDLY too — an over-limit value is a separate story for the
        editor to tell with a different form, never a clipped bar.
      - Headline: at most 2 pipe-separated lines (more FAILS LOUDLY).
      - moduleLands: one land per PRESENT module in order [head, chart,
        verdict, spectrum]. A count mismatch FAILS LOUDLY. Empty =
        LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S (0.2 + k*0.9s: one
        module per spoken clause at a relaxed pace).
      - UNSET content renders NOTHING (G21). The SAMPLE below (original Sniper
        preview copy) activates only when EVERY content variable is unset.
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - exit:"blur-recede" targets the WHOLE FIELD (an alpha layer, so the
        face beside it stays sharp and the paper never outlives the stage).
        Default "hold" = hard-off on the cut (the compositor owns the seam).
      - Re-tint through the tokens: --rail-cream / --rail-cream-ink /
        --accent-result / --accent-process / --accent-warn (each fallback hex
        below equals the tokens.css value).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · module-bullet-bars</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #nbb-root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        /* Ink steps derived from the ink token (ratios in the header). */
        --nbb-ink: var(--rail-cream-ink, #131720);
        --nbb-ink-label: color-mix(in srgb, var(--rail-cream-ink, #131720) 72%, transparent);
        --nbb-ink-soft: color-mix(in srgb, var(--rail-cream-ink, #131720) 62%, transparent);
        --nbb-hairline: color-mix(in srgb, var(--rail-cream-ink, #131720) 12%, transparent);
      }

      /* Paper field: grows 0 -> 720px (37.5%W) from the LEFT edge — hard
         vertical edge; overflow-hidden reveals the pinned stage. */
      #nbb-field {
        position: absolute;
        left: 0; top: 0;
        width: 720px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--rail-cream, #F1F4F6);
        background-image:
          radial-gradient(circle at 1px 1px, rgba(19, 23, 32, 0.09) 1.2px, transparent 1.6px),
          radial-gradient(ellipse 820px 540px at 0% 0%, rgba(68, 123, 228, 0.09), transparent 70%);
        background-size: 48px 48px, 100% 100%;
        will-change: width, opacity, filter;
      }
      #nbb-stage {
        position: absolute;
        left: 60px; top: 0;
        width: 600px; height: 1080px;
        padding: 88px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 28px;
      }
      .module { will-change: opacity; }

      #nbb-eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 23px; line-height: 1;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--nbb-ink-label);
      }
      #nbb-eyebrow .dot {
        width: 12px; height: 12px; border-radius: 2px;
        background: var(--nbb-ink);
        flex: 0 0 auto;
      }
      #nbb-eyebrow.process .dot { background: var(--accent-process, #447BE4); }
      #nbb-eyebrow.result .dot { background: var(--accent-result, #CC7200); }

      #nbb-headline {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 60px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: var(--nbb-ink);
      }
      #nbb-headline .line { display: block; will-change: opacity; }

      #nbb-explainer {
        font-weight: 400; font-size: 25px; line-height: 1.34;
        color: var(--nbb-ink-soft);
      }

      /* Chart card — white, 1px hairline; label | track | value grid. */
      #nbb-chart {
        background: #FFFFFF;
        border: 1px solid var(--nbb-hairline);
        border-radius: 5px;
        padding: 24px 26px;
        box-shadow: 0 1px 3px rgba(19, 23, 32, 0.06);
        display: flex; flex-direction: column; gap: 22px;
      }
      #nbb-axis {
        display: flex; justify-content: space-between;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 16px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--nbb-ink-soft);
      }
      .bar-row {
        display: grid;
        grid-template-columns: 44px 1fr 84px;
        align-items: center;
        gap: 18px;
      }
      .bar-num {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 17px;
        color: var(--nbb-ink-soft);
      }
      .bar-track {
        position: relative;
        height: 16px;
        background: var(--rail-cream, #F1F4F6);
        box-shadow: inset 0 0 0 1px var(--nbb-hairline);
        border-radius: 3px;
      }
      .bar-fill {
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 0;
        border-radius: 3px;
        background: var(--accent-result, #CC7200);
      }
      /* The limit tick — the ONLY red in the comp (limits/failures only). */
      .bar-tick {
        position: absolute; top: -5px; bottom: -5px;
        width: 3px;
        border-radius: 1px;
        background: var(--accent-warn, #D33B36);
        box-shadow: 0 0 0 1.5px #FFFFFF;
      }
      .bar-value {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 19px;
        color: var(--nbb-ink);
        text-align: right;
        will-change: opacity;
      }

      /* Verdict footnote — mono caps led by an amber square (the payoff). */
      #nbb-verdict {
        display: flex; align-items: center; gap: 12px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 20px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--nbb-ink);
      }
      #nbb-verdict .dot {
        width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto;
        background: var(--accent-result, #CC7200);
      }

      /* Spectrum rail: mono labels joined by hairline segments. */
      #nbb-spectrum {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 16px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--nbb-ink-soft);
      }
      #nbb-spectrum .seg {
        flex: 1 1 auto;
        height: 1px;
        background: color-mix(in srgb, var(--rail-cream-ink, #131720) 24%, transparent);
      }
    </style>
  </head>
  <body>
    <div
      id="nbb-root"
      data-composition-id="module-bullet-bars"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="8"
    >
      <div id="nbb-field">
        <div id="nbb-stage">
          <div id="nbb-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="nbb-eyebrow-text"></span></div>
          <div id="nbb-headline" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="nbb-explainer" class="module clip" data-start="0" data-duration="60" data-track-index="3"></div>
          <div id="nbb-chart" class="module clip" data-start="0" data-duration="60" data-track-index="4">
            <div id="nbb-axis"><span>0</span><span id="nbb-axis-label"></span></div>
          </div>
          <div id="nbb-verdict" class="module clip" data-start="0" data-duration="60" data-track-index="5"><span class="dot"></span><span id="nbb-verdict-text"></span></div>
          <div id="nbb-spectrum" class="module clip" data-start="0" data-duration="60" data-track-index="6"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("nbb-root");
        const D = parseFloat(root.dataset.duration) || 8;
        const M = window.__motionTokens;

        // Sniper design parameters (see header):
        const RAIL_WIPE_S = 0.3;      // left-edge grow, hard vertical edge
        const RAIL_WIDTH_PX = 720;    // 37.5%W (recompose width_frac 0.375)
        const BAR_FILL_S = 0.75;      // every bar fill, power1.out
        const LINE_STAGGER_S = 0.12;
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9;

        const defaults = {
          eyebrow: "", eyebrowAccent: "ink", headlineLines: "", explainer: "",
          axisLabel: "", bars: "", threshPct: 100, verdict: "", spectrum: "",
          moduleLands: "", exit: "hold",
        };
        const CONTENT_KEYS = ["eyebrow", "headlineLines", "explainer",
          "axisLabel", "bars", "verdict", "spectrum"];
        // PREVIEW-ONLY demo (original Sniper sample copy). It activates ONLY
        // when every content variable is unset (G21).
        const SAMPLE = {
          eyebrow: "RENDER TIMES",
          headlineLines: "Four review passes.",
          explainer: "Every pass finished inside the two-minute render budget we set.",
          axisLabel: "120 SEC RENDER BUDGET",
          bars: "01~84.2~70|02~96.5~80|03~91.3~76|04~88.0~73",
          threshPct: 100,
          verdict: "4 OF 4 INSIDE BUDGET",
          spectrum: "FIRST PASS|PACING HELD|FINAL",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }

        // ---- Fill / prune modules (unset content renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("nbb-eyebrow");
        if (ebText) {
          document.getElementById("nbb-eyebrow-text").textContent = ebText;
          const ea = str("eyebrowAccent") || "ink";
          if (ea === "process" || ea === "result") ebEl.classList.add(ea);
          else if (ea !== "ink") {
            throw new Error("module-bullet-bars: eyebrowAccent '" + ea +
              "' not in ink|process|result");
          }
        } else { ebEl.remove(); }

        const headEl = document.getElementById("nbb-headline");
        const heads = str("headlineLines");
        if (heads) {
          const lines = heads.split("|").map(function (s) { return s.trim(); });
          if (lines.length > 2) {
            throw new Error("module-bullet-bars: headlineLines is 2 lines " +
              "max (thesis headline), got " + lines.length);
          }
          lines.forEach(function (line) {
            const el = document.createElement("span");
            el.className = "line";
            el.textContent = line;
            headEl.appendChild(el);
          });
        } else { headEl.remove(); }

        const expText = str("explainer");
        const expEl = document.getElementById("nbb-explainer");
        if (expText) expEl.textContent = expText;
        else expEl.remove();

        // Threshold: fail loudly outside [0,100]; unset keeps the 100
        // default (tick AT the cap — Number("") would silently mean 0).
        const threshRaw = vars.threshPct;
        const threshPct = (threshRaw == null || String(threshRaw).trim() === "")
          ? 100 : Number(threshRaw);
        if (!isFinite(threshPct) || threshPct < 0 || threshPct > 100) {
          throw new Error("module-bullet-bars: threshPct must be 0-100, got '" +
            vars.threshPct + "'");
        }

        // Bars: num~value~pct rows; the limit tick rides every track.
        const chartEl = document.getElementById("nbb-chart");
        const axisText = str("axisLabel");
        if (axisText) document.getElementById("nbb-axis-label").textContent = axisText;
        else document.getElementById("nbb-axis").remove();
        const barsRaw = str("bars");
        const bars = [];
        if (barsRaw) {
          barsRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            const pct = parseFloat(f[2]);
            if (f.length !== 3 || !f[0] || !f[1] || !isFinite(pct)) {
              throw new Error("module-bullet-bars: bar " + (i + 1) +
                " needs num~value~pct, got '" + line + "'");
            }
            if (pct < 0 || pct > 100) {
              throw new Error("module-bullet-bars: bar " + (i + 1) +
                " pct must be 0-100 (an over-cap measurement is a different " +
                "story — never a clipped bar), got " + pct);
            }
            const row = document.createElement("div");
            row.className = "bar-row";
            const num = document.createElement("span");
            num.className = "bar-num";
            num.textContent = f[0];
            const track = document.createElement("span");
            track.className = "bar-track";
            const fill = document.createElement("span");
            fill.className = "bar-fill";
            track.appendChild(fill);
            const tick = document.createElement("span");
            tick.className = "bar-tick";
            tick.style.left = "calc(" + threshPct + "% - 1.5px)";
            track.appendChild(tick);
            const value = document.createElement("span");
            value.className = "bar-value";
            value.textContent = f[1];
            row.appendChild(num);
            row.appendChild(track);
            row.appendChild(value);
            chartEl.appendChild(row);
            bars.push({ fill: fill, value: value, pct: pct });
          });
        } else if (!axisText) {
          chartEl.remove();
        }

        const verdictText = str("verdict");
        const verdictEl = document.getElementById("nbb-verdict");
        if (verdictText) document.getElementById("nbb-verdict-text").textContent = verdictText;
        else verdictEl.remove();

        const specEl = document.getElementById("nbb-spectrum");
        const specTexts = str("spectrum") ? str("spectrum").split("|")
          .map(function (s) { return s.trim(); }).filter(Boolean) : [];
        if (specTexts.length) {
          specTexts.forEach(function (t, i) {
            if (i > 0) {
              const seg = document.createElement("span");
              seg.className = "seg";
              specEl.appendChild(seg);
            }
            const label = document.createElement("span");
            label.textContent = t;
            specEl.appendChild(label);
          });
        } else { specEl.remove(); }

        // ---- Narration-paced lands ([head, chart, verdict, spectrum]) ----
        const modules = [];
        if (ebText || heads || expText) modules.push("head");
        if (bars.length || axisText) modules.push("chart");
        if (verdictText) modules.push("verdict");
        if (specTexts.length) modules.push("spectrum");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("module-bullet-bars: moduleLands needs " +
              modules.length + " finite times for modules [" +
              modules.join(", ") + "], got '" + landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Field grows in from the LEFT edge (hard vertical edge).
        tl.fromTo("#nbb-field", { width: 0 },
          { width: RAIL_WIDTH_PX, duration: RAIL_WIPE_S, ease: "power2.out" }, 0);

        if (landOf.head != null) {
          const t0 = landOf.head;
          let headAt = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            headAt = t0 + M.EYEBROW_LEAD_S;     // the eyebrow leads the headline
          }
          let lastAt = headAt;
          if (heads) {
            headEl.querySelectorAll(".line").forEach(function (lineEl, j) {
              lastAt = headAt + j * LINE_STAGGER_S;
              M.textRamp(tl, lineEl, lastAt);   // in-place opacity ramp
            });
          }
          if (expText) M.textRamp(tl, expEl, lastAt + LINE_STAGGER_S);
        }

        // Chart: the skeleton (card + labels + empty tracks + limit tick)
        // lands as ONE unit, THEN the fills start +SKELETON_GAP_S. Fills run
        // BAR_FILL_S power1.out; each value label lands WITH its tip.
        if (landOf.chart != null) {
          const tC = landOf.chart;
          M.textRamp(tl, chartEl, tC);
          const fillAt = tC + M.SKELETON_GAP_S;
          bars.forEach(function (b) {
            tl.fromTo(b.fill, { width: "0%" },
              { width: b.pct + "%", duration: BAR_FILL_S, ease: "power1.out" },
              fillAt);
            M.textRamp(tl, b.value, fillAt + BAR_FILL_S - M.TEXT_RAMP_S);
          });
        }

        // Verdict = the payoff footnote; it lands on ITS narration land,
        // after the bars.
        if (landOf.verdict != null) M.textRamp(tl, verdictEl, landOf.verdict);
        if (landOf.spectrum != null) M.textRamp(tl, specEl, landOf.spectrum);

        // exit:"blur-recede": the whole FIELD (alpha layer — the live face
        // beside it stays sharp; the paper never outlives the stage).
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#nbb-field", D - M.EXIT_BLUR_S);
        }

        tl.seek(0);
        window.__timelines["module-bullet-bars"] = tl;
      })();
    </script>
  </body>
</html>
