name: Windows qualification

on:
  workflow_dispatch:
  push:
    branches: [codex/cross-platform-installer]
    paths-ignore:
      - release/macos-intel-qualification.url
      - .github/workflows/macos-intel-qualification.yml
      - release/prepare_macos_qualification.py
      - release/tests/test_macos_intel_qualification.py

jobs:
  install-and-admit:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pinned Windows media preflight
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\sniper-native-preflight-cache
          key: windows-native-media-${{ hashFiles('release/payload_files/install/deps/win-64.lock') }}
      - name: Assemble qualification package
        shell: pwsh
        run: python -m release.prepare_windows_qualification "$env:RUNNER_TEMP\Project Sniper Windows"
      - name: Parse Windows PowerShell sources
        shell: powershell
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\Project Sniper Windows" -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parsing failed for $($_.FullName)."
            }
          }
      - name: Compile the Windows media jail preflight
        shell: powershell
        run: |
          . "$env:RUNNER_TEMP\Project Sniper Windows\install\lib\windows\MediaJail.ps1"
          $source = "$env:RUNNER_TEMP\Project Sniper Windows\scripts\producer\headless\windows_media_jail.cs"
          $privateRuntime = "$env:RUNNER_TEMP\sniper-private-runtime"
          New-Item -ItemType Directory -Path $privateRuntime -Force | Out-Null
          $target = Join-Path $privateRuntime 'windows_media_jail_preflight.exe'
          Compile-JailProgram $source $target
          if (-not (Test-Path $target)) { throw 'The Windows media jail preflight did not compile.' }
          $sid = (& $target sid | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or $sid -notmatch '^S-1-15-2-') {
            throw "The Windows media jail preflight did not create an AppContainer SID: $sid"
          }
          & $target protect-directory $privateRuntime
          if ($LASTEXITCODE -ne 0) { throw 'The Windows media jail could not protect its runtime fixture.' }
          $allowed = "$env:RUNNER_TEMP\sniper-jail-allowed.txt"
          $other = "$env:RUNNER_TEMP\sniper-jail-other.txt"
          $attest = "$env:RUNNER_TEMP\sniper-jail-attestation.json"
          Set-Content -LiteralPath $allowed -Value 'allowed' -Encoding ASCII
          Set-Content -LiteralPath $other -Value 'private' -Encoding ASCII
          & $target protect $other
          if ($LASTEXITCODE -ne 0) { throw 'The Windows media jail could not protect its denial fixture.' }
          & $target run $allowed $attest 33554432 10 10 preflight probe.exe exec -- $target token
          if ($LASTEXITCODE -ne 0) { throw 'The child reports that its own token is not an AppContainer.' }
          & $target run $allowed $attest 33554432 10 10 preflight probe.exe exec -- $target read $allowed
          if ($LASTEXITCODE -ne 0) { throw 'The AppContainer could not read its admitted input.' }
          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            & $target run $allowed $attest 33554432 10 10 preflight probe.exe exec -- $target read $other 2>&1 | Out-Host
            $deniedCode = $LASTEXITCODE
          } finally { $ErrorActionPreference = $previous }
          if ($deniedCode -eq 0) { throw 'The AppContainer read a file that was not admitted.' }
          $global:LASTEXITCODE = 0
          $proof = Get-Content -LiteralPath $attest -Raw | ConvertFrom-Json
          if (-not $proof.tokenIsAppContainer -or $proof.networkCapabilities -ne 0 -or
              $proof.job.memoryLimitBytes -ne 33554432) {
            throw 'The Windows media jail did not attest its AppContainer and exact Job Object limits.'
          }
      - name: Launch pinned FFmpeg and FFprobe inside the Windows media jail
        shell: powershell
        run: |
          $package = "$env:RUNNER_TEMP\Project Sniper Windows"
          $jail = "$env:RUNNER_TEMP\sniper-private-runtime\windows_media_jail_preflight.exe"
          $cache = "$env:RUNNER_TEMP\sniper-native-preflight-cache"
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          $lock = Join-Path $package 'install\deps\win-64.lock'
          $rows = @(Get-Content -LiteralPath $lock | Where-Object { $_ -match '^download ' })
          if ($rows.Count -ne 1) { throw "Expected one pinned media download; found $($rows.Count)." }
          $parts = $rows[0] -split ' '
          if ($parts.Count -ne 5) { throw 'The pinned media download row is malformed.' }
          $expectedSha = $parts[1]
          $expectedBytes = [long]$parts[2]
          $archive = Join-Path $cache $parts[3]
          $valid = (Test-Path $archive) -and ((Get-Item $archive).Length -eq $expectedBytes)
          if ($valid) { $valid = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expectedSha }
          if (-not $valid) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            $download = "$archive.download"
            Remove-Item -LiteralPath $download -Force -ErrorAction SilentlyContinue
            curl.exe --fail --location --retry 3 --output $download $parts[4]
            if ($LASTEXITCODE -ne 0) { throw 'Downloading the pinned Windows media archive failed.' }
            Move-Item -LiteralPath $download -Destination $archive -Force
          }
          if ((Get-Item $archive).Length -ne $expectedBytes -or
              (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedSha) {
            throw 'The cached Windows media archive does not match its immutable lock.'
          }
          $runtime = "$env:RUNNER_TEMP\sniper-native-ffmpeg"
          Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          & $jail protect-directory $runtime
          if ($LASTEXITCODE -ne 0) { throw 'The Windows media preflight runtime was not protected.' }
          $ffmpeg = @(Get-ChildItem $runtime -Filter ffmpeg.exe -Recurse)[0].FullName
          $ffprobe = @(Get-ChildItem $runtime -Filter ffprobe.exe -Recurse)[0].FullName
          python -m release.windows_runtime_preflight $package --media-jail $jail --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows media tools failed the production jail supervisor.' }
      - name: Save pinned Windows media preflight cache
        if: always() && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\sniper-native-preflight-cache
          key: windows-native-media-${{ hashFiles('release/payload_files/install/deps/win-64.lock') }}
      - name: Exercise Windows Python runtime preflights
        shell: powershell
        run: |
          python -m release.windows_runtime_preflight "$env:RUNNER_TEMP\Project Sniper Windows"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Python runtime preflight failed.' }
      - name: Build the Windows rendering runtime preflight
        shell: powershell
        run: |
          $package = "$env:RUNNER_TEMP\Project Sniper Windows"
          $motion = Join-Path $package 'templates\motion'
          $runtime = Join-Path $motion '.sniper-native-runtime'
          $state = Join-Path $package 'runtime\state'
          try {
            Push-Location $motion
            try {
              npm.cmd ci --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw 'Installing the rendering preflight dependencies failed.' }
            } finally { Pop-Location }
            New-Item -ItemType Directory -Path $state -Force | Out-Null
            $lock = Join-Path $package 'scripts\infra\sniper_lock.py'
            $builder = Join-Path $package 'scripts\producer\studio\native_runtime.py'
            $doctorLib = Join-Path $package 'install\lib'
            python -c "import sys; sys.path.insert(0, sys.argv[1]); import doctor_setup as d; assert not d.path_within(sys.argv[2], sys.argv[3]); assert d.path_within(sys.argv[2], sys.argv[4])" `
              $doctorLib 'D:\package\.venv\Scripts\python.exe' 'C:\runtime' 'D:\package\.venv'
            if ($LASTEXITCODE -ne 0) { throw 'The Windows doctor path preflight failed.' }
            python $lock exec --state-dir $state --mode exclusive --label runtime-preflight `
              --wait 0 --busy-message runtime-preflight-busy -- python $builder --repair
            if ($LASTEXITCODE -ne 0) { throw 'The Windows rendering runtime preflight failed.' }
          } finally {
            Remove-Item -LiteralPath (Join-Path $motion 'node_modules') -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $state -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Ensure qualification workspace capacity
        shell: powershell
        run: |
          $free = (Get-PSDrive -Name C).Free
          if ($free -lt 22GB) {
            $cache = [IO.Path]::GetFullPath($env:RUNNER_TOOL_CACHE).TrimEnd('\')
            if ($cache -ne 'C:\hostedtoolcache\windows') { throw "Unexpected runner tool cache: $cache" }
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          $free = (Get-PSDrive -Name C).Free
          if ($free -lt 20GB) { throw "Windows qualification needs 20 GB free; found $free bytes." }
      - name: Run the buyer installer
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\install.ps1" -Workspace "$env:RUNNER_TEMP\Sniper Projects" -SkipDoctor'
      - name: Re-run to prove idempotence
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\install.ps1" -Workspace "$env:RUNNER_TEMP\Sniper Projects" -SkipDoctor'
      - name: Run installed foundations and media admission
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\doctor.ps1" --json --skip-transcription'
      - name: Run installed local transcription proof
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\doctor.ps1" --json --only-transcription'
      - name: Run the full installed doctor
        shell: powershell
        run: '& "$env:RUNNER_TEMP\Project Sniper Windows\install\doctor.ps1" --json'
      - name: Prove the command launcher
        shell: cmd
        run: '"%RUNNER_TEMP%\Project Sniper Windows\sniper.cmd" workspace'
      - name: Prove literal local settings override
        shell: powershell
        run: |
          $override = "$env:RUNNER_TEMP\Local Project `$97"
          Set-Content "$env:RUNNER_TEMP\Project Sniper Windows\runtime\sniper.local.env" `
            -Value "SNIPER_WORKSPACE_ROOT=$override" -Encoding ASCII
          $found = & "$env:RUNNER_TEMP\Project Sniper Windows\sniper.cmd" workspace
          if ($found -ne $override) { throw "Local settings override was not read literally: $found" }
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qualification-diagnostics
          path: |
            ${{ runner.temp }}\Project Sniper Windows\runtime\logs
            ${{ runner.temp }}\Project Sniper Windows\runtime\state
