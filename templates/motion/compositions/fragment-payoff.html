<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"fragment","type":"string","label":"Verbatim fragment line (small white, top tier)","default":""},
    {"id":"payoff","type":"string","label":"Payoff line (large bold accent, builds word-by-word)","default":""},
    {"id":"accentColor","type":"color","label":"Payoff accent color (per-video brand token, R23; LL-033: keep LIGHT — this floats over footage)","default":"#7FB4FF"},
    {"id":"payoffAt","type":"number","label":"Payoff build start (s)","default":0.8,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"wordGapMs","type":"number","label":"Gap between payoff word lands (ms)","default":130,"min":40,"max":400,"step":5,"unit":"ms"},
    {"id":"align","type":"enum","label":"Horizontal anchor (slide to the emptier side, R10)","default":"center","options":[{"value":"center","label":"Center"},{"value":"left","label":"Left"},{"value":"right","label":"Right"}]}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: FRAGMENT-PAYOFF (16:9 burned overlay)
    Reference: the operator's "angle generator" long-form (REFERENCE_STYLE_STUDY
    R23 — burned text grammar). Frames: study2 burst stacked_64 (fragment line
    burned chest-height while the speaker talks) + state sheet_06 075→083
    (t64.5→70.5: small white verbatim fragment holds, then a LARGE bold accent
    payoff line builds WORD-BY-WORD beneath it at speech cadence — reference used
    green for beliefs / yellow for numbers; the accent is a per-video BRAND TOKEN,
    never hardcoded — default Project Sniper #054BC9).

    CONTRACT for the PRODUCER compositing stage:
      - anchor "free-band"/"chest" -> render `--format mov` (ProRes 4444 ALPHA).
        TRANSPARENT background — this comp composites OVER footage (chip-row
        pattern). Verify alpha RGBA-PNG-first (edge G18 — never ProRes over
        lavfi color).
      - fragment / payoff / accentColor / payoffAt / wordGapMs / align are
        `data-composition-variables`. payoffAt is when the payoff starts
        building (sync to the spoken payoff words, relative to the overlay's
        outStart); wordGapMs is the land cadence (~100-150ms in the reference).
        The payoff line's LAYOUT is fixed (final geometry from frame 0 of the
        build) and words pop into their final slots — reference frames 079/080
        show the partial line already sitting at its settled left edge.
      - align follows R10 (burned text slides to the emptier side on reframes):
        "center" (default, chest-anchored lower-center), "left", "right".
      - EMPTY-DEFAULTS LAW (G21): fragment and payoff default EMPTY — an unset
        var renders NOTHING. Demo content activates ONLY when BOTH are unset;
        setting either renders exactly what was set, no sample leak.
      - EXIT: the whole stack fades out over the LAST 0.5s of the render
        length. The payoff build compresses so the last word lands by D-0.7.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · fragment-payoff</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;          /* burned overlay — footage shows through */
        font-family: var(--font);
      }
      #fp-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Chest-anchored lower band: stack bottom sits at y=890 (~0.82H), the
         reference's caption tier (burst stacked_64: fragment center ~0.79H;
         stacked state lifts the fragment as the payoff opens beneath). */
      .stage {
        position: absolute; inset: 0;
        display: flex;
        align-items: flex-end;
        padding: 0 140px 190px;
      }
      #fp-root[data-align="center"] .stage { justify-content: center; }
      #fp-root[data-align="left"] .stage { justify-content: flex-start; }
      #fp-root[data-align="right"] .stage { justify-content: flex-end; }

      #fp-stack {
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 1640px;
        will-change: transform, opacity;
      }
      #fp-root[data-align="center"] #fp-stack { align-items: center; }
      #fp-root[data-align="left"] #fp-stack { align-items: flex-start; }
      #fp-root[data-align="right"] #fp-stack { align-items: flex-end; }

      /* Small white sans verbatim fragment (reference: burned caption weight,
         soft dark halo so it reads over any footage). */
      #fp-frag {
        font-size: 46px;
        font-weight: 600;
        line-height: 1.2;
        color: #ffffff;
        letter-spacing: 0.01em;
        text-shadow:
          0 2px 14px rgba(0, 0, 0, 0.6),
          0 0 34px rgba(0, 0, 0, 0.45);
        will-change: transform, opacity;
      }
      /* Large bold accent payoff — words pop into a FIXED final layout. */
      #fp-payoff {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        max-width: 1560px;
        will-change: transform, opacity;
      }
      #fp-root[data-align="center"] #fp-payoff { justify-content: center; }
      #fp-root[data-align="left"] #fp-payoff { justify-content: flex-start; }
      #fp-root[data-align="right"] #fp-payoff { justify-content: flex-end; }
      #fp-payoff .word {
        display: inline-block;            /* transforms need block-level + size */
        font-size: 72px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.015em;
        color: var(--accent);
        text-shadow:
          0 3px 16px rgba(0, 0, 0, 0.55),
          0 0 40px rgba(0, 0, 0, 0.35);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="fp-root"
      data-composition-id="fragment-payoff"
      data-width="1920"
      data-height="1080"
      data-duration="4"
      data-align="center"
    >
      <div class="stage">
        <div id="fp-stack">
          <div id="fp-frag" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
          <div id="fp-payoff" class="clip" data-start="0" data-duration="60" data-track-index="2"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("fp-root");
        const D = parseFloat(root.dataset.duration) || 4;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          fragment: "", payoff: "",
          accentColor: "#054BC9", payoffAt: 0.8, wordGapMs: 130, align: "center",
        };
        // PREVIEW-ONLY demo content (the reference beat itself, sheet_06
        // 075→083). Activates ONLY when fragment AND payoff are both unset.
        const SAMPLE = {
          fragment: "The output from the chat gpt or Claude would be something",
          payoff: "5 tips to stay consistent with your content",
          payoffAt: 1.0,
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["fragment", "payoff"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--accent", vars.accentColor);
        const align = ["center", "left", "right"].indexOf(String(vars.align)) >= 0 ? String(vars.align) : "center";
        root.setAttribute("data-align", align);

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // --- Fragment (top tier): quick rise-in at t=0.12 (R9 — 100-170ms, never pop). ---
        const fragEl = document.getElementById("fp-frag");
        const fragText = (vars.fragment == null ? "" : String(vars.fragment)).trim();
        if (fragText) {
          fragEl.textContent = fragText;
          if (fragText.length > 62) fragEl.style.fontSize = "40px";
          tl.set(fragEl, { opacity: 0, y: 16 }, 0);
          tl.to(fragEl, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 0.12);
        } else {
          fragEl.remove();                 // unset var renders NOTHING (no empty gap)
        }

        // --- Payoff (bottom tier): fixed final layout, words pop in place. ---
        const payoffEl = document.getElementById("fp-payoff");
        const payoffText = (vars.payoff == null ? "" : String(vars.payoff)).trim();
        if (payoffText) {
          const words = payoffText.split(/\s+/).filter(Boolean);
          // Reference scale (sheet_06 083): the payoff line owns ~85% of the
          // frame width — it is THE hit, sized above kinetic-quote body text.
          const fpx = payoffText.length <= 30 ? 84 : (payoffText.length <= 48 ? 74 : 60);
          const spans = words.map(function (w) {
            const el = document.createElement("span");
            el.className = "word";
            el.style.fontSize = fpx + "px";
            el.textContent = w;
            payoffEl.appendChild(el);
            return el;
          });
          // Land cadence: payoffAt + i*gap, compressed so the last word lands
          // by D-0.7 (the exit fade owns the last 0.5s).
          const at0 = Math.max(0, Math.min(isFinite(Number(vars.payoffAt)) ? Number(vars.payoffAt) : 0.8, D - 0.7));
          let gap = Math.max(0.04, Math.min(isFinite(Number(vars.wordGapMs)) ? Number(vars.wordGapMs) : 130, 400) / 1000);
          if (spans.length > 1) {
            gap = Math.min(gap, Math.max(0.04, (D - 0.7 - at0) / (spans.length - 1)));
          }
          spans.forEach(function (el, i) {
            tl.set(el, { opacity: 0, y: 18, scale: 0.9 }, 0);
            tl.to(el, { opacity: 1, y: 0, scale: 1, duration: 0.12, ease: "power2.out" }, at0 + i * gap);
          });
        } else {
          payoffEl.remove();               // unset var renders NOTHING
        }

        // --- Exit: the whole stack fades over the LAST 0.5s of the window. ---
        const fadeDur = Math.min(0.5, D * 0.25);
        tl.to("#fp-stack", { opacity: 0, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["fragment-payoff"] = tl;
      })();
    </script>
  </body>
</html>
