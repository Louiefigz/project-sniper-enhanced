<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label chip text (<= 4 words)","default":"In one afternoon"},
    {"id":"text","type":"string","label":"Caption box text (the thing it points to)","default":"I cut the whole episode"},
    {"id":"accent","type":"color","label":"Chip + connector ink color","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: WHITEBOARD-CONNECTOR — a floating
    whiteboard beat: a labelled node joined by a hand-drawn connector line down
    to a caption of what it produced (e.g. "In one afternoon -> I cut the whole
    episode"). Sniper design: white board with a faint 58px dot field, accent
    label chip, ink caption box (#131720, white text 17.9:1).
    ALPHA 1920x1080 overlay (transparent margins around a floating white grid
    board) -> render with `--format mov` (ProRes 4444). The board floats over the
    live head; the compositor overlays at (0,0).

    CONTRACT for the PRODUCER compositing stage:
      - label / text / accent are `data-composition-variables` — fill with
        --variables. Both chips are LEFT-anchored so text growth extends right and
        never pulls the connector's fixed anchor points off the chips.
      - The connector is a deterministic hand-drawn elbow (pure fn of t, no
        Math.random) that STROKE-DRAWS in (SVG dashoffset, seek-safe) — same
        technique as underline-circle. accent inks the label chip fill + connector.
      - Build order (progressive disclosure): board settles -> label chip pops
        -> connector draws down -> caption box pops at its end -> hold -> fade at D.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · whiteboard-connector</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;          /* alpha overlay — transparent margins */
        font-family: var(--font);
      }
      #wb-root { position: relative; width: 1920px; height: 1080px; }

      /* Floating white grid board — Miro-style light canvas, rounded + shadowed
         so it reads as a card on the transparent overlay. Grid clips to radius. */
      #wb-board {
        position: absolute;
        left: 56px; top: 56px;
        width: 1808px; height: 968px;
        background: #ffffff;
        border-radius: 36px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(10, 26, 77, 0.28);
        will-change: transform, opacity;
      }
      #wb-grid {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(circle at 2px 2px, #c9d1dc 1.6px, transparent 2.2px);
        background-size: 58px 58px;
        opacity: 0.9;
      }

      /* SVG connector spans the whole canvas (viewBox 1:1 with 1920x1080). */
      #wb-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #wb-path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 8px;
        stroke-linecap: round;
        stroke-linejoin: round;
        will-change: stroke-dashoffset;
      }

      /* Label chip — accent field, white text, LEFT-anchored at a fixed corner. */
      #wb-label {
        position: absolute;
        left: 520px; top: 214px;
        max-width: 900px;
        padding: 20px 40px;
        border-radius: 18px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 800;
        font-size: 54px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 12px 28px rgba(5, 75, 201, 0.30);
        will-change: transform, opacity;
      }
      /* Caption box — ink chip, white text. */
      #wb-text {
        position: absolute;
        left: 300px; top: 560px;
        max-width: 960px;
        padding: 26px 40px;
        border-radius: 10px;
        background: #131720;
        color: #ffffff;
        font-weight: 800;
        font-size: 50px;
        line-height: 1.12;
        letter-spacing: -0.01em;
        box-shadow: 0 16px 36px rgba(10, 26, 77, 0.30);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="wb-root"
      data-composition-id="whiteboard-connector"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4"
    >
      <div id="wb-board" class="clip" data-start="0" data-duration="60" data-track-index="1">
        <div id="wb-grid"></div>
      </div>
      <svg id="wb-svg" class="clip" viewBox="0 0 1920 1080" preserveAspectRatio="none"
           data-start="0" data-duration="60" data-track-index="2">
        <path id="wb-path" d="" />
      </svg>
      <div id="wb-label" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
      <div id="wb-text" class="clip" data-start="0" data-duration="60" data-track-index="4"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("wb-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 4;

        const defaults = {
          label: "In one afternoon",
          text: "I cut the whole episode",
          accent: "#054BC9",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        document.getElementById("wb-label").textContent = String(vars.label);
        document.getElementById("wb-text").textContent = String(vars.text);

        // Deterministic hand-drawn elbow: drops from just under the label chip,
        // stays vertical early then curves LEFT into the caption box top (quadratic
        // x-ease), with a small perpendicular wobble = the human hand. Pure fn of t.
        const sx = 560, sy = 306;         // just below the label chip's left region
        const ex = 430, ey = 556;         // caption box top edge (130px in from left)
        function buildConnector() {
          const pts = [];
          const N = 48;
          for (let i = 0; i <= N; i++) {
            const t = i / N;
            const x = sx + (ex - sx) * (t * t) + 4 * Math.sin(t * Math.PI * 3);
            const y = sy + (ey - sy) * t;
            pts.push([x, y]);
          }
          let d = "M " + pts[0][0].toFixed(2) + " " + pts[0][1].toFixed(2);
          for (let i = 1; i < pts.length; i++) {
            d += " L " + pts[i][0].toFixed(2) + " " + pts[i][1].toFixed(2);
          }
          return d;
        }
        const path = document.getElementById("wb-path");
        path.setAttribute("d", buildConnector());
        const L = path.getTotalLength();
        path.style.strokeDasharray = L;
        path.style.strokeDashoffset = 0;   // resting DOM state = fully drawn

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Board settles in first (soft scale + fade).
        tl.fromTo("#wb-board", { opacity: 0, scale: 0.965 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0);
        // Label chip pops.
        tl.fromTo("#wb-label", { opacity: 0, y: -14, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.8)" }, 0.28);
        // Connector draws down (seek-safe dashoffset).
        tl.fromTo(path, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" }, 0.5);
        // Caption box pops at the connector's landing.
        tl.fromTo("#wb-text", { opacity: 0, y: 16, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(1.7)" }, 0.86);

        // Fade the whole board out — ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.16);
        tl.to("#wb-root", { opacity: 0, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["whiteboard-connector"] = tl;
      })();
    </script>
  </body>
</html>
