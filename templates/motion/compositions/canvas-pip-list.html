<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Accent title (empty = no title)","default":""},
    {"id":"item1","type":"string","label":"List item 1 (empty = never appears)","default":""},
    {"id":"item2","type":"string","label":"List item 2 (empty = never appears)","default":""},
    {"id":"item3","type":"string","label":"List item 3 (empty = never appears)","default":""},
    {"id":"item4","type":"string","label":"List item 4 (empty = never appears)","default":""},
    {"id":"item5","type":"string","label":"List item 5 (empty = never appears)","default":""},
    {"id":"item6","type":"string","label":"List item 6 (empty = never appears)","default":""},
    {"id":"item7","type":"string","label":"List item 7 (empty = never appears)","default":""},
    {"id":"item8","type":"string","label":"List item 8 (empty = never appears)","default":""},
    {"id":"at1","type":"number","label":"Item 1 land time (s)","default":0.6,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Item 2 land time (s)","default":2.4,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Item 3 land time (s)","default":4.2,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at4","type":"number","label":"Item 4 land time (s)","default":6.0,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at5","type":"number","label":"Item 5 land time (s)","default":7.8,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at6","type":"number","label":"Item 6 land time (s)","default":9.6,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at7","type":"number","label":"Item 7 land time (s)","default":11.4,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"at8","type":"number","label":"Item 8 land time (s)","default":13.2,"min":0,"max":60,"step":0.05,"unit":"s"},
    {"id":"accentColor","type":"color","label":"Accent color (title)","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: CANVAS-PIP-LIST (16:9 talking-head longform)
    Reference: study pair 2 "8 Doors" canvas-PiP enumeration (REFERENCE_STYLE_STUDY
    R24; study2 sheet_42 states 505-515, t459.5-474.5): a long enumeration keeps
    the SPEAKER PRESENT inside the cutaway — the face is demoted to a ~27%-width
    rounded inset card left-of-center on a studio-white canvas while an accent
    title + up to 8 small dark-gray list items stagger in on the right, one per
    narration beat over ~15s.

    CONTRACT for the PRODUCER + pip_takeover renderer:
      - This is the OPAQUE canvas BACKDROP (studio white + soft card-seat shadow
        + right-side title/list). anchor "own-screen" -> render `--format mp4`.
        No self out-transition — the compositor owns both seams.
      - It RESERVES the left-of-center region x[140,660] y[190,890] (520x700 =
        27.1% frame width, vertically centered) EMPTY — no copy, no glyphs —
        because pip_takeover.py composites the shrunken face PiP (a rounded
        4:5-ish card) there. Suggested settled card INSIDE that region:
        (150, 228, 500, 625) (exact 4:5). NOTE pip_takeover's module RESERVED /
        DEFAULT_CARD constants are the RIGHT-side glass-takeover-bg rect; using
        this template needs the left rect above passed/keyed per-template
        (see the geometry note in the template's build report / PRODUCER_PLAN).
        Changing this rect means changing that geometry in lock-step.
      - The white base is OPAQUE from frame 0 (no flash of the base video at the
        takeover seam); only the seat shadow, title and items settle in.
      - title / item1..8 / at1..8 / accentColor are `data-composition-variables`.
        An EMPTY itemN never appears; empty title = no title (items still land).
        atN = transcript time of the spoken beat, relative to the overlay's
        outStart. Items land center-aligned under the title, newest one mid-fade
        (sheet_42 grammar: item fades+rises ~250ms at atN).
      - UNSET everything renders the PREVIEW SAMPLE only (glass-rail G21
        pattern): demo content activates when title AND item1..8 are ALL unset;
        any plan that sets one field gets exactly its fields — no sample leak.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it). Make it comfortably
        past the last atN.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · canvas-pip-list</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;             /* opaque — this comp owns the whole frame */
        font-family: var(--font);
      }
      #cpl-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Full-bleed studio white on a CHILD (never the root) — the producer's
         frame compositing can drop the root's own background (frame renders
         black). */
      #cpl-bg { position: absolute; inset: 0; background: #ffffff; }

      /* Soft seat shadow grounding the reserved PiP region — edgeless radial
         (no crisp rect) so a slightly different card rect still sits fine.
         Centered on the reserved region's center (400, 540). */
      #cpl-seat {
        position: absolute;
        left: 20px; top: 60px;
        width: 760px; height: 960px;
        background: radial-gradient(closest-side,
          rgba(24, 34, 56, 0.10) 0%, rgba(24, 34, 56, 0.05) 45%,
          rgba(24, 34, 56, 0) 72%);
        will-change: opacity;
      }

      /* Right column — centered on x=1290 (mid of the non-reserved right half). */
      #cpl-col {
        position: absolute;
        left: 700px; top: 0;
        width: 1180px; height: 1080px;
      }
      #cpl-title {
        position: absolute;
        left: 0; top: 186px;
        width: 1180px;
        text-align: center;
        color: var(--accent);
        font-weight: 800;
        font-size: 66px;
        line-height: 1.08;
        letter-spacing: -0.015em;
        will-change: transform, opacity;
      }
      .cpl-item {
        position: absolute;
        left: 90px;
        width: 1000px;
        text-align: center;
        color: #4a4f57;
        font-weight: 600;
        font-size: 40px;
        line-height: 1.2;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="cpl-root"
      data-composition-id="canvas-pip-list"
      data-width="1920"
      data-height="1080"
      data-duration="16"
    >
      <div id="cpl-bg"></div>
      <div id="cpl-seat" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      <div id="cpl-col">
        <div id="cpl-title" class="clip" data-start="0" data-duration="60" data-track-index="2"></div>
        <div class="cpl-item clip" id="cpl-item-1" data-start="0" data-duration="60" data-track-index="3"></div>
        <div class="cpl-item clip" id="cpl-item-2" data-start="0" data-duration="60" data-track-index="4"></div>
        <div class="cpl-item clip" id="cpl-item-3" data-start="0" data-duration="60" data-track-index="5"></div>
        <div class="cpl-item clip" id="cpl-item-4" data-start="0" data-duration="60" data-track-index="6"></div>
        <div class="cpl-item clip" id="cpl-item-5" data-start="0" data-duration="60" data-track-index="7"></div>
        <div class="cpl-item clip" id="cpl-item-6" data-start="0" data-duration="60" data-track-index="8"></div>
        <div class="cpl-item clip" id="cpl-item-7" data-start="0" data-duration="60" data-track-index="9"></div>
        <div class="cpl-item clip" id="cpl-item-8" data-start="0" data-duration="60" data-track-index="10"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("cpl-root");
        const D = parseFloat(root.dataset.duration) || 16;

        // All content defaults are EMPTY: an unset item renders NOTHING (G21).
        const defaults = {
          title: "",
          item1: "", item2: "", item3: "", item4: "",
          item5: "", item6: "", item7: "", item8: "",
          at1: 0.6, at2: 2.4, at3: 4.2, at4: 6.0,
          at5: 7.8, at6: 9.6, at7: 11.4, at8: 13.2,
          accentColor: "#054BC9",
        };
        // PREVIEW-ONLY demo content (the "8 Doors" reference beat itself,
        // sheet_42). Activates ONLY when title AND every itemN are unset.
        const SAMPLE = {
          title: "We call the 8 Doors",
          item1: "How to", item2: "Why", item3: "Diagnostic", item4: "Framework",
          item5: "Mistake", item6: "Breakdown", item7: "Reframe",
          item8: "Consequence",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = ["title", "item1", "item2", "item3", "item4",
                             "item5", "item6", "item7", "item8"];
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);
        document.documentElement.style.setProperty("--accent", vars.accentColor);

        // Title (empty = no title; items still land).
        const titleEl = document.getElementById("cpl-title");
        const titleText = (vars.title == null ? "" : String(vars.title)).trim();
        if (titleText) titleEl.textContent = titleText;
        else titleEl.remove();

        // Fill / prune the eight static item slots; drop empties, then stack the
        // kept ones downward from the title (sheet_42 rhythm: pitch 78px).
        const ITEM_TOP = 322;
        const ITEM_PITCH = 78;
        const active = [];
        for (let n = 1; n <= 8; n++) {
          const el = document.getElementById("cpl-item-" + n);
          const text = (vars["item" + n] == null ? "" : String(vars["item" + n])).trim();
          if (!text) { el.remove(); continue; }
          el.textContent = text;
          const at = Number(vars["at" + n]);
          active.push({ el: el, at: isFinite(at) ? at : 0.6 });
        }
        active.forEach(function (a, i) {
          a.el.style.top = (ITEM_TOP + i * ITEM_PITCH) + "px";
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // White base is opaque from frame 0; seat shadow + title settle in.
        tl.set("#cpl-seat", { opacity: 0 }, 0);
        tl.to("#cpl-seat", { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.05);
        if (titleText) {
          tl.set(titleEl, { opacity: 0, y: -14, scale: 0.97 }, 0);
          tl.to(titleEl, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power2.out" }, 0.12);
        }

        // One item per spoken beat: fade+rise ~250ms at atN (sheet_42 grammar —
        // the newest item reads mid-fade). Un-landed items stay INVISIBLE.
        active.forEach(function (a) {
          const at = Math.max(0.15, Math.min(a.at, D - 0.35));
          tl.set(a.el, { opacity: 0, y: 16 }, 0);
          tl.to(a.el, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at);
        });

        // No self fade-out: own-screen takeover holds; the compositor owns both seams.
        tl.seek(0);
        window.__timelines["canvas-pip-list"] = tl;
      })();
    </script>
  </body>
</html>
