<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title1","type":"string","label":"Card 1 title (empty = omit)","default":"Ideation"},
    {"id":"time1","type":"string","label":"Card 1 time / sublabel","default":"8-10am"},
    {"id":"color1","type":"color","label":"Card 1 color (semantic)","default":"#2FBF71"},
    {"id":"title2","type":"string","label":"Card 2 title (empty = omit)","default":"Filming"},
    {"id":"time2","type":"string","label":"Card 2 time / sublabel","default":"10-2pm"},
    {"id":"color2","type":"color","label":"Card 2 color (semantic)","default":"#3B82F6"},
    {"id":"title3","type":"string","label":"Card 3 title (empty = omit)","default":"Distribution"},
    {"id":"time3","type":"string","label":"Card 3 time / sublabel","default":"2-3pm"},
    {"id":"color3","type":"color","label":"Card 3 color (semantic)","default":"#F2724B"},
    {"id":"title4","type":"string","label":"Card 4 title (empty = omit)","default":""},
    {"id":"time4","type":"string","label":"Card 4 time / sublabel","default":""},
    {"id":"color4","type":"color","label":"Card 4 color (semantic)","default":"#7C5CF0"},
    {"id":"side","type":"enum","label":"Anchor side (opposite the subject)","default":"right","options":[{"value":"left","label":"Left"},{"value":"right","label":"Right"}]},
    {"id":"accent","type":"color","label":"Accent (unused fill fallback)","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: SCHEDULE-STACK (NEW — deep-pass correction,
    REFERENCE_STYLE_STUDY R9 "schedule-stack" pattern + "Template corrections
    queued" #2). Observed in ref-2: color-SEMANTIC rounded cards (green Ideation /
    blue Filming / coral Distribution) with serif-bold titles + small time
    sublabels, stacked on the side OPPOSITE the speaker, staggered wipe-in.
    Trigger it serves: a routine / schedule / phased-plan beat — a stack of
    time-blocked cards that reads as a day/workflow.
    ALPHA 1080x1920 overlay -> render with `--format mov` (ProRes 4444). The stack
    hugs one side; the face stays clear on the other (R3/R10).

    CONTRACT for the PRODUCER compositing stage:
      - Up to 4 cards: titleN / timeN / colorN. An empty titleN OMITS that card and
        the stack re-centers. colorN is the card's SEMANTIC fill (default
        green/blue/coral/violet). side picks the anchored side (opposite the
        subject); accent is a fallback fill only.
      - Cards WIPE in from the anchored side, staggered (R9, ~100-170ms entrances),
        then hold; the whole stack fades out at D. Pure fns of timeline time.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (see stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · schedule-stack</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — cards over the head */
        font-family: var(--font);
      }
      #sk-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* Side-anchored vertical stack in the upper/headroom band. JS sets left/right. */
      #sk-stack {
        position: absolute;
        top: 300px;
        width: 470px;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .sk-card {
        border-radius: 26px;
        padding: 30px 34px;
        box-shadow: 0 18px 44px rgba(10, 26, 77, 0.32), inset 0 2px 0 rgba(255, 255, 255, 0.22);
        will-change: transform, opacity;
      }
      .sk-title {
        font-family: var(--font-serif-accent, "Georgia", "Times New Roman", "Times", serif);
        font-weight: 700;
        font-size: 58px;
        line-height: 1.0;
        letter-spacing: -0.01em;
        color: #FFFFFF;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
      }
      .sk-time {
        margin-top: 8px;
        font-weight: 700;
        font-size: 32px;
        line-height: 1;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <div
      id="sk-root"
      data-composition-id="schedule-stack"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="3.5"
    >
      <div id="sk-stack">
        <div id="sk-card-1" class="sk-card clip" data-slot="1" data-start="0" data-duration="60" data-track-index="1">
          <div class="sk-title"></div><div class="sk-time"></div>
        </div>
        <div id="sk-card-2" class="sk-card clip" data-slot="2" data-start="0" data-duration="60" data-track-index="2">
          <div class="sk-title"></div><div class="sk-time"></div>
        </div>
        <div id="sk-card-3" class="sk-card clip" data-slot="3" data-start="0" data-duration="60" data-track-index="3">
          <div class="sk-title"></div><div class="sk-time"></div>
        </div>
        <div id="sk-card-4" class="sk-card clip" data-slot="4" data-start="0" data-duration="60" data-track-index="4">
          <div class="sk-title"></div><div class="sk-time"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("sk-root");
        const D = parseFloat(root.dataset.duration) || 3.5;

        const defaults = {
          title1: "Ideation", time1: "8-10am", color1: "#2FBF71",
          title2: "Filming", time2: "10-2pm", color2: "#3B82F6",
          title3: "Distribution", time3: "2-3pm", color3: "#F2724B",
          title4: "", time4: "", color4: "#7C5CF0",
          side: "right", accent: "#054BC9",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        // Side anchor (R10): stack hugs left or right; wipe direction follows.
        const right = String(vars.side) === "right";
        const stack = document.getElementById("sk-stack");
        if (right) { stack.style.right = "70px"; } else { stack.style.left = "70px"; }
        const wipeFrom = right ? 60 : -60;      // px — wipe in from the anchored side

        // Fill / prune the four cards; an empty titleN drops that card.
        const cards = Array.prototype.slice.call(document.querySelectorAll(".sk-card"));
        const active = [];
        cards.forEach(function (card, i) {
          const n = i + 1;
          const title = (vars["title" + n] == null ? "" : String(vars["title" + n])).trim();
          if (!title) { card.remove(); return; }
          card.querySelector(".sk-title").textContent = title;
          const time = (vars["time" + n] == null ? "" : String(vars["time" + n])).trim();
          const timeEl = card.querySelector(".sk-time");
          if (time) timeEl.textContent = time; else timeEl.remove();
          const color = String(vars["color" + n] || vars.accent);
          // Semantic card: a soft vertical wash of its own color (not flat) for depth.
          card.style.background = "linear-gradient(160deg, " + color + " 0%, " +
            "rgba(0,0,0,0.16) 220%)";
          active.push(card);
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Cards wipe in from the anchored side, staggered (R9).
        const STAGGER = 0.13;
        active.forEach(function (card, i) {
          const at = i * STAGGER;
          const land = Math.min(at, Math.max(0, D - 0.6));
          tl.fromTo(card, { opacity: 0, x: wipeFrom, scale: 0.96 },
            { opacity: 1, x: 0, scale: 1, duration: 0.44, ease: "back.out(1.5)" }, land);
        });

        // Fade the whole stack out — ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.16);
        tl.to("#sk-stack", { opacity: 0, y: -14, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["schedule-stack"] = tl;
      })();
    </script>
  </body>
</html>
