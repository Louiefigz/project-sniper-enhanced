<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"item1","type":"string","label":"List item 1","default":"Post more"},
    {"id":"item2","type":"string","label":"List item 2 (empty = omit)","default":"Save time"},
    {"id":"item3","type":"string","label":"List item 3 (empty = omit)","default":"Make more money"},
    {"id":"at1","type":"number","label":"Item 1 land time (s)","default":0.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Item 2 land time (s)","default":0.9,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Item 3 land time (s)","default":1.6,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"chip_style","type":"enum","label":"Chip glyph","default":"check","options":[{"value":"check","label":"Checkmark"},{"value":"number","label":"Number"}]},
    {"id":"accent","type":"color","label":"Accent color","default":"#054BC9"},
    {"id":"build","type":"enum","label":"Build grammar","default":"pop","options":[{"value":"pop","label":"Pop (back.out slide, unchanged)"},{"value":"skeleton-first","label":"Skeleton-first (row shells before text — MODULE rank 2)"}]}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: LIST-BUILD (MG-1)
    Trigger it serves: enumerations ("three things you need", "post more / save time / make more money").
    Transparent 1080x1920 overlay -> render with `--format mov` (ProRes 4444) for alpha.

    CONTRACT for the PRODUCER compositing stage:
      - CONTENT (item1..3), PER-ITEM LAND TIMES (at1..3, seconds), chip_style, and
        accent are `data-composition-variables` — fill with --variables. The land
        times are how items sync to spoken words: set atN to the transcript time of
        the word (relative to the overlay's outStart).
      - An empty itemN string OMITS that row (the stack re-centers to the remaining rows).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (see stat-card note) — set it
        directly per render; the framework ignores --variables for root duration.
        Make it comfortably past at3 so the last item lands + holds before the fade.
      - MODULE opt-in (docs/studies/MODULE_STUDY.md rank 2; default keeps the pop
        build byte-identical): build:"skeleton-first" — each row's card SHELL
        + chip opacity-ramp at atN, the row TEXT ramps in place
        +SKELETON_GAP_S (0.35s) later (containers/hairlines before text).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · list-build</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #list-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* .stage OWNS the centering transform (x=495 visual center, free-band center).
         .stack is a plain flex column so GSAP can drift/fade it without clobbering
         the centering transform. */
      .stage {
        position: absolute;
        left: var(--visual-center-x);
        top: 855px;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
      }
      #list-stack {
        display: flex;
        flex-direction: column;
        gap: 26px;
        align-items: stretch;
        will-change: transform, opacity;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 26px;
        width: 764px;
        max-width: var(--safe-width);
        background: var(--card-bg);
        border-radius: 24px;
        padding: 22px 30px;
        box-shadow: var(--card-shadow);
        will-change: transform, opacity;
      }
      .chip {
        flex: 0 0 auto;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        font-size: 42px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }
      .row-text {
        font-weight: 700;
        font-size: 54px;
        line-height: 1.04;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div
      id="list-root"
      data-composition-id="list-build"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="3.5"
    >
      <div class="stage">
        <div id="list-stack">
          <div id="list-row-1" class="row clip" data-slot="1" data-start="0" data-duration="60" data-track-index="1">
            <span class="chip"></span><span class="row-text"></span>
          </div>
          <div id="list-row-2" class="row clip" data-slot="2" data-start="0" data-duration="60" data-track-index="2">
            <span class="chip"></span><span class="row-text"></span>
          </div>
          <div id="list-row-3" class="row clip" data-slot="3" data-start="0" data-duration="60" data-track-index="3">
            <span class="chip"></span><span class="row-text"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("list-root");
        const D = parseFloat(root.dataset.duration) || 3.5;

        const defaults = {
          item1: "Post more", item2: "Save time", item3: "Make more money",
          at1: 0.2, at2: 0.9, at3: 1.6, chip_style: "check", accent: "#054BC9",
          build: "pop",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        const CHECK = "✓"; // ✓
        const items = [
          { text: vars.item1, at: Number(vars.at1) },
          { text: vars.item2, at: Number(vars.at2) },
          { text: vars.item3, at: Number(vars.at3) },
        ];

        // Fill / prune the three static rows; drop empties before the timeline is built.
        const rows = Array.prototype.slice.call(document.querySelectorAll(".row"));
        const active = [];
        rows.forEach(function (row, i) {
          const it = items[i];
          const text = (it.text == null ? "" : String(it.text)).trim();
          if (!text) { row.remove(); return; }
          row.querySelector(".row-text").textContent = text;
          row.querySelector(".chip").textContent = vars.chip_style === "number" ? String(i + 1) : CHECK;
          active.push({ row: row, chip: row.querySelector(".chip"),
                        text: row.querySelector(".row-text"),
                        at: isFinite(it.at) ? it.at : 0.2 });
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const M = window.__motionTokens;
        const skeleton = String(vars.build) === "skeleton-first";

        active.forEach(function (a) {
          const at = Math.max(0, Math.min(a.at, D - 0.5)); // keep the entrance inside the render
          if (skeleton) {
            // MODULE rank 2: card shell + chip land, row text +0.35s later —
            // both in-place opacity ramps (rank 4, no travel).
            M.skeletonFirst(tl, a.row, a.text, { at: at });
            return;
          }
          // Hidden state pinned at t=0 so opacity is a pure function of timeline time.
          tl.set(a.row, { opacity: 0, x: -46, scale: 0.9 }, 0);
          tl.set(a.chip, { scale: 0.2 }, 0);
          tl.to(a.row, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at);
          tl.to(a.chip, { scale: 1, duration: 0.44, ease: "back.out(2.4)" }, at + 0.08);
        });

        // Fade the whole stack out — ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.18);
        tl.to("#list-stack", { opacity: 0, y: -16, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["list-build"] = tl;
      })();
    </script>
  </body>
</html>
