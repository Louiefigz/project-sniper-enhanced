<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"iconFile","type":"string","label":"Brand mark file under /icons (e.g. notion.svg)","default":"notion.svg"},
    {"id":"accent","type":"color","label":"Accent (faint glow behind the mark)","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: LOGO-CARD (batch 2, from the edited
    long-form's "logo / brand card" treatment — LONGFORM_VISUAL_STUDY §3,
    reference frame 331.5s in validate_graphics.jpg: the Notion "N" full-frame).
    Trigger it serves: naming a specific TOOL being replaced ("5 tools" beat) — a
    clean white full-frame takeover with a single centered brand mark that pops.
    OPAQUE 1920x1080 -> render with `--format mp4` (H.264, anchor "own-screen"):
    it REPLACES the frame for its window.

    CONTRACT for the PRODUCER + graphics_stage:
      - iconFile is a file under templates/motion/icons/ (bare name gets .svg;
        a leading "/" is used as-is) — real marks only (R12, emoji-free).
      - accent drives ONLY a very faint radial glow behind the mark; the field
        stays clean white (matches the reference). The white field lives on a
        full-bleed CHILD (never the root) and is OPAQUE from frame 0, so the
        compositor's frame handling can drop the root's own background at the
        takeover seam without flashing the base video underneath.
      - Entrance: soft pop (scale + fade, back.out); HOLDS to the end (an opaque
        takeover holds its window; the compositor owns the in/out seam).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · logo-card</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #logo-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Full-bleed white field on a CHILD (never the root) — opaque from frame 0
         so the takeover seam never flashes the base video. */
      #logo-bg { position: absolute; inset: 0; background: #ffffff; }
      /* Barely-there accent radial behind the mark — lifts it off flat white. */
      #logo-glow {
        position: absolute; inset: 0;
        background: radial-gradient(760px 760px at 960px 540px,
          var(--accent) 0%, rgba(255,255,255,0) 62%);
        opacity: 0.06;
        will-change: opacity;
      }
      #logo-wrap {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #logo-icon {
        width: 360px; height: 360px;
        object-fit: contain;
        display: block;
        will-change: transform, opacity;
        filter: drop-shadow(0 14px 34px rgba(10, 26, 77, 0.14));
      }
    </style>
  </head>
  <body>
    <div
      id="logo-root"
      data-composition-id="logo-card"
      data-width="1920"
      data-height="1080"
      data-duration="3"
    >
      <div id="logo-bg"></div>
      <div id="logo-glow" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      <div id="logo-wrap">
        <img id="logo-icon" class="clip" alt="" data-start="0" data-duration="60" data-track-index="2" />
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("logo-root");
        const D = parseFloat(root.dataset.duration) || 3;

        const defaults = { iconFile: "notion.svg", accent: "#054BC9" };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        // Icon path resolution — same rule as glass-rail: bare name -> /icons/name.svg.
        function iconSrc(raw) {
          const v = (raw == null ? "" : String(raw)).trim();
          if (!v) return "";
          if (v.charAt(0) === "/") return v;
          return "/icons/" + (v.indexOf(".") >= 0 ? v : v + ".svg");
        }
        document.getElementById("logo-icon").src = iconSrc(vars.iconFile);

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Glow settles, mark pops in (soft). Field is opaque from frame 0.
        tl.set("#logo-glow", { opacity: 0 }, 0);
        tl.to("#logo-glow", { opacity: 0.06, duration: 0.5, ease: "power2.out" }, 0.05);
        tl.fromTo("#logo-icon", { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 0.08);
        // HOLDS to the end — opaque takeover; compositor owns the seam.

        tl.seek(0);
        window.__timelines["logo-card"] = tl;
      })();
    </script>
  </body>
</html>
