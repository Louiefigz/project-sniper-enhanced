<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow microtext (mono caps + accent dot; empty = omit)","default":""},
    {"id":"eyebrowAccent","type":"enum","label":"Eyebrow dot semantic accent","default":"result","options":[{"value":"result","label":"Result (lime)"},{"value":"process","label":"Process (cyan)"}]},
    {"id":"headlineLines","type":"string","label":"Thesis headline, pipe-separated lines (2 max; line 2 in --accent-result)","default":""},
    {"id":"explainer","type":"string","label":"1-2 line gray explainer (empty = omit)","default":""},
    {"id":"nodes","type":"string","label":"Pipeline nodes, pipe-separated: num~label (2-8 tiles)","default":""},
    {"id":"activeIndex","type":"number","label":"Active node (1-based, cyan you-are-here dot; 0 = none)","default":0,"min":0,"max":8,"step":1},
    {"id":"footChip","type":"string","label":"Source footnote chip (mono + dot, lands last; empty = omit)","default":""},
    {"id":"footAccent","type":"enum","label":"Footnote dot accent","default":"result","options":[{"value":"result","label":"Result (lime)"},{"value":"process","label":"Process (cyan)"},{"value":"warn","label":"Warn (amber — limits/failures ONLY)"}]},
    {"id":"moduleLands","type":"string","label":"Narration-paced lands (s, comp-relative, pipe/comma) — one per PRESENT module [head, chain, foot]; empty = 0.2 + k*0.9","default":""},
    {"id":"exit","type":"enum","label":"Exit","default":"hold","options":[{"value":"hold","label":"Hold to end (compositor owns the seam)"},{"value":"blur-recede","label":"Blur-recede 0.15s (stage only — the canvas never flashes)"}]},
    {"id":"presenterFrame","type":"boolean","label":"Framed presenter container: mask the reserved right band into a rounded face hole + draw the card ring (compositor fills it with the speaker; forces alpha + longform own-screen)","default":false}
  ]'
>
  <!--
    PROJECT SNIPER · LONG-FORM template: NATEHERK-PIPELINE (16:9, 1920x1080)
    Reference: docs/studies/NATEHERK_CARDS.md §1.2 form #18 — horizontal node pipeline
    (DARK chassis), 169.5-179.5s:
      `• ONE INSTRUCTION TO FINISHED VIDEO / The chain changed. The outcome
      held.(lime)`; 6 connected tiles `01 PROMPT -> 02 ELEVENLABS VOICE ->
      03 HEYGEN AVATAR V -> 04 HYPERFRAMES EDIT -> 05 INDEPENDENT QA (active
      cyan dot) -> 06 FINISHED VIDEO`. Build: tile-by-tile along the chain.
    Info pattern: linear pipeline w/ active-node marker — "the whole chain in
    one glance, you-are-here dot" (§1.4 process summary). Evidence: contact
    sheet state 047_t0169.5 (sentence-case headline, mono tile labels, node
    05 carries the cyan dot). Timing +-1 frame (~40ms); N=1 priors.

    NOTE — dated vertical timeline (form #6): NOT here. The cream chassis
    owns it (nateherk-rail contentMode:"timeline"), matching the reference
    (form #6 is a CREAM card). This comp stays the dark process-summary lane.

    CONTRACT for the PRODUCER compositing stage:
      - anchor "own-screen" OPAQUE takeover (render --format mp4): near-black
        canvas + faint 96px grid on a full-bleed CHILD, opaque from frame 0.
      - NO FACE HOLE this wave (STUDY §5 item 9 "PIP slot EXCLUDED"
        precedent); the content column matches nateherk-takeover's stage
        (left 96px, width 1130px) so the right band [1344..1878] stays clear
        for a later pip_hole registration with zero content reflow.
      - The active node is PROCESS cyan (--accent-process — a "you are here"
        status, STUDY §3 rank 6); headline line 2 is result lime (rank 5).
        activeIndex out of [0, nodeCount] FAILS LOUDLY.
      - Build (§1.3): eyebrow-first -> ghost-resolve headline -> tiles land
        tile-by-tile along the chain at NODE_STAGGER_S=0.15 (keeps a 6-tile
        chain inside the §1.3 "time to fully-built ~1.2-2s" envelope) ->
        footnote chip lands LAST (provenance module).
      - moduleLands: one land per PRESENT module in order [head, chain,
        foot]. Count mismatch FAILS LOUDLY. Empty = 0.2 + k*0.9.
      - UNSET content renders NOTHING (G21); the SAMPLE (form #18 verbatim)
        activates only when EVERY content variable is unset.
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - exit:"blur-recede" (T-D): stage only; the canvas stays opaque.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · nateherk-pipeline</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #npl-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #npl-stage-layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }

      #npl-canvas {
        position: absolute; inset: 0;
        background-color: var(--nateherk-canvas, #0c1014);
        background-image:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 96px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 96px);
      }

      /* FRAMED PRESENTER-CONTAINER (opt-in: spec.presenterFrame). When the
         root carries .has-presenter, mask the canvas out of the reserved right
         band into a rounded hole (SVG evenodd) the compositor fills with the
         speaker's face, and draw #npl-face-slot as the card ring. Geometry is
         copied VERBATIM from nateherk-takeover and MUST equal
         graphics.pip_hole.HOLE_BY_KIND["nateherk-pipeline"] (1344,60,534,960,
         r24). WITHOUT the class the canvas is opaque — renders exactly as before. */
      #npl-root.has-presenter #npl-canvas {
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
      }
      #npl-face-slot { display: none; }
      #npl-root.has-presenter #npl-face-slot {
        display: block;
        position: absolute;
        left: 1344px; top: 60px; width: 534px; height: 960px;
        border-radius: 24px;
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.10);
      }

      /* Content column — nateherk-takeover stage geometry (PIP band clear). */
      #npl-stage {
        position: absolute;
        left: 96px; top: 0; width: 1130px; height: 1080px;
        padding: 96px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 44px;
      }
      .module { will-change: opacity; }

      #npl-eyebrow {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 34px; line-height: 1;
        letter-spacing: 5px; text-transform: uppercase;
        color: var(--accent-result, #c6f542);
      }
      #npl-eyebrow .dot {
        width: 13px; height: 13px; border-radius: 50%;
        background: var(--accent-result, #c6f542);
        flex: 0 0 auto;
      }
      #npl-eyebrow.process, #npl-eyebrow.process .dot { color: var(--accent-process, #35b6d9); }
      #npl-eyebrow.process .dot { background: var(--accent-process, #35b6d9); }

      #npl-headline {
        font-weight: 900;
        font-size: 110px;
        line-height: 1.05;
        letter-spacing: -2px;
        color: #ffffff;
      }
      #npl-headline .line { display: block; will-change: opacity; }
      #npl-headline .l2 { color: var(--accent-result, #c6f542); }

      #npl-explainer {
        font-weight: 500; font-size: 34px; line-height: 1.35;
        color: rgba(255, 255, 255, 0.6);
        max-width: 900px;
      }

      /* The chain: equal-width connected tiles; hairline links between. */
      #npl-chain {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 18px;
      }
      .npl-node {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
        padding: 18px 16px 16px;
        display: flex; flex-direction: column; gap: 10px;
        will-change: opacity;
      }
      .npl-node:not(:last-child)::after {   /* the connector segment */
        content: "";
        position: absolute; right: -18px; top: 50%;
        width: 18px; height: 1px;
        background: rgba(255, 255, 255, 0.22);
      }
      .npl-node .numrow { display: flex; align-items: center; gap: 10px; }
      .npl-node .num {
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 17px;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.45);
      }
      .npl-node .label {
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 22px; line-height: 1.25;
        letter-spacing: 1px; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.88);
        overflow-wrap: break-word;
      }
      /* Active node — the cyan "you are here" marker (form #18 node 05). */
      .npl-node.active { border-color: color-mix(in srgb, var(--accent-process, #35b6d9) 60%, transparent); }
      .npl-node.active .activedot {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent-process, #35b6d9);
        flex: 0 0 auto;
      }
      .npl-node.active .label { color: #ffffff; }

      #npl-foot {
        align-self: flex-start;
        display: flex; align-items: center; gap: 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 14px 20px;
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 21px;
        letter-spacing: 3px; text-transform: uppercase;
        color: var(--receipt-gray, rgba(255, 255, 255, 0.72));
      }
      #npl-foot .dot {
        width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
        background: var(--accent-result, #c6f542);
      }
      #npl-foot.process .dot { background: var(--accent-process, #35b6d9); }
      #npl-foot.warn .dot { background: var(--accent-warn, #e8a13c); }
    </style>
  </head>
  <body>
    <div
      id="npl-root"
      data-composition-id="nateherk-pipeline"
      data-width="1920"
      data-height="1080"
      data-duration="9"
    >
      <div id="npl-canvas"></div>
      <div id="npl-stage-layer">
        <div id="npl-stage">
          <div id="npl-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="npl-eyebrow-text"></span></div>
          <div id="npl-headline" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="npl-explainer" class="module clip" data-start="0" data-duration="60" data-track-index="3"></div>
          <div id="npl-chain" class="module clip" data-start="0" data-duration="60" data-track-index="4"></div>
          <div id="npl-foot" class="module clip" data-start="0" data-duration="60" data-track-index="5"><span class="dot"></span><span id="npl-foot-text"></span></div>
        </div>
      </div>
      <div id="npl-face-slot"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("npl-root");
        const D = parseFloat(root.dataset.duration) || 9;
        const M = window.__motionTokens;

        // Build constants:
        const LINE_STAGGER_S = 0.12;   // headline per-line ramp stagger
        const NODE_STAGGER_S = 0.15;   // tile-by-tile along the chain —
                                       // 6 tiles in 0.9s keeps the build in
                                       // the §1.3 ~1.2-2s fully-built band
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9;

        const defaults = {
          eyebrow: "", eyebrowAccent: "result", headlineLines: "",
          explainer: "", nodes: "", activeIndex: 0,
          footChip: "", footAccent: "result",
          moduleLands: "", exit: "hold", presenterFrame: false,
        };
        const CONTENT_KEYS = ["eyebrow", "headlineLines", "explainer",
          "nodes", "footChip"];
        // PREVIEW-ONLY demo — form #18 verbatim (169.5-179.5s).
        const SAMPLE = {
          eyebrow: "ONE INSTRUCTION TO FINISHED VIDEO",
          headlineLines: "The chain changed.|The outcome held.",
          nodes: "01~PROMPT|02~ELEVENLABS VOICE|03~HEYGEN AVATAR V|" +
            "04~HYPERFRAMES EDIT|05~INDEPENDENT QA|06~FINISHED VIDEO",
          activeIndex: 5,
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        // Framed presenter container: opt-in mask + ring (mirrors how the
        // comp reads exit). The canvas mask + #npl-face-slot ring are scoped
        // to .has-presenter; absent it the card renders opaque as before.
        if (vars.presenterFrame === true || String(vars.presenterFrame) === "true") {
          root.classList.add("has-presenter");
        }

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }

        // ---- Fill / prune modules (unset content renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("npl-eyebrow");
        if (ebText) {
          document.getElementById("npl-eyebrow-text").textContent = ebText;
          if (str("eyebrowAccent") === "process") ebEl.classList.add("process");
        } else { ebEl.remove(); }

        const headEl = document.getElementById("npl-headline");
        const heads = str("headlineLines");
        if (heads) {
          const lines = heads.split("|").map(function (s) { return s.trim(); });
          if (lines.length > 2) {
            throw new Error("nateherk-pipeline: headlineLines is 2 lines max " +
              "(§1.1 thesis grammar), got " + lines.length);
          }
          lines.forEach(function (line, j) {
            const el = document.createElement("span");
            el.className = "line" + (j === 1 ? " l2" : "");
            el.textContent = line;
            headEl.appendChild(el);
          });
        } else { headEl.remove(); }

        const expText = str("explainer");
        const expEl = document.getElementById("npl-explainer");
        if (expText) expEl.textContent = expText;
        else expEl.remove();

        // The chain: num~label tiles, 2-8; activeIndex bounds fail loudly.
        const chainEl = document.getElementById("npl-chain");
        const nodesRaw = str("nodes");
        const nodeEls = [];
        if (nodesRaw) {
          const lines = nodesRaw.split("|");
          if (lines.length < 2 || lines.length > 8) {
            throw new Error("nateherk-pipeline: nodes needs 2-8 tiles, got " +
              lines.length);
          }
          const activeRaw = vars.activeIndex;
          const activeIndex = (activeRaw == null || String(activeRaw).trim() === "")
            ? 0 : Number(activeRaw);
          if (!isFinite(activeIndex) || activeIndex < 0 ||
              activeIndex > lines.length || activeIndex % 1 !== 0) {
            throw new Error("nateherk-pipeline: activeIndex must be an " +
              "integer in [0," + lines.length + "], got '" +
              vars.activeIndex + "'");
          }
          lines.forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length !== 2 || !f[0] || !f[1]) {
              throw new Error("nateherk-pipeline: node " + (i + 1) +
                " needs num~label, got '" + line + "'");
            }
            const node = document.createElement("div");
            node.className = "npl-node" + (i + 1 === activeIndex ? " active" : "");
            const numrow = document.createElement("div");
            numrow.className = "numrow";
            const num = document.createElement("span");
            num.className = "num";
            num.textContent = f[0];
            numrow.appendChild(num);
            if (i + 1 === activeIndex) {
              const dot = document.createElement("span");
              dot.className = "activedot";
              numrow.appendChild(dot);
            }
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = f[1];
            node.appendChild(numrow);
            node.appendChild(label);
            chainEl.appendChild(node);
            nodeEls.push(node);
          });
        } else { chainEl.remove(); }

        const footText = str("footChip");
        const footEl = document.getElementById("npl-foot");
        if (footText) {
          document.getElementById("npl-foot-text").textContent = footText;
          const fa = str("footAccent") || "result";
          if (fa === "process" || fa === "warn") footEl.classList.add(fa);
          else if (fa !== "result") {
            throw new Error("nateherk-pipeline: footAccent '" + fa +
              "' not in result|process|warn");
          }
        } else { footEl.remove(); }

        // ---- Narration-paced lands ([head, chain, foot]) ----
        const modules = [];
        if (ebText || heads || expText) modules.push("head");
        if (nodeEls.length) modules.push("chain");
        if (footText) modules.push("foot");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("nateherk-pipeline: moduleLands needs " +
              modules.length + " finite times for modules [" +
              modules.join(", ") + "], got '" + landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build (eyebrow-first -> headline -> tile-by-tile -> foot) ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        if (landOf.head != null) {
          const t0 = landOf.head;
          let headAt = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            headAt = t0 + M.EYEBROW_LEAD_S;     // eyebrow leads (rank 3)
          }
          let lastAt = headAt;
          if (heads) {
            headEl.querySelectorAll(".line").forEach(function (lineEl, j) {
              lastAt = headAt + j * LINE_STAGGER_S;
              M.textRamp(tl, lineEl, lastAt);   // in-place ghost-resolve
            });
          }
          if (expText) M.textRamp(tl, expEl, lastAt + LINE_STAGGER_S);
        }

        // Tiles land tile-by-tile along the chain (form #18 build).
        if (landOf.chain != null) {
          M.textRamp(tl, chainEl, landOf.chain);
          nodeEls.forEach(function (el, i) {
            M.textRamp(tl, el, landOf.chain + i * NODE_STAGGER_S);
          });
        }

        // Footnote chip lands LAST (provenance module, §1.3).
        if (landOf.foot != null) M.textRamp(tl, footEl, landOf.foot);

        // exit:"blur-recede" (T-D): stage only; the canvas stays opaque.
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#npl-stage-layer", D - M.EXIT_BLUR_S);
        }

        tl.seek(0);
        window.__timelines["nateherk-pipeline"] = tl;
      })();
    </script>
  </body>
</html>
