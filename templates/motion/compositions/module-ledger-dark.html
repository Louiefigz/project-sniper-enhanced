<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow microtext (mono caps + square accent marker; empty = omit)","default":""},
    {"id":"eyebrowAccent","type":"enum","label":"Eyebrow marker semantic accent","default":"process","options":[{"value":"process","label":"Process (blue)"},{"value":"result","label":"Result (amber)"}]},
    {"id":"headlineLines","type":"string","label":"Thesis headline, pipe-separated lines (2 max; line 2 in --accent-result)","default":""},
    {"id":"explainer","type":"string","label":"1-2 line gray explainer (empty = omit)","default":""},

    {"id":"grid","type":"enum","label":"Fan-out shape (numbered chips or parallel columns)","default":"chips","options":[{"value":"chips","label":"Numbered chip row (num + label + square marker)"},{"value":"columns","label":"Parallel columns (num over label, result-amber underline)"}]},
    {"id":"gridItems","type":"string","label":"Fan-out items, pipe-separated: num~label (empty = no fan-out)","default":""},
    {"id":"footChip","type":"string","label":"Source footnote chip (mono + square marker, lands last; empty = omit)","default":""},
    {"id":"footAccent","type":"enum","label":"Footnote marker accent","default":"result","options":[{"value":"result","label":"Result (amber)"},{"value":"process","label":"Process (blue)"},{"value":"warn","label":"Warn (red — limits/failures ONLY)"}]},
    {"id":"moduleLands","type":"string","label":"Narration-paced lands (s, comp-relative, pipe/comma) — one per PRESENT module [head, bar, ledger, grid, foot]; empty = 0.2 + k*0.9","default":""},
    {"id":"exit","type":"enum","label":"Exit","default":"hold","options":[{"value":"hold","label":"Hold to end (compositor owns the seam)"},{"value":"blur-recede","label":"Blur-recede 0.15s (stage only — the canvas never flashes)"}]},

>
  <!--
    PROJECT SNIPER · LONG-FORM template: MODULE-LEDGER-DARK (16:9, 1920x1080)
    A configuration / parallel-work card. Under a thesis headline it stacks
    up to three body modules, each optional:
      - a ledger BAR: one wide row of label | big value | live status;
      - a key-value LEDGER: mono rows "key  value  -> TAG" in a hairline
        panel, each tag coloured by its semantic accent;
      - a FAN-OUT: numbered chips or equal parallel columns hanging from a
        thin connector tree, for work that splits into simultaneous parts;
    and closes with an optional source chip. Use it when the narration
    describes a setup, its settings, or a job split across parallel steps.

    SNIPER DESIGN (tokens.css module palette + type; the dark sibling of
    module-takeover, same chassis):
      - Canvas = --module-canvas (blue graphite) with a faint 48px dot field
        and a soft process-blue glow at the top-left.
      - Eyebrow = --eyebrow-font (IBM Plex Mono 600) caps behind a square
        marker; headline = --font-display (Bricolage Grotesque 800), line 2
        in --accent-result; explainer = --font (Inter 400). Ledger keys,
        values, tags, chips and column numbers are Plex Mono; the bar value
        and column labels are display type.
      - Panels, chips and columns: 1px hairlines, 4-6px corners, square
        markers. Semantic accents: --accent-result (amber) = results, the
        live status and column underlines; --accent-process (blue) = process
        tags, the connector tree and chip markers; --accent-warn (red) is
        reserved for limits and failures.
      - Contrast (WCAG 2.x, text on its own background; canvas #121721,
        panel fill = 3% paper over it): headline white 17.95:1, line-2
        amber 5.11:1, explainer 6.82:1; bar label 6.58:1, bar value
        16.72:1, live status amber 4.76:1 on the panel; ledger keys 5.48:1,
        values 16.72:1, tags amber 4.76:1 / blue 4.14:1 / red 3.54:1, arrow
        4.10:1 on the panel; chip text 12.18:1 and chip numbers 4.90:1 on
        the canvas; column numbers 4.75:1 and labels 16.72:1 on the column
        fill; source-chip text (--receipt-gray) 9.66:1; markers amber
        5.11:1, blue 4.44:1, red 3.80:1 on the canvas.

    CONTRACT for the PRODUCER compositing stage:
      - Default: an OPAQUE own-screen takeover (render --format mp4). The
        canvas is a full-bleed CHILD, opaque from frame 0, so the seam never
        shows the layer underneath.
      - presenterFrame (opt-in, default false): the root gains
        .has-presenter, the canvas is masked (SVG evenodd) into a rounded
        face hole and #nld-face-slot draws the ring around it; the
        compositor scales the speaker into the hole UNDER the graphics. The
        render keeps alpha (graphics_render.format_for keys on
        graphics.pip_hole.entry_has_hole) and the entry must be a longform
        own-screen takeover.
        HOLE GEOMETRY IS A CONTRACT: left 1344px / top 60px / 534x960 /
        r 24px. It MUST equal graphics.pip_hole.HOLE_BY_KIND
        ["module-ledger-dark"] exactly (test_module_longform pins both
        sides). The content column keeps module-takeover's stage (left 96px,
        width 1130px), so the right band [1344..1878] is empty with or
        without the hole and switching the hole on never reflows content.
      - Grammar (each FAILS LOUDLY when malformed): headlineLines is two
        lines max; rows = "key~value[~TAG[~accent]]" with accent in
        process|result|warn (a TAG without an accent is process); grid is
        chips|columns; gridItems = "num~label"; footAccent is
        process|result|warn.
      - Build (Sniper design parameters): the eyebrow leads by
        EYEBROW_LEAD_S; headline lines ramp in place LINE_STAGGER_S=0.12
        apart and the explainer one stagger later; the ledger bar lands as
        one unit; the ledger panel lands first and its rows follow
        SKELETON_GAP_S later, ROW_STAGGER_S=0.25 apart, so each key/value
        pair gets a beat to be read as it arrives; the connector tree lands
        with the fan-out and its items sweep left to right
        GRID_STAGGER_S=0.1 apart, quick enough to read as one branching
        gesture while the order stays visible; the source chip lands LAST.
      - moduleLands: one land per PRESENT module in order [head, bar,
        ledger, grid, foot]. A count mismatch or a non-finite time FAILS
        LOUDLY. Empty = the default cadence LAND_DEFAULT_START_S +
        k*LAND_DEFAULT_GAP_S = 0.2 + k*0.9s, about one module per spoken
        clause, which also leaves a pause before the fan-out starts.
      - UNSET content renders NOTHING (G21). The SAMPLE below (original
        Sniper preview copy) activates only when EVERY content variable is
        unset; the capability probe renders it as the kind's preview.
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - exit:"blur-recede": only #nld-stage-layer blurs, fades and recedes
        over the final EXIT_BLUR_S; the canvas CHILD stays opaque, so the
        seam never flashes. Default "hold" = hard-off on the cut (the
        compositor owns the seam).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · module-ledger-dark</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #nld-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #nld-stage-layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }

      /* Graphite canvas + faint 48px dot field + a soft blue glow at the
         top-left — full-bleed CHILD, opaque from frame 0 (module-takeover's
         chassis, unmasked unless the presenter frame is on). */
      #nld-canvas {
        position: absolute; inset: 0;
        background-color: var(--module-canvas, #121721);
        background-image:
          radial-gradient(circle at 1px 1px, rgba(241,244,246,0.07) 1.2px, transparent 1.6px),
          radial-gradient(ellipse 1100px 700px at 8% 0%, rgba(68,123,228,0.16), transparent 70%);
        background-size: 48px 48px, 100% 100%;
      }

      /* FRAMED PRESENTER-CONTAINER (opt-in: spec.presenterFrame). When the
         root carries .has-presenter, mask the canvas out of the reserved right
         band into a rounded hole (SVG evenodd) the compositor fills with the
         speaker's face, and draw #nld-face-slot as the card ring. Geometry is
         copied VERBATIM from module-takeover and MUST equal
         graphics.pip_hole.HOLE_BY_KIND["module-ledger-dark"] (1344,60,534,960,
         r24). WITHOUT the class the canvas is opaque — renders exactly as before. */
      #nld-root.has-presenter #nld-canvas {
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
      }
      #nld-face-slot { display: none; }
      #nld-root.has-presenter #nld-face-slot {
        display: block;
        position: absolute;
        left: 1344px; top: 60px; width: 534px; height: 960px;
        border-radius: 24px;
        border: 2px solid rgba(241, 244, 246, 0.16);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(241, 244, 246, 0.08);
      }

      /* Content column — EXACTLY module-takeover's stage geometry so the
         face-PIP band [1344..1878] stays clear with or without the hole. */
      #nld-stage {
        position: absolute;
        left: 96px; top: 0; width: 1130px; height: 1080px;
        padding: 96px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 40px;
      }
      .module { will-change: opacity; }

      #nld-eyebrow {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 34px; line-height: 1;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent-process, #447BE4);
      }
      #nld-eyebrow .dot {
        width: 13px; height: 13px; border-radius: 2px;
        background: var(--accent-process, #447BE4);
        flex: 0 0 auto;
      }
      #nld-eyebrow.result, #nld-eyebrow.result .dot { color: var(--accent-result, #CC7200); }
      #nld-eyebrow.result .dot { background: var(--accent-result, #CC7200); }

      #nld-headline {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 116px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      #nld-headline .line { display: block; will-change: opacity; }
      #nld-headline .l2 { color: var(--accent-result, #CC7200); }

      #nld-explainer {
        font-weight: 400; font-size: 34px; line-height: 1.35;
        color: rgba(241, 244, 246, 0.62);
        max-width: 900px;
      }

      /* Ledger bar: one wide hairline row — label | big value | status. */
      #nld-bar {
        display: flex; align-items: center; gap: 28px;
        border: 1px solid rgba(241, 244, 246, 0.14);
        border-radius: 6px;
        background: rgba(241, 244, 246, 0.03);
        padding: 26px 32px;
      }
      #nld-bar-label {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 24px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.62);
      }
      #nld-bar-value {
        font-family: var(--font-display);
        font-weight: 800; font-size: 60px; line-height: 1;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      #nld-bar-status {
        margin-left: auto;
        display: flex; align-items: center; gap: 12px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 23px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent-result, #CC7200);
      }
      #nld-bar-status .dot {
        width: 11px; height: 11px; border-radius: 2px;
        background: var(--accent-result, #CC7200);
        flex: 0 0 auto;
      }

      /* Key-value ledger: mono rows in a hairline panel. */
      #nld-ledger {
        border: 1px solid rgba(241, 244, 246, 0.14);
        border-radius: 6px;
        background: rgba(241, 244, 246, 0.03);
        padding: 10px 32px;
      }
      .nld-kv {
        display: flex; align-items: center; gap: 22px;
        padding: 20px 0;
        border-bottom: 1px solid rgba(241, 244, 246, 0.08);
        will-change: opacity;
      }
      .nld-kv:last-child { border-bottom: none; }
      .kv-key {
        font-family: var(--eyebrow-font);
        font-weight: 500; font-size: 28px;
        color: rgba(241, 244, 246, 0.55);
        flex: 0 0 auto;
      }
      .kv-value {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 31px;
        color: #ffffff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .kv-tag {
        margin-left: auto; flex: 0 0 auto;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 21px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent-process, #447BE4);
      }
      .kv-tag.result { color: var(--accent-result, #CC7200); }
      .kv-tag.warn { color: var(--accent-warn, #D33B36); }
      .kv-arrow { color: rgba(241, 244, 246, 0.45); margin-right: 10px; }

      /* Fan-out (numbered chips or parallel columns) under a thin
         process-blue connector tree. */
      #nld-grid { position: relative; padding-top: 26px; }
      #nld-grid::before {                 /* horizontal tree spine */
        content: "";
        position: absolute; left: 0; right: 0; top: 0;
        height: 1px;
        background: color-mix(in srgb, var(--accent-process, #447BE4) 60%, transparent);
      }
      #nld-grid-items { display: flex; gap: 22px; }
      #nld-grid.columns #nld-grid-items {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
      }
      .nld-item { position: relative; will-change: opacity; }
      .nld-item::before {                 /* vertical stub down to the item */
        content: "";
        position: absolute; left: 50%; top: -26px;
        width: 1px; height: 26px;
        background: color-mix(in srgb, var(--accent-process, #447BE4) 60%, transparent);
      }
      /* chips: mono num + label + trailing square process marker. */
      .nld-item.chip {
        display: flex; align-items: center; gap: 14px;
        border: 1px solid rgba(241, 244, 246, 0.16);
        border-radius: 4px;
        padding: 16px 22px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 26px;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.86);
      }
      .nld-item.chip .num { color: rgba(241, 244, 246, 0.5); }
      .nld-item.chip .enddot {
        width: 9px; height: 9px; border-radius: 2px;
        background: var(--accent-process, #447BE4);
        flex: 0 0 auto;
      }
      /* columns: num / label / result-amber underline. */
      .nld-item.col {
        border: 1px solid rgba(241, 244, 246, 0.14);
        border-radius: 5px;
        background: rgba(241, 244, 246, 0.03);
        padding: 22px 24px 20px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .nld-item.col .num {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 19px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.5);
      }
      .nld-item.col .label {
        font-family: var(--font-display);
        font-weight: 700; font-size: 32px; line-height: 1.05;
        letter-spacing: -0.01em;
        color: #ffffff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .nld-item.col .underline {
        margin-top: 8px;
        height: 4px; border-radius: 1px;
        background: var(--accent-result, #CC7200);
      }

      /* Source footnote chip — outlined, mono, square marker, lands LAST. */
      #nld-foot {
        align-self: flex-start;
        display: flex; align-items: center; gap: 14px;
        border: 1px solid rgba(241, 244, 246, 0.16);
        border-radius: 4px;
        padding: 14px 20px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 21px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--receipt-gray, rgba(255, 255, 255, 0.72));
      }
      #nld-foot .dot {
        width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto;
        background: var(--accent-result, #CC7200);
      }
      #nld-foot.process .dot { background: var(--accent-process, #447BE4); }
      #nld-foot.warn .dot { background: var(--accent-warn, #D33B36); }
    </style>
  </head>
  <body>
    <div
      id="nld-root"
      data-composition-id="module-ledger-dark"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
    >
      <div id="nld-canvas"></div>
      <div id="nld-stage-layer">
        <div id="nld-stage">
          <div id="nld-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="nld-eyebrow-text"></span></div>
          <div id="nld-headline" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="nld-explainer" class="module clip" data-start="0" data-duration="60" data-track-index="3"></div>
          <div id="nld-bar" class="module clip" data-start="0" data-duration="60" data-track-index="4">
            <span id="nld-bar-label"></span><span id="nld-bar-value"></span>
            <span id="nld-bar-status"><span class="dot"></span><span id="nld-bar-status-text"></span></span>
          </div>
          <div id="nld-ledger" class="module clip" data-start="0" data-duration="60" data-track-index="5"></div>
          <div id="nld-grid" class="module clip" data-start="0" data-duration="60" data-track-index="6">
            <div id="nld-grid-items"></div>
          </div>
          <div id="nld-foot" class="module clip" data-start="0" data-duration="60" data-track-index="7"><span class="dot"></span><span id="nld-foot-text"></span></div>
        </div>
      </div>
      <div id="nld-face-slot"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("nld-root");
        const D = parseFloat(root.dataset.duration) || 10;
        const M = window.__motionTokens;

        // Build constants (Sniper design parameters, see header):
        const LINE_STAGGER_S = 0.12;   // headline per-line ramp stagger
        const ROW_STAGGER_S = 0.25;    // one ledger row per quarter second
        const GRID_STAGGER_S = 0.1;    // fan-out sweep, left to right
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9;   // about one module per spoken clause

        const ACCENTS = ["process", "result", "warn"];
        const defaults = {
          eyebrow: "", eyebrowAccent: "process", headlineLines: "",
          explainer: "", barLabel: "", barValue: "", barStatus: "",
          rows: "", grid: "chips", gridItems: "",
          footChip: "", footAccent: "result",
          moduleLands: "", exit: "hold", presenterFrame: false,
        };
        const CONTENT_KEYS = ["eyebrow", "headlineLines", "explainer",
          "barLabel", "barValue", "barStatus", "rows", "gridItems", "footChip"];
        // PREVIEW-ONLY demo (original Sniper sample copy): activates ONLY
        // when every content variable is unset (G21 — no sample leaks into
        // plans).
        const SAMPLE = {
          eyebrow: "PARALLEL REVIEW",
          headlineLines: "CHECKS RUN|SIDE BY SIDE.",
          barLabel: "REVIEW PASSES", barValue: "4",
          barStatus: "RUNNING",
          grid: "columns",
          gridItems: "PASS 01~PACING|PASS 02~CAPTIONS|PASS 03~LOUDNESS|PASS 04~FACT CHECK",
          footChip: "SAMPLE PREVIEW \u00b7 NOT A REAL PROJECT",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        // Framed presenter container: opt-in mask + ring (mirrors how the
        // comp reads exit). The canvas mask + #nld-face-slot ring are scoped
        // to .has-presenter; absent it the card renders opaque as before.
        if (vars.presenterFrame === true || String(vars.presenterFrame) === "true") {
          root.classList.add("has-presenter");
        }

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }
        function accentOf(raw, where) {
          const a = (raw || "").trim().toLowerCase();
          if (!a) return "";
          if (ACCENTS.indexOf(a) < 0) {
            throw new Error("module-ledger-dark: " + where + " accent '" + a +
              "' not in " + ACCENTS.join("|"));
          }
          return a;
        }

        // ---- Fill / prune modules (unset content renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("nld-eyebrow");
        if (ebText) {
          document.getElementById("nld-eyebrow-text").textContent = ebText;
          if (str("eyebrowAccent") === "result") ebEl.classList.add("result");
        } else { ebEl.remove(); }

        const headEl = document.getElementById("nld-headline");
        const heads = str("headlineLines");
        if (heads) {
          const lines = heads.split("|").map(function (s) { return s.trim(); });
          if (lines.length > 2) {
            throw new Error("module-ledger-dark: headlineLines is 2 lines " +
              "max (two-line thesis limit), got " + lines.length);
          }
          lines.forEach(function (line, j) {
            const el = document.createElement("span");
            el.className = "line" + (j === 1 ? " l2" : "");
            el.textContent = line;
            headEl.appendChild(el);
          });
        } else { headEl.remove(); }

        const expText = str("explainer");
        const expEl = document.getElementById("nld-explainer");
        if (expText) expEl.textContent = expText;
        else expEl.remove();

        const barEl = document.getElementById("nld-bar");
        const barLabel = str("barLabel");
        if (barLabel) {
          document.getElementById("nld-bar-label").textContent = barLabel;
          document.getElementById("nld-bar-value").textContent = str("barValue");
          const bs = str("barStatus");
          if (bs) document.getElementById("nld-bar-status-text").textContent = bs;
          else document.getElementById("nld-bar-status").remove();
        } else { barEl.remove(); }

        // Key-value ledger rows: key~value~TAG[~accent].
        const ledgerEl = document.getElementById("nld-ledger");
        const rowsRaw = str("rows");
        const kvEls = [];
        if (rowsRaw) {
          rowsRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length < 2 || !f[0] || !f[1]) {
              throw new Error("module-ledger-dark: ledger row " + (i + 1) +
                " needs key~value at least, got '" + line + "'");
            }
            const row = document.createElement("div");
            row.className = "nld-kv";
            const key = document.createElement("span");
            key.className = "kv-key";
            key.textContent = f[0];
            const val = document.createElement("span");
            val.className = "kv-value";
            val.textContent = f[1];
            row.appendChild(key);
            row.appendChild(val);
            if (f[2]) {
              const tag = document.createElement("span");
              tag.className = "kv-tag " +
                (accentOf(f[3], "ledger row " + (i + 1)) || "process");
              const arrow = document.createElement("span");
              arrow.className = "kv-arrow";
              arrow.textContent = "→";
              tag.appendChild(arrow);
              tag.appendChild(document.createTextNode(f[2]));
              row.appendChild(tag);
            }
            ledgerEl.appendChild(row);
            kvEls.push(row);
          });
        } else { ledgerEl.remove(); }

        // Fan-out (chips or columns): num~label items.
        const gridEl = document.getElementById("nld-grid");
        const gridItemsEl = document.getElementById("nld-grid-items");
        const gridShape = str("grid") || "chips";
        if (gridShape !== "chips" && gridShape !== "columns") {
          throw new Error("module-ledger-dark: grid '" + gridShape +
            "' not in chips|columns");
        }
        const itemsRaw = str("gridItems");
        const itemEls = [];
        if (itemsRaw) {
          gridEl.classList.add(gridShape);
          itemsRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length < 2 || !f[0] || !f[1]) {
              throw new Error("module-ledger-dark: gridItems " + (i + 1) +
                " needs num~label, got '" + line + "'");
            }
            const item = document.createElement("div");
            item.className = "nld-item " + (gridShape === "chips" ? "chip" : "col");
            const num = document.createElement("span");
            num.className = "num";
            num.textContent = f[0];
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = f[1];
            item.appendChild(num);
            item.appendChild(label);
            if (gridShape === "chips") {
              const dot = document.createElement("span");
              dot.className = "enddot";
              item.appendChild(dot);
            } else {
              const ul = document.createElement("span");
              ul.className = "underline";
              item.appendChild(ul);
            }
            gridItemsEl.appendChild(item);
            itemEls.push(item);
          });
        } else { gridEl.remove(); }

        const footText = str("footChip");
        const footEl = document.getElementById("nld-foot");
        if (footText) {
          document.getElementById("nld-foot-text").textContent = footText;
          const fa = accentOf(str("footAccent") || "result", "footAccent");
          if (fa && fa !== "result") footEl.classList.add(fa);
        } else { footEl.remove(); }

        // ---- Narration-paced module lands ([head, bar, ledger, grid, foot]) ----
        const modules = [];
        if (ebText || heads || expText) modules.push("head");
        if (barLabel) modules.push("bar");
        if (kvEls.length) modules.push("ledger");
        if (itemEls.length) modules.push("grid");
        if (footText) modules.push("foot");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("module-ledger-dark: moduleLands needs " +
              modules.length + " finite times for modules [" +
              modules.join(", ") + "], got '" + landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build (eyebrow-first + in-place opacity ramps) ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        if (landOf.head != null) {
          const t0 = landOf.head;
          let headAt = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            headAt = t0 + M.EYEBROW_LEAD_S;      // eyebrow leads the headline
          }
          let lastAt = headAt;
          if (heads) {
            headEl.querySelectorAll(".line").forEach(function (lineEl, j) {
              lastAt = headAt + j * LINE_STAGGER_S;
              M.textRamp(tl, lineEl, lastAt);
            });
          }
          if (expText) M.textRamp(tl, expEl, lastAt + LINE_STAGGER_S);
        }

        // Ledger bar lands as one unit (a single wide receipt).
        if (landOf.bar != null) M.textRamp(tl, barEl, landOf.bar);

        // Ledger: the panel skeleton lands FIRST, then the rows follow
        // ROW_STAGGER_S apart (the container is legible before its text).
        if (landOf.ledger != null) {
          const tL = landOf.ledger;
          M.textRamp(tl, ledgerEl, tL);
          kvEls.forEach(function (row, i) {
            M.textRamp(tl, row, tL + M.SKELETON_GAP_S + i * ROW_STAGGER_S);
          });
        }

        // Fan-out: the connector tree arrives WITH the module, then the
        // items sweep left to right GRID_STAGGER_S apart.
        if (landOf.grid != null) {
          const tG = landOf.grid;
          M.textRamp(tl, gridEl, tG);
          itemEls.forEach(function (el, i) {
            M.textRamp(tl, el, tG + i * GRID_STAGGER_S);
          });
        }

        // Footnote chip lands LAST (the source line closes the card).
        if (landOf.foot != null) M.textRamp(tl, footEl, landOf.foot);

        // exit:"blur-recede": stage only — the opaque canvas never fades,
        // so nothing underneath flashes through at the seam.
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#nld-stage-layer", D - M.EXIT_BLUR_S);
        }
        // Otherwise HOLDS to the end — the compositor owns the seam.

        tl.seek(0);
        window.__timelines["module-ledger-dark"] = tl;
      })();
    </script>
  </body>
</html>
