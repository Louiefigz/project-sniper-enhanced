  lang="en"
  data-composition-variables='[

>
  <!--
    PROJECT SNIPER · LONG-FORM template: MODULE-SCOREBOARD (16:9, 1920x1080)
    A results card: one hero metric, up to a handful of outlined stat tiles
    that break it down, an optional colour-coded strip with one chip per
    item, and a limit footer that states what the number does NOT prove.
    Use it when the narration lands a single result and should show its
    distribution and its caveat in the same breath.

    SNIPER DESIGN (tokens.css module palette + type; the dark sibling of
    module-takeover, same chassis):
      - Canvas = --module-canvas (blue graphite) with a faint 48px dot field
        and a soft process-blue glow at the top-left.
      - Eyebrow = --eyebrow-font (IBM Plex Mono 600) caps behind a square
        marker; context chips, labels and strip chips are Plex Mono 600;
        the hero metric and tile values are --font-display (Bricolage
        Grotesque 800); the caveat is --font (Inter 400).
      - Hero metric in --accent-result (amber) — the number to remember. A
        trailing % renders as a smaller unit so the digits carry the weight.
        Tiles and chips: 1px hairlines, 3-6px corners.
      - Strip semantics (closed vocabulary): win = --accent-result (amber),
        tie = --accent-process (blue), loss = --accent-warn (red). Red is
        reserved for losses and the LIMIT label only.
      - Contrast (WCAG 2.x, text on its own background; canvas #121721, tile
        fill = 3% paper over it): hero amber 5.11:1 (4.24:1 at the
        brightest point of the glow); hero label 6.11:1; context chips
        8.82:1; tile values 16.72:1 and tile labels 5.48:1 on the tile
        fill; strip text on its own 12% tint: amber 4.46:1, blue 3.88:1,
        red 3.47:1; LIMIT label red 3.80:1; caveat 10.14:1; eyebrow blue
        4.44:1 / amber 5.11:1.

    CONTRACT for the PRODUCER compositing stage:
      - Default: an OPAQUE own-screen takeover (render --format mp4). The
        canvas is a full-bleed CHILD, opaque from frame 0, so the seam never
        shows the layer underneath.
      - presenterFrame (opt-in, default false): the root gains
        .has-presenter, the canvas is masked (SVG evenodd) into a rounded
        face hole and #nsb-face-slot draws the ring around it; the
        compositor scales the speaker into the hole UNDER the graphics. The
        render keeps alpha (graphics_render.format_for keys on
        graphics.pip_hole.entry_has_hole) and the entry must be a longform
        own-screen takeover.
        HOLE GEOMETRY IS A CONTRACT: left 1344px / top 60px / 534x960 /
        r 24px. It MUST equal graphics.pip_hole.HOLE_BY_KIND
        ["module-scoreboard"] exactly (test_module_longform pins both
        sides). The content column keeps module-takeover's stage (left 96px,
        width 1130px), so the right band [1344..1878] stays empty; with the
        hole on, any module whose settled box leaves [0..1226] x [0..1080]
        FAILS LOUDLY before the render records a frame.
      - Word heroes: a hero value that is not a plain number (for example a
        word) switches the card to a stacked layout — a 168px hero with the
        tiles in a full-width row beneath — so wide copy stays inside the
        1130px column instead of crossing into the presenter band.
      - Grammar (each FAILS LOUDLY when malformed): tiles = "value~label";
        stripChips = "label~state" with state in win|tie|loss (an unknown
        state is never silently grey).
      - Build (Sniper design parameters; graphics/template_visual_contract.py
        reads these declarations from the HTML source, and
        tests/test_scoreboard_visible_timing.py executes the actual build
        block, so the constant declarations and the marker comments that
        bound the land/build block stay exactly as they are): the eyebrow
        leads by EYEBROW_LEAD_S and the context chips follow
        CTX_STAGGER_S=0.1 apart; the hero lands on its own beat; tiles
        ramp TILE_STAGGER_S=0.1 apart; the strip sweeps left to right
        CHIP_SWEEP_S=0.085 per chip, so a thirteen-chip strip is complete in
        about a second and the colour sequence still reads in order; the
        LIMIT caveat lands LAST, after everything it qualifies.
      - moduleLands: one land per PRESENT module in order [head, hero,
        tiles, strip, limit]. A count mismatch or a non-finite time FAILS
        LOUDLY. Empty = the default cadence 0.2 + k*0.9s, about one module
        per spoken clause, so the strip arrives well after the hero instead
        of competing with it.
      - UNSET content renders NOTHING (G21). The SAMPLE below (original
        Sniper preview copy) activates only when EVERY content variable is
        unset; the capability probe supplies its own TEST copy.
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - exit:"blur-recede": only #nsb-stage-layer blurs, fades and recedes
        over the final EXIT_BLUR_S; the canvas stays opaque. Default "hold" =
        hard-off on the cut (the compositor owns the seam).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · module-scoreboard</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #nsb-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #nsb-stage-layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }

      /* Graphite canvas + faint 48px dot field + a soft blue glow at the
         top-left — full-bleed CHILD, opaque from frame 0. */
      #nsb-canvas {
        position: absolute; inset: 0;
        background-color: var(--module-canvas, #121721);
        background-image:
          radial-gradient(circle at 1px 1px, rgba(241,244,246,0.07) 1.2px, transparent 1.6px),
          radial-gradient(ellipse 1100px 700px at 8% 0%, rgba(68,123,228,0.16), transparent 70%);
        background-size: 48px 48px, 100% 100%;
      }

      /* FRAMED PRESENTER-CONTAINER (opt-in: spec.presenterFrame). When the
         root carries .has-presenter, mask the canvas out of the reserved right
         band into a rounded hole (SVG evenodd) the compositor fills with the
         speaker's face, and draw #nsb-face-slot as the card ring. Geometry is
         copied VERBATIM from module-takeover and MUST equal
         graphics.pip_hole.HOLE_BY_KIND["module-scoreboard"] (1344,60,534,960,
         r24). WITHOUT the class the canvas is opaque — renders exactly as before. */
      #nsb-root.has-presenter #nsb-canvas {
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
      }
      #nsb-face-slot { display: none; }
      #nsb-root.has-presenter #nsb-face-slot {
        display: block;
        position: absolute;
        left: 1344px; top: 60px; width: 534px; height: 960px;
        border-radius: 24px;
        border: 2px solid rgba(241, 244, 246, 0.16);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(241, 244, 246, 0.08);
      }

      /* Content column — module-takeover stage geometry (PIP band clear). */
      #nsb-stage {
        position: absolute;
        left: 96px; top: 0; width: 1130px; height: 1080px;
        padding: 96px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 44px;
      }
      .module { will-change: opacity; }

      #nsb-eyebrow {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 34px; line-height: 1;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent-process, #447BE4);
      }
      #nsb-eyebrow .dot {
        width: 13px; height: 13px; border-radius: 2px;
        background: var(--accent-process, #447BE4);
        flex: 0 0 auto;
      }
      #nsb-eyebrow.result, #nsb-eyebrow.result .dot { color: var(--accent-result, #CC7200); }
      #nsb-eyebrow.result .dot { background: var(--accent-result, #CC7200); }

      #nsb-context { display: flex; gap: 16px; }
      .ctx-chip {
        border: 1px solid rgba(241, 244, 246, 0.16);
        border-radius: 4px;
        padding: 10px 16px;
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 18px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.72);
        will-change: opacity;
      }

      /* Hero metric row: the big result-amber number on the left, the
         outlined tiles beside it on the same row. */
      #nsb-hero-row { display: flex; align-items: center; gap: 70px; }
      #nsb-hero { display: flex; flex-direction: column; gap: 14px; }
      #nsb-hero-value {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 230px;
        line-height: 0.92;
        letter-spacing: -0.025em;
        color: var(--accent-result, #CC7200);
        will-change: opacity;
      }
      #nsb-hero-value .unit { font-size: 96px; letter-spacing: -0.01em; }
      #nsb-hero-label {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 25px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.58);
      }
      #nsb-tiles { display: flex; gap: 22px; }
      .nsb-tile {
        border: 1px solid rgba(241, 244, 246, 0.14);
        border-radius: 6px;
        background: rgba(241, 244, 246, 0.03);
        padding: 26px 34px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        min-width: 130px;
        will-change: opacity;
      }
      .nsb-tile .value {
        font-family: var(--font-display);
        font-weight: 800; font-size: 66px; line-height: 1;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      .nsb-tile .label {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 17px;
        letter-spacing: 0.16em; text-transform: uppercase;
        color: rgba(241, 244, 246, 0.55);
      }

      /* Text heroes such as PROMPTS are wider than numeric metrics. Stack the
         tiles below them so every revealed module stays inside the 1130px
         content column and never crosses the presenter hole at x=1344. */
      #nsb-root.word-hero #nsb-hero-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 22px;
      }
      #nsb-root.word-hero #nsb-hero-value {
        font-size: 168px;
        letter-spacing: -0.02em;
      }
      #nsb-root.word-hero #nsb-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        width: 100%;
      }
      #nsb-root.word-hero .nsb-tile {
        min-width: 0;
        padding: 18px 24px;
      }
      #nsb-root.word-hero .nsb-tile .value { font-size: 44px; }

      /* Per-item strip: win amber / tie blue / loss red (red is reserved for
         losses and the LIMIT label). Each chip sits on a 12% tint of its
         own accent. */
      #nsb-strip { display: flex; flex-wrap: wrap; gap: 12px; }
      .strip-chip {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 19px;
        letter-spacing: 0.1em;
        border-radius: 3px;
        padding: 10px 14px;
        border: 1px solid transparent;
        will-change: opacity;
      }
      .strip-chip.win {
        color: var(--accent-result, #CC7200);
        border-color: color-mix(in srgb, var(--accent-result, #CC7200) 45%, transparent);
        background: color-mix(in srgb, var(--accent-result, #CC7200) 12%, transparent);
      }
      .strip-chip.tie {
        color: var(--accent-process, #447BE4);
        border-color: color-mix(in srgb, var(--accent-process, #447BE4) 45%, transparent);
        background: color-mix(in srgb, var(--accent-process, #447BE4) 12%, transparent);
      }
      .strip-chip.loss {
        color: var(--accent-warn, #D33B36);
        border-color: color-mix(in srgb, var(--accent-warn, #D33B36) 45%, transparent);
        background: color-mix(in srgb, var(--accent-warn, #D33B36) 12%, transparent);
      }

      /* LIMIT footer: red mono label | hairline divider | the caveat. */
      #nsb-limit {
        display: flex; align-items: center; gap: 22px;
        border-top: 1px solid rgba(241, 244, 246, 0.14);
        padding-top: 24px;
      }
      #nsb-limit-label {
        font-family: var(--eyebrow-font);
        font-weight: 600; font-size: 26px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent-warn, #D33B36);
        flex: 0 0 auto;
      }
      #nsb-limit-divider {
        width: 1px; height: 26px;
        background: rgba(241, 244, 246, 0.2);
        flex: 0 0 auto;
      }
      #nsb-limit-text {
        font-weight: 400; font-size: 34px; line-height: 1.2;
        color: rgba(241, 244, 246, 0.78);
      }
    </style>
  </head>
  <body>
    <div
      id="nsb-root"
      data-composition-id="module-scoreboard"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
    >
      <div id="nsb-canvas"></div>
      <div id="nsb-stage-layer">
        <div id="nsb-stage">
          <div id="nsb-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="nsb-eyebrow-text"></span></div>
          <div id="nsb-context" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="nsb-hero-row" class="module clip" data-start="0" data-duration="60" data-track-index="3">
            <div id="nsb-hero">
              <div id="nsb-hero-value"></div>
              <div id="nsb-hero-label"></div>
            </div>
            <div id="nsb-tiles"></div>
          </div>
          <div id="nsb-strip" class="module clip" data-start="0" data-duration="60" data-track-index="4"></div>
          <div id="nsb-limit" class="module clip" data-start="0" data-duration="60" data-track-index="5">
            <span id="nsb-limit-label"></span><span id="nsb-limit-divider"></span><span id="nsb-limit-text"></span>
          </div>
        </div>
      </div>
      <div id="nsb-face-slot"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("nsb-root");
        const D = parseFloat(root.dataset.duration) || 10;
        const M = window.__motionTokens;

        // Payoff constants (Sniper design parameters, see header):
        const CHIP_SWEEP_S = 0.085;   // one strip chip per 85ms, L->R
        const CTX_STAGGER_S = 0.1;    // context chips, L->R
        const TILE_STAGGER_S = 0.1;   // stat tiles, L->R
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9;

        const STATES = ["win", "tie", "loss"];
        const defaults = {
          eyebrow: "", eyebrowAccent: "process", contextChips: "",
          heroValue: "", heroLabel: "", tiles: "", stripChips: "",
          limitLabel: "LIMIT", limitText: "",
          moduleLands: "", exit: "hold", presenterFrame: false,
        };
        const CONTENT_KEYS = ["eyebrow", "contextChips", "heroValue",
          "heroLabel", "tiles", "stripChips", "limitText"];
        // PREVIEW-ONLY demo (original Sniper sample copy): activates ONLY
        // when every content variable is unset (G21 — no sample leaks into
        // plans).
        const SAMPLE = {
          eyebrow: "CAPTION ACCURACY",
          contextChips: "ONE EPISODE|13 CLIPS|LOCAL RENDER",
          heroValue: "94%", heroLabel: "WORDS MATCHED ON FIRST PASS",
          tiles: "9~CLEAN|3~MINOR|1~REDO",
          stripChips: "01~win|02~win|03~win|04~win|05~win|06~win|07~win|" +
            "08~win|09~win|10~tie|11~tie|12~tie|13~loss",
          limitText: "Sample numbers, not a benchmark.",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        // Framed presenter container: opt-in mask + ring (mirrors how the
        // comp reads exit). The canvas mask + #nsb-face-slot ring are scoped
        // to .has-presenter; absent it the card renders opaque as before.
        if (vars.presenterFrame === true || String(vars.presenterFrame) === "true") {
          root.classList.add("has-presenter");
        }

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }

        // ---- Fill / prune modules (unset content renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("nsb-eyebrow");
        if (ebText) {
          document.getElementById("nsb-eyebrow-text").textContent = ebText;
          if (str("eyebrowAccent") === "result") ebEl.classList.add("result");
        } else { ebEl.remove(); }

        const ctxEl = document.getElementById("nsb-context");
        const ctxTexts = str("contextChips") ? str("contextChips").split("|")
          .map(function (s) { return s.trim(); }).filter(Boolean) : [];
        const ctxEls = ctxTexts.map(function (t) {
          const el = document.createElement("span");
          el.className = "ctx-chip";
          el.textContent = t;
          ctxEl.appendChild(el);
          return el;
        });
        if (!ctxEls.length) ctxEl.remove();

        // Hero metric: a trailing % renders as a smaller unit glyph
        // (typography only — the unit stays secondary to the digits).
        const heroRowEl = document.getElementById("nsb-hero-row");
        const heroValue = str("heroValue");
        const heroValueEl = document.getElementById("nsb-hero-value");
        if (heroValue) {
          if (!/^[+-]?[0-9.,]+%?$/.test(heroValue)) root.classList.add("word-hero");
          if (heroValue.charAt(heroValue.length - 1) === "%") {
            heroValueEl.textContent = heroValue.slice(0, -1);
            const unit = document.createElement("span");
            unit.className = "unit";
            unit.textContent = "%";
            heroValueEl.appendChild(unit);
          } else {
            heroValueEl.textContent = heroValue;
          }
          const hl = str("heroLabel");
          if (hl) document.getElementById("nsb-hero-label").textContent = hl;
          else document.getElementById("nsb-hero-label").remove();
        } else {
          document.getElementById("nsb-hero").remove();
        }

        // Outlined stat tiles: value~label.
        const tilesEl = document.getElementById("nsb-tiles");
        const tilesRaw = str("tiles");
        const tileEls = [];
        if (tilesRaw) {
          tilesRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length < 2 || !f[0] || !f[1]) {
              throw new Error("module-scoreboard: tile " + (i + 1) +
                " needs value~label, got '" + line + "'");
            }
            const tile = document.createElement("div");
            tile.className = "nsb-tile";
            const v = document.createElement("span");
            v.className = "value";
            v.textContent = f[0];
            const l = document.createElement("span");
            l.className = "label";
            l.textContent = f[1];
            tile.appendChild(v);
            tile.appendChild(l);
            tilesEl.appendChild(tile);
            tileEls.push(tile);
          });
        } else { tilesEl.remove(); }
        if (!heroValue && !tileEls.length) heroRowEl.remove();

        // Color-coded chip strip: label~state, closed vocabulary.
        const stripEl = document.getElementById("nsb-strip");
        const stripRaw = str("stripChips");
        const stripEls = [];
        if (stripRaw) {
          stripRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length !== 2 || !f[0] || STATES.indexOf(f[1]) < 0) {
              throw new Error("module-scoreboard: stripChips " + (i + 1) +
                " needs label~state with state in " + STATES.join("|") +
                ", got '" + line + "'");
            }
            const chip = document.createElement("span");
            chip.className = "strip-chip " + f[1];
            chip.textContent = f[0];
            stripEl.appendChild(chip);
            stripEls.push(chip);
          });
        } else { stripEl.remove(); }

        const limitText = str("limitText");
        const limitEl = document.getElementById("nsb-limit");
        if (limitText) {
          document.getElementById("nsb-limit-label").textContent =
            str("limitLabel") || "LIMIT";
          document.getElementById("nsb-limit-text").textContent = limitText;
        } else { limitEl.remove(); }

        // Fail loudly if any scoreboard module escapes the content stage or
        // intrudes into the presenter band. The check reads the settled DOM boxes,
        // including dynamically generated tiles, before Hyperframes records.
        if (root.classList.contains("has-presenter")) {
          const stageRight = 1226;
          [ctxEl, heroRowEl, stripEl, limitEl].forEach(function (module) {
            if (!module || !module.isConnected) return;
            const box = module.getBoundingClientRect();
            if (box.left < 0 || box.right > stageRight || box.top < 0 || box.bottom > 1080) {
              throw new Error("module-scoreboard: module crosses PIP-safe bounds: " +
                JSON.stringify({ left: box.left, right: box.right,
                  top: box.top, bottom: box.bottom, stageRight: stageRight }));
            }
          });
        }

        // ---- Narration-paced lands ([head, hero, tiles, strip, limit]) ----
        const modules = [];
        if (ebText || ctxEls.length) modules.push("head");
        if (heroValue) modules.push("hero");
        if (tileEls.length) modules.push("tiles");
        if (stripEls.length) modules.push("strip");
        if (limitText) modules.push("limit");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("module-scoreboard: moduleLands needs " +
              modules.length + " finite times for modules [" +
              modules.join(", ") + "], got '" + landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build: hero -> tiles -> chip sweep -> limit ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        if (landOf.head != null) {
          const t0 = landOf.head;
          let at = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            at = t0 + M.EYEBROW_LEAD_S;         // eyebrow leads the chips
          }
          if (ctxEls.length) {
            M.textRamp(tl, ctxEl, at);
            ctxEls.forEach(function (el, i) {
              M.textRamp(tl, el, at + i * CTX_STAGGER_S);
            });
          }
        }

        if (landOf.hero != null) {
          M.textRamp(tl, heroRowEl, landOf.hero);
          M.textRamp(tl, document.getElementById("nsb-hero"), landOf.hero);
        }
        if (landOf.tiles != null) {
          if (landOf.hero == null) M.textRamp(tl, heroRowEl, landOf.tiles);
          M.textRamp(tl, tilesEl, landOf.tiles);
          tileEls.forEach(function (el, i) {
            M.textRamp(tl, el, landOf.tiles + i * TILE_STAGGER_S);
          });
        }

        // The strip lands on its own beat after the hero, then sweeps
        // L->R one chip per CHIP_SWEEP_S.
        if (landOf.strip != null) {
          M.textRamp(tl, stripEl, landOf.strip);
          stripEls.forEach(function (el, i) {
            M.textRamp(tl, el, landOf.strip + i * CHIP_SWEEP_S);
          });
        }

        // The caveat lands LAST, after everything it qualifies.
        if (landOf.limit != null) M.textRamp(tl, limitEl, landOf.limit);

        // exit:"blur-recede": stage only; the canvas stays opaque.
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#nsb-stage-layer", D - M.EXIT_BLUR_S);
        }

        tl.seek(0);
        window.__timelines["module-scoreboard"] = tl;
      })();
    </script>
  </body>
</html>
