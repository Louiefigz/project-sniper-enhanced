<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Wash color A","default":"#054BC9"},
    {"id":"accent2","type":"color","label":"Wash color B (family)","default":"#6D3BE0"},
    {"id":"dir","type":"enum","label":"Sweep direction","default":"ltr","options":[{"value":"ltr","label":"Left -> right"},{"value":"rtl","label":"Right -> left"}]}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: COLOR-WASH (batch 2, from the edited
    long-form's "gradient color-wash" transition — LONGFORM_VISUAL_STUDY §3,
    reference frame 861s in validate_graphics.jpg: a warm orange->purple wash over
    the head at a beat change). Recolored to the Project Sniper accent family (accent ->
    violet). A brief tinted wash that SWEEPS across the frame to bridge a cut.
    ALPHA 1920x1080 overlay (semi-transparent, the head reads through) -> render
    with `--format mov` (ProRes 4444). Short: ~0.8s (transition doctrine).

    CONTRACT for the PRODUCER compositing stage:
      - accent / accent2 are the wash gradient's two family colors; dir sets the
        sweep direction (ltr default). The wash rides in from off-frame, peaks over
        the middle, and rides off — its OPACITY also bumps 0 -> peak -> 0, so it is
        a passing wash (a transition), never a lingering tint. Pure fns of timeline
        time (seek-safe): a render seek to any frame reconstructs the exact state.
      - Keep the render length SHORT (~0.8s) — this bridges a beat/cut, it does not
        dwell. RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · color-wash</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;          /* alpha overlay — only the wash paints */
        font-family: var(--font);
      }
      #cw-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* A wide diagonal gradient panel, wider than the frame so a full traverse
         never shows a hard edge inside the frame. Skewed for a lively sweep. */
      #cw-wash {
        position: absolute;
        top: -12%;
        left: 0;
        width: 2600px;
        height: 124%;
        transform: translateX(-2600px) skewX(-9deg);
        background: linear-gradient(
          100deg,
          rgba(0, 0, 0, 0) 0%,
          var(--accent) 34%,
          var(--accent2) 62%,
          rgba(0, 0, 0, 0) 100%
        );
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="cw-root"
      data-composition-id="color-wash"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="0.8"
    >
      <div id="cw-wash" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("cw-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 0.8;

        const defaults = { accent: "#054BC9", accent2: "#6D3BE0", dir: "ltr" };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);
        document.documentElement.style.setProperty("--accent2", vars.accent2);

        // Travel endpoints: the wash starts off one side and exits the other. The
        // panel is 2600px wide; the frame is 1920px, so from -2600 to +1920 clears.
        const rtl = String(vars.dir) === "rtl";
        const fromX = rtl ? 1920 : -2600;
        const toX = rtl ? -2600 : 1920;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // One linear driver; opacity is a sin bump (0 -> peak -> 0) derived from
        // its time, so a seek to any frame reconstructs the exact wash state.
        const wash = document.getElementById("cw-wash");
        gsap.set(wash, { x: fromX, opacity: 0 });
        const PEAK = 0.72;
        const proxy = { v: 0 };
        tl.to(proxy, {
          v: 1,
          duration: D,
          ease: "none",
          onUpdate: function () {
            const t = proxy.v;                 // 0..1 across the window
            wash.style.opacity = String(PEAK * Math.sin(Math.PI * t));
          },
        }, 0);
        // Position sweeps across with an ease so it feels like a wipe, not linear.
        tl.fromTo(wash, { x: fromX }, { x: toX, duration: D, ease: "power1.inOut" }, 0);

        tl.seek(0);
        window.__timelines["color-wash"] = tl;
      })();
    </script>
  </body>
</html>
