<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"icon1","type":"string","label":"Badge 1 icon (file under /icons)","default":"codex"},
    {"id":"icon2","type":"string","label":"Badge 2 icon (empty = omit)","default":"gemini"},
    {"id":"icon3","type":"string","label":"Badge 3 icon (empty = omit)","default":"cursor"},
    {"id":"icon4","type":"string","label":"Badge 4 icon (empty = omit)","default":""},
    {"id":"at1","type":"number","label":"Badge 1 land time (s)","default":0.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Badge 2 land time (s)","default":0.55,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Badge 3 land time (s)","default":0.9,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at4","type":"number","label":"Badge 4 land time (s)","default":1.25,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"label","type":"string","label":"Micro label under the row (empty = omit)","default":""}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: ICON-BADGE (MG-3.5, R12)
    Trigger it serves: a SPECIFIC named entity (or 2-4) whose brand mark is
    recognizable — "Codex", "Gemini", "Cursor". Reference Style Study R12
    (operator verdict, 2026-07-05): a bare recognizable mark in a small square
    container BEATS chip+label — the pill text is redundant with the mark and the
    spoken word. This is the icon-first sibling of `chip-row`:
      - chip-row  = entities with NO known mark (text pill IS the information).
      - icon-badge = entities WITH a recognizable mark (the mark alone carries it).
    Generic words ("AI", "the cloud") earn NO graphic at all — don't reach for
    either template for them (R12 rule 1).
    Transparent 1080x1920 overlay -> render with `--format mov` (ProRes 4444) for alpha.

    CONTRACT for the PRODUCER compositing stage:
      - PER-BADGE ICONS (icon1..4) and LAND TIMES (at1..4, seconds) are
        `data-composition-variables` — fill with --variables. Each iconN is a
        filename under the icons/ web root (e.g. "codex" / "codex.svg" from
        scripts/producer/icon_library.py); the .svg extension is optional. The
        mark is pre-recolored to --accent at fetch time, so it matches the brand
        treatment used across the pack.
      - An empty iconN string OMITS that badge; the row re-centers to the marks
        that remain. 1-4 badges always ride ONE centered row (a full house of
        four fits the safe width with room to spare — no 2x2 wrap needed).
      - atN is how a badge syncs to a spoken word: set it to the transcript time
        of the entity name (relative to the overlay's outStart). Entrance is a
        quick ~160ms pop that lands on atN (R9 — never a from-nothing appearance).
      - OPTIONAL micro label (var `label`): one small slate line UNDER the row,
        for the rare case a single clarifying word is warranted. DEFAULT EMPTY —
        the bare marks are the doctrine; reach for the label only when a mark
        alone is ambiguous.
      - Icon files are validated UPSTREAM: plan_lint_motion errors on any spec
        `icon*` value missing from templates/motion/icons/ (its check keys off
        the `icon` prefix, so icon1..4 here are covered) — a typo fails the plan
        instead of rendering a broken <img>.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; see the chip-row/stat-card note). Make it
        comfortably past the last atN so the row holds before the fade.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · icon-badge</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #badge-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* .stage OWNS the centering transform (visual center, free-band center).
         #badge-group is a plain flex column GSAP can drift/fade without clobbering
         the centering transform. */
      .stage {
        position: absolute;
        left: var(--visual-center-x);
        top: 855px;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
      }
      #badge-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;                        /* row -> micro label breathing room */
        will-change: transform, opacity;
      }
      /* 1-4 badges on ONE centered row; generous gap per the operator's spacing note. */
      #badge-row {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        gap: 44px;
      }
      /* Square rounded glass container — bare mark only, no pill / no label text.
         Slightly translucent so real footage shows faintly through (frosted glass);
         the inset top hairline is the glass highlight, --card-shadow lifts it off. */
      .badge {
        flex: 0 0 auto;
        width: 120px;
        height: 120px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        box-shadow: var(--card-shadow), inset 0 1.5px 0 rgba(255, 255, 255, 0.85);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      /* The bare brand mark. 72px in a 120px square = generous padding; contain
         preserves the square Simple Icons viewBox. Pre-recolored to --accent. */
      .badge-mark {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }
      /* Optional one-line clarifier — small slate text, R12 default-empty. */
      #badge-label {
        font-weight: 600;
        font-size: 40px;
        line-height: 1.05;
        letter-spacing: 0.01em;
        color: var(--ink-soft);
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);   /* readability over video */
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="badge-root"
      data-composition-id="icon-badge"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="2.6"
    >
      <div class="stage">
        <div id="badge-group">
          <div id="badge-row">
            <div id="badge-1" class="badge clip" data-slot="1" data-start="0" data-duration="60" data-track-index="1"></div>
            <div id="badge-2" class="badge clip" data-slot="2" data-start="0" data-duration="60" data-track-index="2"></div>
            <div id="badge-3" class="badge clip" data-slot="3" data-start="0" data-duration="60" data-track-index="3"></div>
            <div id="badge-4" class="badge clip" data-slot="4" data-start="0" data-duration="60" data-track-index="4"></div>
          </div>
          <div id="badge-label" class="clip" data-start="0" data-duration="60" data-track-index="5"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("badge-root");
        // Single source of truth for render length: the root data-duration attr.
        const D = parseFloat(root.dataset.duration) || 2.6;

        const defaults = {
          icon1: "codex", icon2: "gemini", icon3: "cursor", icon4: "",
          at1: 0.2, at2: 0.55, at3: 0.9, at4: 1.25, label: "",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        const items = [
          { icon: vars.icon1, at: Number(vars.at1) },
          { icon: vars.icon2, at: Number(vars.at2) },
          { icon: vars.icon3, at: Number(vars.at3) },
          { icon: vars.icon4, at: Number(vars.at4) },
        ];

        // Resolve an iconN var to a rooted /icons src (.svg optional).
        function iconSrc(raw) {
          const v = (raw == null ? "" : String(raw)).trim();
          if (!v) return "";
          if (v.charAt(0) === "/") return v;             // already a rooted path
          return "/icons/" + (v.indexOf(".") >= 0 ? v : v + ".svg");
        }

        // Fill / prune the four static badges; a badge with no icon is dropped and
        // the row re-centers to the marks that remain (all counts ride one row).
        // The <img> is created only for active badges (mirrors chip-row) so empty
        // slots leave nothing behind for the media discovery pass to collide on.
        const badges = Array.prototype.slice.call(document.querySelectorAll(".badge"));
        const active = [];
        badges.forEach(function (badge, i) {
          const src = iconSrc(items[i].icon);
          if (!src) { badge.remove(); return; }
          const img = document.createElement("img");
          img.className = "badge-mark";
          img.setAttribute("alt", "");
          img.src = src;
          badge.appendChild(img);
          active.push({ badge: badge, at: isFinite(items[i].at) ? items[i].at : 0.2 });
        });

        // Optional micro label (R12): one clarifying word, default empty -> removed.
        const labelEl = document.getElementById("badge-label");
        const label = String(vars.label == null ? "" : vars.label).trim();
        if (label) { labelEl.textContent = label; } else { labelEl.remove(); }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // R9 entrance: a quick ~160ms pop that STARTS from a visible scale (0.72),
        // never from nothing — each badge lands on its spoken-word time (atN). The
        // back.out overshoot is the "settle".
        active.forEach(function (a) {
          tl.set(a.badge, { opacity: 0, y: 16, scale: 0.72 }, 0);
          const at = Math.max(0, Math.min(a.at, D - 0.4)); // keep the entrance inside the render
          tl.to(a.badge, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2.4)" }, at);
        });

        // Micro label rises softly under the row just after the first badge lands.
        if (label && active.length) {
          const firstAt = Math.min.apply(null, active.map(function (a) { return a.at; }));
          tl.set("#badge-label", { opacity: 0, y: 10 }, 0);
          tl.to("#badge-label", { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" },
            Math.max(0, Math.min(firstAt + 0.14, D - 0.3)));
        }

        // Fade the whole group out — ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.18);
        tl.to("#badge-group", { opacity: 0, y: -14, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["icon-badge"] = tl;
      })();
    </script>
  </body>
</html>
