<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"bg","type":"color","label":"Fill color","default":"#FFFFFF"},
    {"id":"radiusPx","type":"number","label":"Corner radius (px)","default":28,"min":0,"max":400,"step":2,"unit":"px"},
    {"id":"opacity","type":"number","label":"Fill opacity (0-1)","default":1,"min":0,"max":1,"step":0.05},
    {"id":"widthPx","type":"number","label":"Width (px)","default":640,"min":20,"max":1080,"step":2,"unit":"px"},
    {"id":"heightPx","type":"number","label":"Height (px)","default":360,"min":20,"max":1920,"step":2,"unit":"px"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: CONTAINER-SHAPE (Primitives)
    A bare, placeable rounded-rectangle CONTAINER primitive — no copy, no icon,
    no shadow: a flat rounded fill the operator drops anywhere (editor drag →
    entry.placement {x, y[, scale]}) and layers text-element on top of for a
    card look. Shadowless ON PURPOSE: the measured alpha bbox IS the visual box,
    so a placement pin lands exactly on the drawn corner (house cards trade
    that precision for a drop shadow; a layout primitive must not).
    Transparent 1080x1920 overlay -> render with `--format mov` (ProRes 4444).
    LANDSCAPE SIBLING: container-shape-wide.html (paired -wide variant, repo
    convention — canvas is fixed per comp via data-width/height).

    CONTRACT for the PRODUCER compositing stage:
      - bg / radiusPx / opacity (0-1 fill opacity) / widthPx / heightPx are
        `data-composition-variables` — fill with --variables. Dimensions are
        clamped to a 20px floor (a zero-size box would fail the alpha probe).
      - The box centers on the free band (visual-center-x, y 855) so the
        unplaced anchor path has slack in every direction; an explicit
        entry.placement pin overrides all of that at composite time.
      - Motion: subtle house scale-in (0.92 -> 1, power3.out) to the target
        opacity, hold, house fade-out ending exactly at D.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · container-shape</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;          /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #cs-root { position: relative; width: var(--canvas-w); height: var(--canvas-h); }

      /* .stage OWNS the centering transform; GSAP animates only the box. */
      .stage {
        position: absolute;
        left: var(--visual-center-x);
        top: 855px;
        transform: translate(-50%, -50%);
      }
      #cs-box { will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div
      id="cs-root"
      data-composition-id="container-shape"
      data-width="1080"
      data-height="1920"
      data-duration="3"
    >
      <div class="stage">
        <div id="cs-box" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("cs-root");
        const D = parseFloat(root.dataset.duration) || 3;

        const defaults = {
          bg: "#FFFFFF", radiusPx: 28, opacity: 1, widthPx: 640, heightPx: 360,
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});

        const box = document.getElementById("cs-box");
        const w = Math.max(20, Number(vars.widthPx) || 640);
        const h = Math.max(20, Number(vars.heightPx) || 360);
        const radius = Math.max(0, Number(vars.radiusPx) || 0);
        const alpha = Math.min(1, Math.max(0, Number(vars.opacity)));
        const fill = isFinite(alpha) ? alpha : 1;
        box.style.width = w + "px";
        box.style.height = h + "px";
        box.style.borderRadius = radius + "px";
        box.style.background = String(vars.bg);

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Subtle house scale-in — from a visible 0.92 (R9, never from nothing)
        // up to the operator's target fill opacity.
        tl.fromTo("#cs-box", { opacity: 0, scale: 0.92 },
          { opacity: fill, scale: 1, duration: 0.45, ease: "power3.out" }, 0);

        // House exit — fade ends exactly at D so timeline length == render length.
        const fadeDur = Math.min(0.42, D * 0.18);
        tl.to("#cs-box", { opacity: 0, duration: fadeDur, ease: "power2.in" }, D - fadeDur);

        tl.seek(0);
        window.__timelines["container-shape"] = tl;
      })();
    </script>
  </body>
</html>
