<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"mode","type":"enum","label":"Skin (switches per background)","default":"footage","options":[{"value":"footage","label":"Footage — ink caption plate, chest band"},{"value":"canvas","label":"Canvas — amber pill on slide takeovers"}]},
    {"id":"cue1","type":"string","label":"Cue 1 (1-4 words; *asterisk* one key word for inline bold)","default":""},
    {"id":"cue2","type":"string","label":"Cue 2 (empty = end of chain)","default":""},
    {"id":"cue3","type":"string","label":"Cue 3","default":""},
    {"id":"cue4","type":"string","label":"Cue 4","default":""},
    {"id":"cue5","type":"string","label":"Cue 5","default":""},
    {"id":"cue6","type":"string","label":"Cue 6","default":""},
    {"id":"at1","type":"number","label":"Cue 1 at (s; 0 = ON at the cut frame)","default":0,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at2","type":"number","label":"Cue 2 at (s)","default":0.8,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at3","type":"number","label":"Cue 3 at (s)","default":1.6,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at4","type":"number","label":"Cue 4 at (s)","default":2.4,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at5","type":"number","label":"Cue 5 at (s)","default":3.2,"min":0,"max":30,"step":0.05,"unit":"s"},
    {"id":"at6","type":"number","label":"Cue 6 at (s)","default":4.0,"min":0,"max":30,"step":0.05,"unit":"s"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: SLIDEWARE-CAPTION-DUAL-MODE (short-form slide set, 4 of 4)
    A quiet caption chain: short cues of one to four words that swap in place
    as they are spoken. One skin for footage, one for the
    slide takeover, so the caption keeps reading when the background changes.
    Transparent 1080x1920 overlay -> render `--format mov` (ProRes 4444).

    SNIPER DESIGN (the short-form slide set — same plates and amber as
    slideware-takeover-deck / -staircase-lockup / -receipt-cell):
      - FOOTAGE skin: Inter 400 white, sentence case, on a compact ink plate
        (rgba(19,23,32,0.78), 4px corners) centred on the chest band (x0.5,
        y0.62). The plate keeps contrast independent of the shot: white on
        the plate over pure white footage 8.87:1 (17.93:1 on solid ink).
      - CANVAS skin: the takeover deck's caption pill — a --lemon
        signal-amber plate, 4px corners, --rail-cream-ink text (9.31:1),
        centred on the deck's pill slot (x0.5, y0.78). Use it over
        slideware-takeover-deck, where an ink plate would vanish into the
        graphite canvas. Cue 1 is already ON at the cut frame (at1 = 0).
      - Emphasis: one *asterisk* key word per cue is set in Inter 700
        against the 400 body. It is the ONLY in-line emphasis — no colour,
        no karaoke — so the caption stays quieter than the cards above it.

    CONTRACT for the PRODUCER compositing stage:
      - HARD REPLACE-PER-CUE: cueN instantly replaces cueN-1 at atN (0.3-1.2s
        cadence). No fades, no karaoke, no colour change — emphasis beyond
        the inline bold is promoted IN PLACE to slideware-staircase-lockup
        (its own entry), never carried by the caption layer.
      - The last set cue HOLDS to D; the compositor owns both seams.
      - EMPTY-DEFAULTS LAW (G21): cue1..6 default EMPTY — unset renders
        NOTHING; the sample chain activates only when ALL are unset.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · slideware-caption-dual-mode</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;           /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #acd-root { position: relative; width: 1080px; height: 1920px; }

      /* FOOTAGE skin: ink caption plate on the chest band (y0.62). */
      #acd-stage {
        position: absolute;
        left: 540px;
        top: 1190px;
        transform: translate(-50%, -50%);
        width: 940px;
        text-align: center;
      }
      .acd-cue {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: 940px;
        font-size: 40px;
        font-weight: 400;
        line-height: 1.25;
        color: #FFFFFF;
        background: rgba(19, 23, 32, 0.78);
        border-radius: 4px;
        padding: 8px 20px 10px;
        text-wrap: balance;
        will-change: opacity;
      }
      .acd-cue b { font-weight: 700; }     /* inline bold = the ONLY emphasis */

      /* CANVAS skin: the deck's amber caption pill at the takeover slot
         (y0.78) — same plate, type and corners as slideware-takeover-deck. */
      #acd-root.canvas #acd-stage { top: 1497px; }
      #acd-root.canvas .acd-cue {
        max-width: none;
        white-space: nowrap;
        background: var(--lemon);
        border-radius: 4px;
        padding: 14px 30px 16px;
        font-size: 35px;
        line-height: 1.2;
        color: var(--rail-cream-ink);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div
      id="acd-root"
      data-composition-id="slideware-caption-dual-mode"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="4"
    >
      <div id="acd-stage" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("acd-root");
        const D = parseFloat(root.dataset.duration) || 4;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          mode: "footage",
          cue1: "", cue2: "", cue3: "", cue4: "", cue5: "", cue6: "",
          at1: 0, at2: 0.8, at3: 1.6, at4: 2.4, at5: 3.2, at6: 4.0,
        };
        // PREVIEW-ONLY sample chain, original Sniper copy (activates only
        // when ALL cues are unset).
        const SAMPLE = { cue1: "cut the pause", cue2: "right *before*", cue3: "the punchline" };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const cueKeys = ["cue1", "cue2", "cue3", "cue4", "cue5", "cue6"];
        const isPreview = cueKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        if (String(vars.mode) === "canvas") root.classList.add("canvas");

        // Build the cue spans (stacked in place — hard replace, no reflow).
        // *asterisk* runs render as inline bold (the only in-line emphasis).
        const stage = document.getElementById("acd-stage");
        const cues = [];
        cueKeys.forEach(function (k, i) {
          const text = (vars[k] == null ? "" : String(vars[k])).trim();
          if (!text) return;
          const el = document.createElement("div");
          el.className = "acd-cue";
          text.split(/(\*[^*]+\*)/).forEach(function (chunk) {
            if (!chunk) return;
            const isBold = chunk.charAt(0) === "*" && chunk.charAt(chunk.length - 1) === "*";
            const node = isBold ? document.createElement("b") : document.createTextNode(chunk);
            if (isBold) node.textContent = chunk.slice(1, -1);
            el.appendChild(node);
          });
          stage.appendChild(el);
          const raw = Number(vars["at" + (i + 1)]);
          const at = isFinite(raw) ? Math.max(0, Math.min(raw, Math.max(0, D - 0.05))) : 0;
          cues.push({ el: el, at: at });
        });
        cues.sort(function (a, b) { return a.at - b.at; });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // HARD REPLACE-PER-CUE: each cue pops ON at its frame and the previous
        // cue clears the SAME frame. No fades anywhere on the layer.
        cues.forEach(function (c, i) {
          if (c.at > 0) {
            tl.set(c.el, { autoAlpha: 0 }, 0);
            tl.set(c.el, { autoAlpha: 1 }, c.at);
          }
          const next = cues[i + 1];
          if (next && next.at > c.at) tl.set(c.el, { autoAlpha: 0 }, next.at);
          else if (next) tl.set(c.el, { autoAlpha: 0 }, 0.0001); // degenerate: same-time cues
        });

        // Keep the paused timeline non-empty even for a single always-on cue.
        tl.set({}, {}, Math.max(0, D - 0.01));

        // Last cue HOLDS to D — no self exit; the compositor owns both seams.
        tl.seek(0);
        window.__timelines["slideware-caption-dual-mode"] = tl;
      })();
    </script>
  </body>
</html>
