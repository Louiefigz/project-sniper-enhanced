<!doctype html>
<html
  lang="en"
  data-composition-variables='[

>
  <!--
    PROJECT SNIPER · Motion template: ANGELA-RECEIPT-CELL (angela pack #3)
    Reference: thumb cell + eye-count view chip — 4/4 studied reels, 60+ chips
    in one reel; the signature proof stamp. Every receipt in the reference is
    a REAL pixel source (a playing clip). Strips / grids / a single showcase.
    Transparent 1080x1920 overlay -> render `--format mov` (ProRes 4444).

    CELL STACK (top-down): optional label chip (olive #697257 semi-opaque,
    r6, white Title-Case ~1.2%H, wraps 2 lines) ABOVE a 9:16 media slot
    ABOVE-LEFT a view chip (near-black ~82% alpha pill, white eye glyph +
    bold count ~1.4%H).

    CONTRACT for the PRODUCER compositing stage:
      - A cell exists when viewsN OR labelN OR mediaN is set. mediaN is a
        web-root path under templates/motion/ (image or video file). VIDEO-IN-
        CELL: a video src becomes a muted `class="clip"` <video> so the
        framework owns playback (reference cells PLAY live clips, never
        stills) — this is the build list's known infra dependency; with no
        media the cell renders a deterministic placeholder thumb.
      - ANIMATION: per-cell 0-FRAME POPS word-locked to atN (strip default
        0.35s L->R; tighten to ~0.1s for the alternating hook-chip build), or
        set every atN to 0 to arrive fully-built ON a cut.
      - EXITS: instant / ON-cut — the comp holds to D; compositor owns seams.
      - corner: "rounded" = r10 + shadow over footage; "square" = square
        corners for use inside lime takeovers.
      - EMPTY-DEFAULTS LAW (G21): labels/views/media default EMPTY — unset
        renders NOTHING; the demo strip activates only when ALL are unset.
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SNIPER · angela-receipt-cell</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="/vendor/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;           /* alpha overlay — the frame owns nothing */
        font-family: var(--font);
      }
      #arc-root { position: relative; width: 1080px; height: 1920px; }

      /* .stage OWNS the centering; per-layout top + flex-wrap width below. */
      #arc-stage {
        position: absolute;
        left: 540px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      #arc-root.strip    #arc-stage { top: 300px;  width: 760px;  gap: 18px; }   /* headroom y0.14-0.35 */
      #arc-root.grid     #arc-stage { top: 560px;  width: 600px;  gap: 22px 20px; }
      #arc-root.showcase #arc-stage { top: 480px;  width: 480px;  gap: 0; }

      .arc-cell {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: opacity;
      }
      /* Olive label chip ABOVE the thumb (Title-Case, wraps 2 lines). */
      .arc-label {
        background: rgba(105, 114, 87, 0.88);   /* olive #697257 semi-opaque */
        border-radius: 6px;
        padding: 6px 12px;
        margin-bottom: 8px;
        max-width: 100%;
        font-size: 23px;                   /* ~1.2%H */
        font-weight: 600;
        line-height: 1.2;
        color: #FFFFFF;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /* 9:16 media slot. rounded = over footage; square = inside takeovers. */
      .arc-media {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
        background: #191d1a;
      }
      #arc-root.square-corners .arc-media { border-radius: 2px; box-shadow: none; }
      .arc-media img, .arc-media video {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      /* Deterministic placeholder thumb (no media path given). */
      .arc-ph { position: absolute; inset: 0; }
      .arc-ph::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
      }
      /* Eye-count view chip BELOW-LEFT of its thumb. */
      .arc-views {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        margin-left: 4px;
        background: rgba(10, 10, 10, 0.82);     /* near-black ~82% alpha */
        border-radius: 6px;
        padding: 7px 14px;
      }
      .arc-views svg { width: 26px; height: 26px; display: block; }
      .arc-views span {
        font-size: 27px;                   /* ~1.4%H */
        font-weight: 700;
        color: #FFFFFF;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="arc-root"
      data-composition-id="angela-receipt-cell"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="3"
    >
      <div id="arc-stage" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("arc-root");
        const D = parseFloat(root.dataset.duration) || 3;

        // Content defaults are EMPTY (G21 — unset renders NOTHING).
        const defaults = {
          layout: "strip", corner: "rounded",
          label1: "", label2: "", label3: "", label4: "", label5: "", label6: "",
          views1: "", views2: "", views3: "", views4: "", views5: "", views6: "",
          media1: "", media2: "", media3: "", media4: "", media5: "", media6: "",
          at1: 0.2, at2: 0.55, at3: 0.9, at4: 1.25, at5: 1.6, at6: 1.95,
        };
        // PREVIEW-ONLY demo strip (activates only when ALL content is unset).
        const SAMPLE = {
          label1: "Day 1", label2: "Day 7", label3: "Day 14", label4: "Day 30",
          views1: "1.2M", views2: "847K", views3: "2.1M", views4: "3.4M",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const contentKeys = [];
        for (let i = 1; i <= 6; i++) contentKeys.push("label" + i, "views" + i, "media" + i);
        const isPreview = contentKeys.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        const layout = ["strip", "grid", "showcase"].indexOf(String(vars.layout)) >= 0
          ? String(vars.layout) : "strip";
        root.classList.add(layout);
        if (String(vars.corner) === "square") root.classList.add("square-corners");
        // Cell width by layout (reference: strip 0.13-0.16W, grid 0.145-0.16W,
        // showcase 0.42W). Cap the cell count per layout.
        const CELL_W = { strip: 162, grid: 173, showcase: 454 }[layout];
        const MAX_CELLS = { strip: 4, grid: 6, showcase: 1 }[layout];

        // Deterministic placeholder hues (no Math.random — fixed per index).
        const PH = [
          "linear-gradient(160deg, #4a5a45 0%, #22281f 100%)",
          "linear-gradient(160deg, #37474f 0%, #1a2226 100%)",
          "linear-gradient(160deg, #5d4a4a 0%, #291f1f 100%)",
          "linear-gradient(160deg, #40514f 0%, #1d2625 100%)",
          "linear-gradient(160deg, #514d3d 0%, #26241c 100%)",
          "linear-gradient(160deg, #444a5e 0%, #1e212b 100%)",
        ];
        const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
        const VIDEO_EXT = /\.(mp4|mov|webm|m4v)$/i;

        const stage = document.getElementById("arc-stage");
        const str = function (v) { return (v == null ? "" : String(v)).trim(); };
        const cells = [];
        let trackIdx = 2;
        for (let i = 1; i <= MAX_CELLS; i++) {
          const label = str(vars["label" + i]);
          const views = str(vars["views" + i]);
          const media = str(vars["media" + i]);
          if (!label && !views && !media) continue;   // unset cell renders NOTHING

          const cell = document.createElement("div");
          cell.className = "arc-cell";
          cell.style.width = CELL_W + "px";
          if (label) {
            const chip = document.createElement("div");
            chip.className = "arc-label";
            chip.textContent = label;
            cell.appendChild(chip);
          }
          const slot = document.createElement("div");
          slot.className = "arc-media";
          if (media && VIDEO_EXT.test(media)) {
            // VIDEO-IN-CELL: framework-owned playback (muted clip element).
            const v = document.createElement("video");
            v.muted = true;
            v.setAttribute("muted", "");
            v.setAttribute("playsinline", "");
            v.className = "clip";
            v.setAttribute("data-start", "0");
            v.setAttribute("data-duration", "60");
            v.setAttribute("data-track-index", String(trackIdx++));
            v.src = media;
            slot.appendChild(v);
          } else if (media) {
            const img = document.createElement("img");
            img.alt = "";
            img.src = media;
            slot.appendChild(img);
          } else {
            const ph = document.createElement("div");
            ph.className = "arc-ph";
            ph.style.background = PH[(i - 1) % PH.length];
            slot.appendChild(ph);
          }
          cell.appendChild(slot);
          if (views) {
            const chip = document.createElement("div");
            chip.className = "arc-views";
            chip.innerHTML = EYE + "<span></span>";
            chip.querySelector("span").textContent = views;
            cell.appendChild(chip);
          }
          stage.appendChild(cell);
          const at = isFinite(Number(vars["at" + i])) ? Number(vars["at" + i]) : 0;
          cells.push({ el: cell, at: Math.max(0, Math.min(at, Math.max(0, D - 0.05))) });
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Per-cell 0-FRAME POPS word-locked to atN — no fades, no slides.
        cells.forEach(function (c) {
          if (c.at <= 0) return;           // atN 0 = fully built ON the cut
          tl.set(c.el, { autoAlpha: 0 }, 0);
          tl.set(c.el, { autoAlpha: 1 }, c.at);
        });

        // Keep the paused timeline non-empty for an all-on-the-cut build.
        tl.set({}, {}, Math.max(0, D - 0.01));

        // No self exit — instant clear ON the compositor's cut (window end).
        tl.seek(0);
        window.__timelines["angela-receipt-cell"] = tl;
      })();
    </script>
  </body>
</html>
