<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow microtext (mono caps + accent dot; empty = omit)","default":""},
    {"id":"eyebrowAccent","type":"enum","label":"Eyebrow dot semantic accent","default":"process","options":[{"value":"process","label":"Process (cyan)"},{"value":"result","label":"Result (lime)"}]},
    {"id":"contextChips","type":"string","label":"Context chip row, pipe-separated (ONE RUN|13 TASKS|THIS MACHINE; empty = omit)","default":""},
    {"id":"heroValue","type":"string","label":"Hero metric (giant lime; a trailing % renders smaller)","default":""},
    {"id":"heroLabel","type":"string","label":"Hero metric label (mono caps under the number)","default":""},
    {"id":"tiles","type":"string","label":"Outlined stat tiles, pipe-separated: value~label (7~WINS|5~TIES|1~LOSS; empty = omit)","default":""},
    {"id":"stripChips","type":"string","label":"Per-item chip strip, pipe-separated: label~state (state: win|tie|loss; empty = omit)","default":""},
    {"id":"limitLabel","type":"string","label":"Limit footer label (amber mono)","default":"LIMIT"},
    {"id":"limitText","type":"string","label":"Limit footer caveat text (empty = no footer)","default":""},
    {"id":"moduleLands","type":"string","label":"Narration-paced lands (s, comp-relative, pipe/comma) — one per PRESENT module [head, hero, tiles, strip, limit]; empty = 0.2 + k*0.9","default":""},
    {"id":"exit","type":"enum","label":"Exit","default":"hold","options":[{"value":"hold","label":"Hold to end (compositor owns the seam)"},{"value":"blur-recede","label":"Blur-recede 0.15s (stage only — the canvas never flashes)"}]},
    {"id":"presenterFrame","type":"boolean","label":"Framed presenter container: mask the reserved right band into a rounded face hole + draw the card ring (compositor fills it with the speaker; forces alpha + longform own-screen)","default":false}
  ]'
>
  <!--
    PROJECT SNIPER · LONG-FORM template: NATEHERK-SCOREBOARD (16:9, 1920x1080)
    Reference: docs/studies/NATEHERK_CARDS.md §1.2 form #11 — big-number scoreboard
    (DARK chassis), 78.5-94.0s:
      `• SMALL LOCAL CHECK`; chip row ONE RUN / 13 TASKS / THIS MACHINE;
      giant lime `97%` + mono label; 3 outlined stat tiles 7 WINS / 5 TIES /
      1 LOSS; 13-chip strip color-coded (01-07 lime win, 08-12 teal tie,
      13 amber loss); footer `LIMIT(amber) | Not proof it wins everything.`
    Build (measured): hero -> tiles -> chip sweep (~1 per 85ms, STUDY MG-4)
    -> limit footer; THE STRIP LANDS SECONDS AFTER THE 97% (§1.3 "a card is
    a live surface" — the default 0.9s module cadence + sweep delivers that).
    Info pattern: hero metric + stat tiles + per-item color ledger +
    limitation footer — the "single number + distribution + honest caveat"
    payoff card (§1.4). Evidence frames: contact sheet states 031_t0083 /
    032_t0084. Timing +-1 frame (~40ms); N=1 priors.

    CONTRACT for the PRODUCER compositing stage:
      - anchor "own-screen" OPAQUE takeover (render --format mp4): near-black
        canvas + faint grid on a full-bleed CHILD, opaque from frame 0.
      - NO FACE HOLE this wave (STUDY §5 item 9 "PIP slot EXCLUDED"
        precedent); content column matches nateherk-takeover's stage (left
        96px, width 1130px) so the right band [1344..1878] stays clear for a
        later pip_hole registration with zero content reflow.
      - Semantics: lime --accent-result = hero + wins, cyan/teal
        --accent-process = ties, amber = LOSSES + the LIMIT footer ONLY
        (§1.1 "amber is reserved"). Amber hex: the study fixes amber's ROLE,
        not a value — --accent-warn fallback #e8a13c, brand-overridable.
      - stripChips states are a closed vocabulary (win|tie|loss) — an unknown
        state FAILS LOUDLY (never silently gray). The strip sweeps L->R at
        CHIP_SWEEP_S=0.085 (~85ms/chip, MG-4: 13 chips over ~1.1s).
      - moduleLands: one land per PRESENT module in order [head, hero,
        tiles, strip, limit]. Count mismatch FAILS LOUDLY. Empty = 0.2 +
        k*0.9 default cadence. The LIMIT caveat lands LAST (§1.3 "receipts
        AND caveats land last").
      - UNSET content renders NOTHING (G21); the SAMPLE (form #11 verbatim)
        activates only when EVERY content variable is unset.
      - RENDER LENGTH is the root data-duration ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it).
      - exit:"blur-recede" (T-D): stage only; the canvas stays opaque.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · nateherk-scoreboard</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="/motion-tokens.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #nsb-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #nsb-stage-layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }

      #nsb-canvas {
        position: absolute; inset: 0;
        background-color: var(--nateherk-canvas, #0c1014);
        background-image:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 96px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 96px);
      }

      /* FRAMED PRESENTER-CONTAINER (opt-in: spec.presenterFrame). When the
         root carries .has-presenter, mask the canvas out of the reserved right
         band into a rounded hole (SVG evenodd) the compositor fills with the
         speaker's face, and draw #nsb-face-slot as the card ring. Geometry is
         copied VERBATIM from nateherk-takeover and MUST equal
         graphics.pip_hole.HOLE_BY_KIND["nateherk-scoreboard"] (1344,60,534,960,
         r24). WITHOUT the class the canvas is opaque — renders exactly as before. */
      #nsb-root.has-presenter #nsb-canvas {
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0h1920v1080H0z M1368 60h486a24 24 0 0 1 24 24v912a24 24 0 0 1 -24 24h-486a24 24 0 0 1 -24 -24V84a24 24 0 0 1 24 -24z'/></svg>");
      }
      #nsb-face-slot { display: none; }
      #nsb-root.has-presenter #nsb-face-slot {
        display: block;
        position: absolute;
        left: 1344px; top: 60px; width: 534px; height: 960px;
        border-radius: 24px;
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.10);
      }

      /* Content column — nateherk-takeover stage geometry (PIP band clear). */
      #nsb-stage {
        position: absolute;
        left: 96px; top: 0; width: 1130px; height: 1080px;
        padding: 96px 0;
        display: flex; flex-direction: column;
        justify-content: center;
        gap: 44px;
      }
      .module { will-change: opacity; }

      #nsb-eyebrow {
        display: flex; align-items: center; gap: 16px;
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 34px; line-height: 1;
        letter-spacing: 5px; text-transform: uppercase;
        color: var(--accent-process, #35b6d9);
      }
      #nsb-eyebrow .dot {
        width: 13px; height: 13px; border-radius: 50%;
        background: var(--accent-process, #35b6d9);
        flex: 0 0 auto;
      }
      #nsb-eyebrow.result, #nsb-eyebrow.result .dot { color: var(--accent-result, #c6f542); }
      #nsb-eyebrow.result .dot { background: var(--accent-result, #c6f542); }

      #nsb-context { display: flex; gap: 16px; }
      .ctx-chip {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 7px;
        padding: 10px 16px;
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 18px;
        letter-spacing: 3px; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        will-change: opacity;
      }

      /* Hero metric row: giant lime number left, outlined tiles beside it
         (evidence 031_t0083: 97% left, 7/5/1 tiles right on the same row). */
      #nsb-hero-row { display: flex; align-items: center; gap: 70px; }
      #nsb-hero { display: flex; flex-direction: column; gap: 14px; }
      #nsb-hero-value {
        font-weight: 900;
        font-size: 230px;
        line-height: 0.92;
        letter-spacing: -6px;
        color: var(--accent-result, #c6f542);
        will-change: opacity;
      }
      #nsb-hero-value .unit { font-size: 96px; letter-spacing: -2px; }
      #nsb-hero-label {
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 25px;
        letter-spacing: 3.5px; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      #nsb-tiles { display: flex; gap: 22px; }
      .nsb-tile {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.02);
        padding: 26px 34px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        min-width: 130px;
        will-change: opacity;
      }
      .nsb-tile .value {
        font-weight: 800; font-size: 66px; line-height: 1;
        letter-spacing: -1px;
        color: #ffffff;
      }
      .nsb-tile .label {
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 17px;
        letter-spacing: 3px; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }

      /* Text heroes such as PROMPTS are wider than numeric metrics. Stack the
         tiles below them so every revealed module stays inside the 1130px
         content column and never crosses the presenter hole at x=1344. */
      #nsb-root.word-hero #nsb-hero-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 22px;
      }
      #nsb-root.word-hero #nsb-hero-value {
        font-size: 168px;
        letter-spacing: -4px;
      }
      #nsb-root.word-hero #nsb-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        width: 100%;
      }
      #nsb-root.word-hero .nsb-tile {
        min-width: 0;
        padding: 18px 24px;
      }
      #nsb-root.word-hero .nsb-tile .value { font-size: 44px; }

      /* Per-item color ledger: win lime / tie teal / loss amber (§1.1 —
         amber only for the losses and the LIMIT footer). */
      #nsb-strip { display: flex; flex-wrap: wrap; gap: 12px; }
      .strip-chip {
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 19px;
        letter-spacing: 2px;
        border-radius: 6px;
        padding: 10px 14px;
        border: 1px solid transparent;
        will-change: opacity;
      }
      .strip-chip.win {
        color: var(--accent-result, #c6f542);
        border-color: color-mix(in srgb, var(--accent-result, #c6f542) 45%, transparent);
        background: color-mix(in srgb, var(--accent-result, #c6f542) 12%, transparent);
      }
      .strip-chip.tie {
        color: var(--accent-process, #35b6d9);
        border-color: color-mix(in srgb, var(--accent-process, #35b6d9) 45%, transparent);
        background: color-mix(in srgb, var(--accent-process, #35b6d9) 12%, transparent);
      }
      .strip-chip.loss {
        color: var(--accent-warn, #e8a13c);
        border-color: color-mix(in srgb, var(--accent-warn, #e8a13c) 45%, transparent);
        background: color-mix(in srgb, var(--accent-warn, #e8a13c) 12%, transparent);
      }

      /* LIMIT footer: amber mono label | hairline divider | gray caveat. */
      #nsb-limit {
        display: flex; align-items: center; gap: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding-top: 24px;
      }
      #nsb-limit-label {
        font-family: var(--eyebrow-font);
        font-weight: 700; font-size: 26px;
        letter-spacing: 3.5px; text-transform: uppercase;
        color: var(--accent-warn, #e8a13c);
        flex: 0 0 auto;
      }
      #nsb-limit-divider {
        width: 1px; height: 26px;
        background: rgba(255, 255, 255, 0.2);
        flex: 0 0 auto;
      }
      #nsb-limit-text {
        font-weight: 600; font-size: 34px; line-height: 1.2;
        color: rgba(255, 255, 255, 0.78);
      }
    </style>
  </head>
  <body>
    <div
      id="nsb-root"
      data-composition-id="nateherk-scoreboard"
      data-width="1920"
      data-height="1080"
      data-duration="10"
    >
      <div id="nsb-canvas"></div>
      <div id="nsb-stage-layer">
        <div id="nsb-stage">
          <div id="nsb-eyebrow" class="module clip" data-start="0" data-duration="60" data-track-index="1"><span class="dot"></span><span id="nsb-eyebrow-text"></span></div>
          <div id="nsb-context" class="module clip" data-start="0" data-duration="60" data-track-index="2"></div>
          <div id="nsb-hero-row" class="module clip" data-start="0" data-duration="60" data-track-index="3">
            <div id="nsb-hero">
              <div id="nsb-hero-value"></div>
              <div id="nsb-hero-label"></div>
            </div>
            <div id="nsb-tiles"></div>
          </div>
          <div id="nsb-strip" class="module clip" data-start="0" data-duration="60" data-track-index="4"></div>
          <div id="nsb-limit" class="module clip" data-start="0" data-duration="60" data-track-index="5">
            <span id="nsb-limit-label"></span><span id="nsb-limit-divider"></span><span id="nsb-limit-text"></span>
          </div>
        </div>
      </div>
      <div id="nsb-face-slot"></div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("nsb-root");
        const D = parseFloat(root.dataset.duration) || 10;
        const M = window.__motionTokens;

        // Measured payoff constants:
        const CHIP_SWEEP_S = 0.085;   // MG-4: ~1 chip per 85ms, L->R
        const CTX_STAGGER_S = 0.1;    // context chips (MG-2 80-120ms band)
        const TILE_STAGGER_S = 0.1;   // stat tiles (same fan-out band)
        const LAND_DEFAULT_START_S = 0.2;
        const LAND_DEFAULT_GAP_S = 0.9;

        const STATES = ["win", "tie", "loss"];
        const defaults = {
          eyebrow: "", eyebrowAccent: "process", contextChips: "",
          heroValue: "", heroLabel: "", tiles: "", stripChips: "",
          limitLabel: "LIMIT", limitText: "",
          moduleLands: "", exit: "hold", presenterFrame: false,
        };
        const CONTENT_KEYS = ["eyebrow", "contextChips", "heroValue",
          "heroLabel", "tiles", "stripChips", "limitText"];
        // PREVIEW-ONLY demo — form #11 verbatim (78.5-94.0s).
        const SAMPLE = {
          eyebrow: "SMALL LOCAL CHECK",
          contextChips: "ONE RUN|13 TASKS|THIS MACHINE",
          heroValue: "97%", heroLabel: "AVAILABLE OBJECTIVE POINTS",
          tiles: "7~WINS|5~TIES|1~LOSS",
          stripChips: "01~win|02~win|03~win|04~win|05~win|06~win|07~win|" +
            "08~tie|09~tie|10~tie|11~tie|12~tie|13~loss",
          limitText: "Not proof it wins everything.",
        };
        const HF = window.__hyperframes;
        let vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        const isPreview = CONTENT_KEYS.every(function (k) {
          return !(vars[k] == null ? "" : String(vars[k])).trim();
        });
        if (isPreview) vars = Object.assign({}, vars, SAMPLE);

        // Framed presenter container: opt-in mask + ring (mirrors how the
        // comp reads exit). The canvas mask + #nsb-face-slot ring are scoped
        // to .has-presenter; absent it the card renders opaque as before.
        if (vars.presenterFrame === true || String(vars.presenterFrame) === "true") {
          root.classList.add("has-presenter");
        }

        function str(k) { return (vars[k] == null ? "" : String(vars[k])).trim(); }

        // ---- Fill / prune modules (unset content renders NOTHING) ----
        const ebText = str("eyebrow");
        const ebEl = document.getElementById("nsb-eyebrow");
        if (ebText) {
          document.getElementById("nsb-eyebrow-text").textContent = ebText;
          if (str("eyebrowAccent") === "result") ebEl.classList.add("result");
        } else { ebEl.remove(); }

        const ctxEl = document.getElementById("nsb-context");
        const ctxTexts = str("contextChips") ? str("contextChips").split("|")
          .map(function (s) { return s.trim(); }).filter(Boolean) : [];
        const ctxEls = ctxTexts.map(function (t) {
          const el = document.createElement("span");
          el.className = "ctx-chip";
          el.textContent = t;
          ctxEl.appendChild(el);
          return el;
        });
        if (!ctxEls.length) ctxEl.remove();

        // Hero metric: a trailing % renders as a smaller unit glyph
        // (typography only — evidence 031_t0083's smaller % on the 97).
        const heroRowEl = document.getElementById("nsb-hero-row");
        const heroValue = str("heroValue");
        const heroValueEl = document.getElementById("nsb-hero-value");
        if (heroValue) {
          if (!/^[+-]?[0-9.,]+%?$/.test(heroValue)) root.classList.add("word-hero");
          if (heroValue.charAt(heroValue.length - 1) === "%") {
            heroValueEl.textContent = heroValue.slice(0, -1);
            const unit = document.createElement("span");
            unit.className = "unit";
            unit.textContent = "%";
            heroValueEl.appendChild(unit);
          } else {
            heroValueEl.textContent = heroValue;
          }
          const hl = str("heroLabel");
          if (hl) document.getElementById("nsb-hero-label").textContent = hl;
          else document.getElementById("nsb-hero-label").remove();
        } else {
          document.getElementById("nsb-hero").remove();
        }

        // Outlined stat tiles: value~label.
        const tilesEl = document.getElementById("nsb-tiles");
        const tilesRaw = str("tiles");
        const tileEls = [];
        if (tilesRaw) {
          tilesRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length < 2 || !f[0] || !f[1]) {
              throw new Error("nateherk-scoreboard: tile " + (i + 1) +
                " needs value~label, got '" + line + "'");
            }
            const tile = document.createElement("div");
            tile.className = "nsb-tile";
            const v = document.createElement("span");
            v.className = "value";
            v.textContent = f[0];
            const l = document.createElement("span");
            l.className = "label";
            l.textContent = f[1];
            tile.appendChild(v);
            tile.appendChild(l);
            tilesEl.appendChild(tile);
            tileEls.push(tile);
          });
        } else { tilesEl.remove(); }
        if (!heroValue && !tileEls.length) heroRowEl.remove();

        // Color-coded chip strip: label~state, closed vocabulary.
        const stripEl = document.getElementById("nsb-strip");
        const stripRaw = str("stripChips");
        const stripEls = [];
        if (stripRaw) {
          stripRaw.split("|").forEach(function (line, i) {
            const f = line.split("~").map(function (s) { return s.trim(); });
            if (f.length !== 2 || !f[0] || STATES.indexOf(f[1]) < 0) {
              throw new Error("nateherk-scoreboard: stripChips " + (i + 1) +
                " needs label~state with state in " + STATES.join("|") +
                ", got '" + line + "'");
            }
            const chip = document.createElement("span");
            chip.className = "strip-chip " + f[1];
            chip.textContent = f[0];
            stripEl.appendChild(chip);
            stripEls.push(chip);
          });
        } else { stripEl.remove(); }

        const limitText = str("limitText");
        const limitEl = document.getElementById("nsb-limit");
        if (limitText) {
          document.getElementById("nsb-limit-label").textContent =
            str("limitLabel") || "LIMIT";
          document.getElementById("nsb-limit-text").textContent = limitText;
        } else { limitEl.remove(); }

        // Fail loudly if any scoreboard module escapes the content stage or
        // intrudes into the presenter band. This checks the settled DOM boxes,
        // including dynamically generated tiles, before Hyperframes records.
        if (root.classList.contains("has-presenter")) {
          const stageRight = 1226;
          [ctxEl, heroRowEl, stripEl, limitEl].forEach(function (module) {
            if (!module || !module.isConnected) return;
            const box = module.getBoundingClientRect();
            if (box.left < 0 || box.right > stageRight || box.top < 0 || box.bottom > 1080) {
              throw new Error("nateherk-scoreboard: module crosses PIP-safe bounds: " +
                JSON.stringify({ left: box.left, right: box.right,
                  top: box.top, bottom: box.bottom, stageRight: stageRight }));
            }
          });
        }

        // ---- Narration-paced lands ([head, hero, tiles, strip, limit]) ----
        const modules = [];
        if (ebText || ctxEls.length) modules.push("head");
        if (heroValue) modules.push("hero");
        if (tileEls.length) modules.push("tiles");
        if (stripEls.length) modules.push("strip");
        if (limitText) modules.push("limit");
        let lands = [];
        const landsVar = vars.moduleLands;
        const landsRaw = Array.isArray(landsVar)
          ? landsVar.map(String) : String(landsVar == null ? "" : landsVar).trim()
            ? String(landsVar).split(/[|,]/) : [];
        if (landsRaw.length) {
          lands = landsRaw.map(function (s) { return parseFloat(s); });
          if (lands.length !== modules.length || lands.some(function (t) { return !isFinite(t); })) {
            throw new Error("nateherk-scoreboard: moduleLands needs " +
              modules.length + " finite times for modules [" +
              modules.join(", ") + "], got '" + landsRaw.join(",") + "'");
          }
        } else {
          modules.forEach(function (_, k) {
            lands.push(LAND_DEFAULT_START_S + k * LAND_DEFAULT_GAP_S);
          });
        }
        const landOf = {};
        modules.forEach(function (name, k) { landOf[name] = lands[k]; });

        // ---- Build: hero -> tiles -> chip sweep -> limit (form #11) ----
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        if (landOf.head != null) {
          const t0 = landOf.head;
          let at = t0;
          if (ebText) {
            M.textRamp(tl, ebEl, t0);
            at = t0 + M.EYEBROW_LEAD_S;         // eyebrow leads (rank 3)
          }
          if (ctxEls.length) {
            M.textRamp(tl, ctxEl, at);
            ctxEls.forEach(function (el, i) {
              M.textRamp(tl, el, at + i * CTX_STAGGER_S);
            });
          }
        }

        if (landOf.hero != null) {
          M.textRamp(tl, heroRowEl, landOf.hero);
          M.textRamp(tl, document.getElementById("nsb-hero"), landOf.hero);
        }
        if (landOf.tiles != null) {
          if (landOf.hero == null) M.textRamp(tl, heroRowEl, landOf.tiles);
          M.textRamp(tl, tilesEl, landOf.tiles);
          tileEls.forEach(function (el, i) {
            M.textRamp(tl, el, landOf.tiles + i * TILE_STAGGER_S);
          });
        }

        // The strip lands SECONDS after the hero (its own land), then sweeps
        // L->R at 85ms/chip (MG-4: 13 chips over ~1.1s).
        if (landOf.strip != null) {
          M.textRamp(tl, stripEl, landOf.strip);
          stripEls.forEach(function (el, i) {
            M.textRamp(tl, el, landOf.strip + i * CHIP_SWEEP_S);
          });
        }

        // The honest caveat lands LAST (§1.3).
        if (landOf.limit != null) M.textRamp(tl, limitEl, landOf.limit);

        // exit:"blur-recede" (T-D): stage only; the canvas stays opaque.
        if (String(vars.exit) === "blur-recede") {
          M.blurRecede(tl, "#nsb-stage-layer", D - M.EXIT_BLUR_S);
        }

        tl.seek(0);
        window.__timelines["nateherk-scoreboard"] = tl;
      })();
    </script>
  </body>
</html>
