<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow (small-caps, accent)","default":"The plan"},
    {"id":"title","type":"string","label":"Big title (e.g. 3 Steps)","default":"3 Steps"},
    {"id":"num1","type":"string","label":"Step 1 chip label","default":"1"},
    {"id":"title1","type":"string","label":"Step 1 title (empty = omit row)","default":"Pick your target"},
    {"id":"sub1","type":"string","label":"Step 1 subtitle","default":"the next 90 days"},
    {"id":"num2","type":"string","label":"Step 2 chip label","default":"2"},
    {"id":"title2","type":"string","label":"Step 2 title (empty = omit row)","default":"Get help"},
    {"id":"sub2","type":"string","label":"Step 2 subtitle","default":"even cheap help"},
    {"id":"num3","type":"string","label":"Step 3 chip label","default":"3"},
    {"id":"title3","type":"string","label":"Step 3 title (empty = omit row)","default":"Ship weekly"},
    {"id":"sub3","type":"string","label":"Step 3 subtitle","default":"one every week"},
    {"id":"num4","type":"string","label":"Step 4 chip label","default":"4"},
    {"id":"title4","type":"string","label":"Step 4 title (empty = omit row)","default":""},
    {"id":"sub4","type":"string","label":"Step 4 subtitle","default":""},
    {"id":"num5","type":"string","label":"Step 5 chip label","default":"5"},
    {"id":"title5","type":"string","label":"Step 5 title (empty = omit row)","default":""},
    {"id":"sub5","type":"string","label":"Step 5 subtitle","default":""},
    {"id":"accent","type":"color","label":"Accent (eyebrow, chip 1, title glow)","default":"#054BC9"}
  ]'
>
  <!--
    PROJECT SNIPER · Motion template: AGENDA-SLIDE (batch 2, from the edited
    long-form's "title / agenda slide" treatment — LONGFORM_VISUAL_STUDY §3,
    reference frames 473.5s / 495.5s in validate_cards.jpg: a big "3 Steps" title
    with a glowing underline over numbered steps). "N Steps" chapter takeover.
    Reuses GLASS-RAIL row mechanics (numbered chips stamp in top->bottom,
    back.out + 0.12 stagger) but on a DARK theme; the reference's magenta title
    glow is recolored to the Project Sniper accent.
    OPAQUE 1920x1080 -> render with `--format mp4` (H.264, anchor "own-screen").

    CONTRACT for the PRODUCER + graphics_stage:
      - eyebrow + title header, then up to 5 numbered rows (numN chip / titleN /
        subN). An empty titleN OMITS that row and the stack re-centers.
      - Number chips cycle a fixed on-brand rotation (chip 1 = accent). The title
        carries an accent glow underline that draws out (the reference's signature).
      - The dark field lives on a full-bleed CHILD and is OPAQUE from frame 0 (no
        base-video flash at the takeover seam). Header builds first, rows stamp in
        staggered; HOLDS to the end (compositor owns the seam).
      - RENDER LENGTH is the root `data-duration` ATTRIBUTE (graphics_render
        rewrites it per window; --variables never sets it — see stat-card note).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SNIPER · agenda-slide</title>
    <link rel="stylesheet" href="/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --slate-lite: #aeb8d4; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font);
      }
      #ag-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* Dark field on a CHILD — opaque from frame 0 (no seam flash). */
      #ag-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(1500px 1100px at 960px 360px, #172445 0%, #0b1024 48%, #05070f 100%);
      }

      #ag-stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 56px;
        padding: 90px 130px;
      }
      #ag-header { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #ag-eyebrow {
        font-weight: 700; font-size: 34px; line-height: 1;
        letter-spacing: 3px; text-transform: uppercase;
        color: var(--accent);
        will-change: transform, opacity;
      }
      #ag-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      #ag-title {
        font-weight: 900; font-size: 132px; line-height: 0.98;
        letter-spacing: -3px; color: #ffffff;
        text-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        will-change: transform, opacity;
      }
      /* Accent glow underline (the reference's magenta rule, recolored). */
      #ag-underline {
        width: 320px; height: 12px; border-radius: 8px;
        background: var(--accent);
        box-shadow: 0 0 26px 2px var(--accent), 0 0 60px 6px var(--accent);
        transform-origin: center;
        will-change: transform, opacity;
      }
      #ag-rows { display: flex; flex-direction: column; gap: 22px; }
      .ag-row {
        display: flex; align-items: center; gap: 30px;
        will-change: transform, opacity;
      }
      .ag-chip {
        flex: 0 0 auto;
        width: 88px; height: 88px; border-radius: 24px;
        color: #ffffff; font-weight: 900; font-size: 46px; line-height: 1;
        letter-spacing: -1px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        will-change: transform;
      }
      .ag-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .ag-title-row {
        font-weight: 900; font-size: 52px; line-height: 1.02;
        letter-spacing: -1px; color: #ffffff; white-space: nowrap;
      }
      .ag-sub {
        font-weight: 600; font-size: 30px; line-height: 1.05;
        color: var(--slate-lite); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="ag-root"
      data-composition-id="agenda-slide"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div id="ag-bg"></div>
      <div id="ag-stage">
        <div id="ag-header">
          <div id="ag-eyebrow" class="clip" data-start="0" data-duration="60" data-track-index="1"></div>
          <div id="ag-title-wrap">
            <div id="ag-title" class="clip" data-start="0" data-duration="60" data-track-index="2"></div>
            <div id="ag-underline" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
          </div>
        </div>
        <div id="ag-rows">
          <div id="ag-row-1" class="ag-row clip" data-slot="1" data-start="0" data-duration="60" data-track-index="4">
            <span class="ag-chip"></span>
            <span class="ag-body"><span class="ag-title-row"></span><span class="ag-sub"></span></span>
          </div>
          <div id="ag-row-2" class="ag-row clip" data-slot="2" data-start="0" data-duration="60" data-track-index="5">
            <span class="ag-chip"></span>
            <span class="ag-body"><span class="ag-title-row"></span><span class="ag-sub"></span></span>
          </div>
          <div id="ag-row-3" class="ag-row clip" data-slot="3" data-start="0" data-duration="60" data-track-index="6">
            <span class="ag-chip"></span>
            <span class="ag-body"><span class="ag-title-row"></span><span class="ag-sub"></span></span>
          </div>
          <div id="ag-row-4" class="ag-row clip" data-slot="4" data-start="0" data-duration="60" data-track-index="7">
            <span class="ag-chip"></span>
            <span class="ag-body"><span class="ag-title-row"></span><span class="ag-sub"></span></span>
          </div>
          <div id="ag-row-5" class="ag-row clip" data-slot="5" data-start="0" data-duration="60" data-track-index="8">
            <span class="ag-chip"></span>
            <span class="ag-body"><span class="ag-title-row"></span><span class="ag-sub"></span></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        const root = document.getElementById("ag-root");
        const D = parseFloat(root.dataset.duration) || 5;

        const defaults = {
          eyebrow: "The plan", title: "3 Steps",
          num1: "1", title1: "Pick your target", sub1: "the next 90 days",
          num2: "2", title2: "Get help", sub2: "even cheap help",
          num3: "3", title3: "Ship weekly", sub3: "one every week",
          num4: "4", title4: "", sub4: "",
          num5: "5", title5: "", sub5: "",
          accent: "#054BC9",
        };
        const HF = window.__hyperframes;
        const vars = Object.assign({}, defaults, HF && HF.getVariables ? HF.getVariables() : {});
        document.documentElement.style.setProperty("--accent", vars.accent);

        // Chip 1 = accent; rows 2..5 rotate a fixed on-brand palette (as glass-rail).
        const CHIP_COLORS = [vars.accent, "#3B82F6", "#7C5CF0", "#E8895A", "#E85AA8"];

        const eyebrow = document.getElementById("ag-eyebrow");
        const ebText = (vars.eyebrow == null ? "" : String(vars.eyebrow)).trim();
        if (ebText) eyebrow.textContent = ebText; else eyebrow.remove();
        document.getElementById("ag-title").textContent = String(vars.title);

        // Fill / prune the five rows; an empty titleN drops that row.
        const rows = Array.prototype.slice.call(document.querySelectorAll(".ag-row"));
        const active = [];
        rows.forEach(function (row, i) {
          const n = i + 1;
          const title = (vars["title" + n] == null ? "" : String(vars["title" + n])).trim();
          if (!title) { row.remove(); return; }
          row.querySelector(".ag-title-row").textContent = title;
          const sub = (vars["sub" + n] == null ? "" : String(vars["sub" + n])).trim();
          const subEl = row.querySelector(".ag-sub");
          if (sub) subEl.textContent = sub; else subEl.remove();
          const chip = row.querySelector(".ag-chip");
          chip.textContent = (vars["num" + n] == null ? String(n) : String(vars["num" + n])).trim() || String(n);
          chip.style.background = CHIP_COLORS[i % CHIP_COLORS.length];
          active.push({ row: row, chip: chip });
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Header builds first: eyebrow -> title -> underline draws out.
        if (ebText) {
          tl.set(eyebrow, { opacity: 0, y: 16 }, 0);
          tl.to(eyebrow, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0);
        }
        tl.set("#ag-title", { opacity: 0, y: 24 }, 0);
        tl.to("#ag-title", { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 0.12);
        tl.set("#ag-underline", { opacity: 0, scaleX: 0 }, 0);
        tl.to("#ag-underline", { opacity: 1, scaleX: 1, duration: 0.44, ease: "power2.out" }, 0.32);

        // Rows stamp in top->bottom (glass-rail mechanics: back.out + 0.12 stagger).
        const STAGGER = 0.12;
        active.forEach(function (a, i) {
          const at = 0.5 + i * STAGGER;
          const land = Math.min(at, Math.max(0, D - 0.6));
          tl.set(a.row, { opacity: 0, y: 26, scale: 0.95 }, 0);
          tl.set(a.chip, { scale: 0.3 }, 0);
          tl.to(a.row, { opacity: 1, y: 0, scale: 1, duration: 0.44, ease: "back.out(1.6)" }, land);
          tl.to(a.chip, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, land + 0.08);
        });
        // HOLDS to the end — opaque takeover; compositor owns the seam.

        tl.seek(0);
        window.__timelines["agenda-slide"] = tl;
      })();
    </script>
  </body>
</html>
